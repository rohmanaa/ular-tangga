<!DOCTYPE html>
<html lang="id"><head><script src="assets/js/frame-guard.js"></script><script src="assets/js/session.js"></script><script src="assets/js/boot-guard.js"></script><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Room</title><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/ng/css/common.css"><link rel="stylesheet" href="assets/ng/css/room.css"><link rel="stylesheet" href="assets/ng/css/bg.css">
<script src="assets/js/prefs.js"></script><script src="assets/js/prefs-sync.js"></script>
<link rel="stylesheet" href="assets/css/pages/room.css">
</head>
<body class="dm">
<div id="wrap">
<div id="stage">
  <div id="sun"></div><div id="vig"></div>

  <button id="back" aria-label="Kembali ke Mode"><img class="bg" src="assets/ng/komponen/tombol-dan-kontrol/tombol-rumah-abu.webp" alt=""></button>
  <div id="title" class="ttl">GAME ROOM</div>
  <div id="chips"></div>
  <button class="btn" id="leave" aria-label="Keluar ke lobby"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-merah-polos.webp" alt=""><span>KELUAR</span></button>

  <section class="panel" id="equip"><h3>EQUIPMENT</h3><div class="grid" id="eq"></div></section>
  <section class="panel" id="power"><h3>POWER <button type="button" id="powerPage" aria-label="Buka Power-up" title="Power-up"><img src="assets/ng/komponen/ikon-gem-medali/petir-ungu.webp" alt=""></button></h3><div id="pcnt"></div><div class="row" id="prow" aria-label="Lima slot Power"></div><div class="info" id="pinfo"></div></section>
  <section class="panel" id="mapi"><h3>MAP INFORMATION</h3><div class="pic" id="mArt"></div><div class="txt" id="mTxt"></div></section>

  <section class="panel" id="players"><h3>PLAYER ROOM</h3>
    <div id="bar">
      <div id="code"><span id="codeLbl"></span><b id="codeV">------</b><button id="cp1" hidden>SALIN</button></div>
      <button class="btn bsm" id="invB" hidden><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-ungu-polos.webp" alt=""><span>AKSES</span></button>
      <button class="btn bsm" id="invD" hidden><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-biru-polos.webp" alt=""><span>INVITE</span></button>
    </div>
    <div id="list"></div>
    <div id="foot"><div id="why"></div>
      <div id="acts">
        <button class="btn" id="rdy"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-hijau-polos.webp" alt=""><span>READY</span></button>
        <button class="btn gold" id="start"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-kuning-polos.webp" alt=""><span>START GAME</span></button>
      </div></div>
    <span id="cnt" hidden></span>
  </section>

  <div class="modal" id="pm"><div class="box" role="dialog" aria-modal="true" aria-labelledby="pmT"><h2 class="ttl" id="pmT">PILIH POWER</h2><div class="igrid" id="pmL"></div>
    <div class="mfoot"><span class="hint" id="pmHint"></span><button class="btn" id="pdone" style="width:240px;height:84px"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-hijau-polos.webp" alt=""><span>SELESAI</span></button></div></div></div>

  <div class="modal" id="inv"><div class="box" role="dialog" aria-modal="true" aria-label="Akses room" style="width:900px"><h2 class="ttl">AKSES ROOM</h2>
    <div class="sw"><button id="sPriv">PRIVAT</button><button id="sPub">PUBLIK</button></div>
    <div class="row2"><div class="field" id="icode"></div><button class="btn cp" id="cCode"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-ungu-polos.webp" alt=""><span>KODE</span></button></div>
    <div class="row2"><div class="field">Link undangan</div><button class="btn cp" id="cLink"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-ungu-polos.webp" alt=""><span>LINK</span></button></div>
    <div class="fl" id="fl"></div>
    <div class="mfoot"><span class="hint" id="slotInfo"></span><button class="btn" id="invX" style="width:240px;height:84px"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-abu-polos.webp" alt=""><span>TUTUP</span></button></div></div></div>

  <div class="modal" id="dr" aria-hidden="true"><div class="box" role="dialog" aria-modal="true" aria-label="Undang Teman"><h2 class="ttl">UNDANG TEMAN</h2>
    <div class="sw"><button id="dTf">TEMAN ONLINE</button><button id="dTp">PEMAIN ONLINE</button></div>
    <div class="fl" id="drL"></div>
    <div class="mfoot"><span class="hint" id="drCnt"></span><button class="btn" id="drX" style="width:240px;height:84px"><img src="assets/ng/komponen/tombol-dan-kontrol/tombol-abu-polos.webp" alt=""><span>TUTUP</span></button></div></div></div>

  <div id="toast"></div>
</div>
<div id="pageModal" role="dialog" aria-modal="true" aria-label="Halaman equipment" aria-hidden="true" aria-busy="false">
  <div id="pageModalLoading" role="status" aria-label="Memuat"><img src="assets/ng/komponen/hud/efek-titik-berputar.webp" alt=""></div>
  <iframe id="pageModalFrame" title="Equipment" tabindex="0" allow="fullscreen; autoplay"></iframe>
</div>
</div>

<script src="assets/js/item-registry.js"></script><script src="data/inventory/dice/klasik/manifest.js"></script><script src="data/inventory/dice/rumput/manifest.js"></script><script src="data/inventory/dice/tnt/manifest.js"></script><script src="data/inventory/dice/wood/manifest.js"></script><script src="data/inventory/dice/stone/manifest.js"></script><script src="data/inventory/dice/copper/manifest.js"></script><script src="data/inventory/dice/iron/manifest.js"></script><script src="data/inventory/dice/emas/manifest.js"></script><script src="data/inventory/dice/diamond/manifest.js"></script><script src="data/inventory/dice/emerald/manifest.js"></script><script src="data/inventory/dice/lapis/manifest.js"></script><script src="data/inventory/dice/amethyst/manifest.js"></script><script src="data/inventory/dice/redstone/manifest.js"></script><script src="data/inventory/dice/obsidian/manifest.js"></script><script src="data/inventory/dice/magma/manifest.js"></script><script src="data/inventory/dice/frost/manifest.js"></script><script src="data/inventory/dice/prismarine/manifest.js"></script><script src="data/inventory/dice/quartz/manifest.js"></script><script src="data/inventory/dice/void/manifest.js"></script><script src="data/inventory/dice/netherite/manifest.js"></script><script src="data/inventory/dice/sculk/manifest.js"></script><script src="data/inventory/dice/ender/manifest.js"></script><script src="data/inventory/dice/dragon/manifest.js"></script><script src="data/inventory/dice/index.js"></script><script src="assets/js/item-catalog.js"></script><script src="assets/js/frame-fx.js"></script>
<link rel="stylesheet" href="gameplay/particle-fx.css"><script src="gameplay/particle-fx.js"></script><script src="data/power/power-fx.js"></script>
<script src="assets/js/item-art.js"></script>
<script src="assets/js/character-data.js"></script>
<script src="assets/js/character-view.js"></script>
<script src="assets/js/player-data.js"></script>
<script src="assets/js/wallet-service.js"></script>
<script src="assets/js/appearance-service.js"></script>
<script src="assets/js/frame-avatar.js"></script>
<script src="assets/js/app.js"></script>
<script src="hud/ui-core.js"></script>
<script src="assets/js/room-flow.js"></script>
<script src="assets/js/live-sync.js"></script>
<script>UT.App.init({page:'room'});</script>
<script type="module" src="assets/js/room-dice-art.js"></script>
<script src="assets/js/pages/room.js"></script>
<script type="module">
import './assets/js/multiplayer/room-service.js';
import './assets/js/multiplayer/presence.js';
window.dispatchEvent(new Event('ut:multiplayer-ready'));
</script>
</body></html>
