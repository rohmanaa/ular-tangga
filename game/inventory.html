<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventory</title>
<link rel="stylesheet" href="assets/css/base.css"><style>
:root{--bd:#12337f;--y1:#ffd24d;--y2:#ff9a1f;--g:#3cc23c;--r0:#6f8aa8;--r1:#2f8cf0;--r2:#9a4ae0;--r3:#f0b030}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html{font-size:min(1vw,1.78vh)}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Baloo 2','Fredoka','Nunito',system-ui,sans-serif;font-weight:800;color:#fff;background:linear-gradient(#5db4f5,#a9dcf8 60%,#d5f0ff)}
#sky{position:fixed;inset:0;overflow:hidden}
.isl{position:absolute;opacity:.75;animation:fl 6s ease-in-out infinite}
.isl i{display:block;background:#6fbf4a}.isl b{display:block;background:#8a5a3a;margin:0 auto}
@keyframes fl{50%{translate:0 -.8rem}}
.ab{position:absolute}
button{font:inherit;color:inherit;border:0;cursor:pointer;transition:transform .15s cubic-bezier(.3,1.6,.5,1),filter .15s}
button:hover{transform:scale(1.05);filter:brightness(1.08)}button:active{transform:scale(.94)}button:focus-visible{outline:.3rem solid #fff}
.blue{background:linear-gradient(#4aa8ff,#1f6fe0);box-shadow:0 .5rem 0 var(--bd),0 1rem 1.4rem rgba(18,51,127,.4),inset 0 .2rem .2rem rgba(255,255,255,.6)}
svg{display:block}
#back{left:1.4rem;top:1.5rem;width:4.7rem;height:4.7rem;border-radius:1.4rem;padding:0;display:grid;place-items:center}
#back svg{width:3rem;height:3rem}
#title{left:7rem;top:1.3rem;width:25.8rem;height:5rem;border-radius:2.5rem;display:flex;align-items:center;gap:1.4rem;padding-left:2.6rem;font-size:3.6rem;text-shadow:0 .2rem 0 var(--bd)}
#title svg{width:3.8rem;height:3.8rem}
#cats{left:1.6rem;top:7.9rem;width:13.2rem;display:flex;flex-direction:column;gap:.55rem}
.cat{height:4.8rem;border-radius:1.6rem;display:flex;align-items:center;gap:1.1rem;padding:0 1.3rem;font-size:2rem;text-shadow:0 .15rem 0 var(--bd);border:.25rem solid transparent}
.cat svg{width:3rem;height:3rem}
.cat.on{border-color:#ffe36a;background:linear-gradient(#ffd24d,#f4a81f);box-shadow:0 .4rem 0 #b9740c,0 0 1.8rem #ffd24d;transform:scale(1.06);text-shadow:0 .2rem 0 #a35f08}
#show{left:15.5rem;top:7.5rem;width:24rem;height:31rem}
#show canvas{width:100%;height:100%;display:block}
#show #art{display:none;position:absolute;inset:0;place-items:center}
#show #art svg{width:82%;height:82%}
#show.art canvas{display:none}#show.art #art{display:grid}
#sbs{left:38.2rem;top:14.8rem;display:flex;flex-direction:column;gap:.9rem}
#sbs button{width:4.4rem;height:3.5rem;border-radius:1.2rem;padding:0;display:grid;place-items:center;font-size:1.3rem;line-height:1}
#sbs svg{width:2.4rem;height:2.4rem}
#info{left:15rem;top:37.8rem;width:27.4rem;height:7.7rem;padding:1.3rem 1.6rem;border-radius:2rem;background:linear-gradient(90deg,rgba(40,130,240,.95),rgba(40,130,240,.4));box-shadow:inset 0 .2rem .3rem rgba(255,255,255,.4)}
#info .badge{position:absolute;left:1.2rem;top:-1.5rem}
.badge{display:inline-block;padding:0 1.1rem;border-radius:1rem;font-size:1rem;line-height:1.5rem;box-shadow:inset 0 .15rem .2rem rgba(255,255,255,.5),0 .15rem 0 rgba(10,30,100,.4)}
#iname{font-size:2.2rem;line-height:1.1}#idesc{font-size:1.15rem;line-height:1.25;font-weight:700;color:#e0f2ff}
#rec{left:1.7rem;top:45.9rem;width:40.7rem;height:8.6rem;border-radius:2.2rem;padding:1.4rem 1.6rem .6rem;background:linear-gradient(#4aa8ff,#2a86ee);box-shadow:0 .4rem 0 var(--bd),inset 0 .2rem .3rem rgba(255,255,255,.5),inset 0 0 0 .25rem rgba(120,195,255,.7);display:flex;align-items:center;gap:1rem}
#rl{position:absolute;left:3.6rem;top:-.1rem;display:flex;align-items:center;gap:.5rem;font-size:1.1rem;padding:.1rem 1.4rem;border-radius:0 0 1rem 1rem;background:#1f6fe0}#rl svg{width:1.6rem;height:1.6rem}
.rarr{width:3.4rem;height:4.8rem;border-radius:1.2rem;padding:0;display:grid;place-items:center;flex:none}.rarr svg{width:2rem;height:2rem}
#rlist{flex:1;display:flex;gap:1.1rem;justify-content:center}
.rt{width:5.3rem;height:5.3rem;border-radius:1.4rem;padding:.2rem;background:linear-gradient(#3a8ff0,#1b55c0);box-shadow:0 .25rem 0 var(--bd),inset 0 0 0 .2rem rgba(255,255,255,.25)}
.rt.on{box-shadow:0 0 0 .3rem #ffe36a,0 0 1.2rem #ffd24d}.rt svg{width:100%;height:100%}
.cur{top:1.8rem;display:flex;align-items:center;height:4.2rem;padding:0 .5rem 0 4.8rem;border-radius:2.1rem;background:linear-gradient(#2d62c8,#173c94);box-shadow:0 .4rem 0 #0b2160,0 1rem 1.4rem rgba(18,51,127,.4),inset 0 .2rem .2rem rgba(255,255,255,.35);font-size:2rem;justify-content:space-between;gap:1rem;min-width:11.5rem}
.cur>svg{position:absolute;left:-.5rem;top:50%;translate:0 -50%;width:5.2rem;height:5.2rem;filter:drop-shadow(0 .3rem .3rem rgba(0,0,0,.35))}
.plus{width:3.2rem;height:3.2rem;border-radius:50%;background:radial-gradient(#7af07a,#2cb02c);border:.2rem solid #1c7d1c;display:grid;place-items:center;padding:0}.plus svg{width:1.9rem;height:1.9rem}
.pulse{animation:pu .4s}@keyframes pu{50%{transform:scale(1.15)}}
#gem{right:21rem}#coin{right:7.6rem}
#gear{right:1.4rem;top:1.7rem;width:4.4rem;height:4.4rem;border-radius:1.4rem;padding:0;display:grid;place-items:center}#gear svg{width:2.8rem;height:2.8rem}
#bot{left:45.1rem;top:8rem;width:53.5rem;height:45.9rem;border-radius:2.6rem;padding:1rem 1.1rem;background:linear-gradient(#3b9cf8,#2a86ee);box-shadow:0 .6rem 0 var(--bd),0 1.4rem 2.4rem rgba(18,51,127,.35),inset 0 .2rem .3rem rgba(255,255,255,.6),inset 0 0 0 .3rem #6cc0ff;display:flex;flex-direction:column;gap:.9rem}
#tabs{display:flex;gap:.6rem;flex:none}
.tab{flex:1;height:3.9rem;border-radius:2rem;font-size:1.9rem;display:flex;align-items:center;justify-content:center;gap:.7rem;padding:0;background:linear-gradient(#2f94f0,#1766d8);box-shadow:0 .3rem 0 var(--bd);border:.25rem solid transparent}
.tab svg{width:2.4rem;height:2.4rem}.tab.on{flex:1.1;border-color:#ffe36a;background:linear-gradient(#ffe36a,#f4b62a);box-shadow:0 .3rem 0 #b9740c,0 0 1.2rem #ffd24d}
#gwrap{flex:1;min-height:0;border-radius:2rem;padding:.9rem;background:linear-gradient(#2a7ce0,#2f90f2);box-shadow:inset 0 .3rem .6rem rgba(10,40,120,.35)}
#grid{height:100%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:1rem}
.card{position:relative;border-radius:1.6rem;padding:.3rem .7rem .7rem;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.3rem;min-height:0;background:linear-gradient(#3f9bff,#1c55c0);box-shadow:0 .25rem 0 rgba(10,30,100,.5),inset 0 0 0 .25rem rgba(120,190,255,.55);animation:pop .35s both;cursor:pointer}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
.card.lg{background:linear-gradient(#ffc83a,#b87818);box-shadow:0 0 0 .3rem #ffc23a,0 0 1.4rem rgba(255,200,60,.7),0 .25rem 0 rgba(10,30,100,.5)}
.card.lk{background:linear-gradient(#6a7f9c,#3d4f6a);box-shadow:0 .25rem 0 rgba(10,30,100,.5),inset 0 0 0 .25rem rgba(200,215,240,.3)}
.card.sel{box-shadow:0 0 0 .3rem #ffe36a,0 0 1.6rem #ffe36a,0 .25rem 0 rgba(10,30,100,.5)}
.card .th{flex:1;min-height:0;width:74%}.card .th svg{width:100%;height:100%}
.card.lk .th{filter:grayscale(1) brightness(.5);opacity:.7}
.card:hover .th{animation:wig .8s}@keyframes wig{50%{rotate:8deg;scale:1.1}}
.card .nm{font-size:1.15rem;line-height:1.3rem;white-space:nowrap}
.card .badge{font-size:.95rem;line-height:1.4rem}
.bt,.use{display:flex;align-items:center;justify-content:center;gap:.5rem;padding:0;background:linear-gradient(#58b6ff,#1f86ee);box-shadow:0 .2rem 0 #14449f,inset 0 .15rem .15rem rgba(255,255,255,.5);text-shadow:0 .1rem 0 rgba(10,40,120,.6)}
.bt{width:100%;height:2.5rem;border-radius:1.2rem;font-size:1.3rem}.bt svg{width:1.3rem;height:1.3rem}
.bt.own,.use.own{background:linear-gradient(#4fd44f,#1f9a2a);box-shadow:0 .2rem 0 #136b1c,inset 0 .15rem .15rem rgba(255,255,255,.5)}
.bt.gd,.use{background:linear-gradient(#ffd24d,#ff9a1f);box-shadow:0 .2rem 0 #c96a0c,inset 0 .15rem .15rem rgba(255,255,255,.6);text-shadow:0 .1rem 0 #8a4a0a}
.bt.no,.use.no{background:linear-gradient(#7d8da8,#58698a);box-shadow:0 .2rem 0 #2c3a56;color:#d0dbee;text-shadow:none}
.use{flex:none;align-self:center;width:17.6rem;height:4.5rem;border-radius:2.3rem;font-size:2.2rem;gap:1rem;box-shadow:0 .4rem 0 #c96a0c,inset 0 .25rem .25rem rgba(255,255,255,.6)}
.use.own{box-shadow:0 .4rem 0 #136b1c,inset 0 .25rem .25rem rgba(255,255,255,.5)}.use.no{box-shadow:0 .4rem 0 #2c3a56}.use svg{width:2.8rem;height:2.8rem}
.ck{position:absolute;right:.7rem;top:.7rem;width:2.1rem;height:2.1rem;border-radius:50%;background:var(--g);border:.2rem solid #fff;display:grid;place-items:center;z-index:1}.ck svg{width:1.2rem;height:1.2rem}
.lkb{position:absolute;right:.9rem;top:42%;z-index:1}.lkb svg{width:2.2rem;height:2.2rem}
.sp{position:fixed;width:1.3rem;height:1.3rem;background:#fff6a0;rotate:45deg;pointer-events:none;z-index:99;animation:spk .8s forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.ov{position:fixed;inset:0;display:none;place-items:center;background:rgba(18,51,127,.4);backdrop-filter:blur(6px);z-index:50;opacity:0;transition:opacity .25s}
.ov.show{opacity:1}.ov>.box{transform:scale(.85);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}.ov.show>.box{transform:scale(1)}.ov.closing>.box{transform:scale(.9)}
.box{position:relative;width:min(48rem,92vw);max-height:92vh;overflow:auto;background:linear-gradient(#7cc2ff,#4a9ae8);border-radius:2.4rem;padding:3rem 2.4rem 2.4rem;box-shadow:0 1rem 0 var(--bd),0 2rem 3rem rgba(0,0,0,.3);font-size:2.6rem;text-align:center}
.box.big{width:min(60rem,92vw)}
.box h2{margin:0 0 1.2rem;font-size:3.4rem;text-shadow:0 .2rem 0 var(--bd)}
.x{position:absolute;right:-1rem;top:-1rem;width:4.6rem;height:4.6rem;border-radius:50%;background:#ee4a4a;box-shadow:0 .3rem 0 #8e1d1d;font-size:2.4rem;padding:0}
.row{display:flex;justify-content:space-between;align-items:center;background:rgba(18,51,127,.25);border-radius:1.4rem;padding:1rem 1.4rem;margin:.8rem 0;gap:1rem}
.row.sel{outline:.3rem solid #ffe36a}
.tg{min-width:7.6rem;height:3.8rem;border-radius:2rem;background:#7b8aa8;box-shadow:inset 0 .2rem .4rem rgba(0,0,0,.3);font-size:2rem;padding:0 1rem}.tg.on{background:var(--g)}
.pack,.mb{width:100%;display:flex;justify-content:space-between;align-items:center;margin:.8rem 0;padding:1.2rem 1.6rem;border-radius:1.4rem;background:linear-gradient(#ffd24d,#ff9a1f);box-shadow:0 .4rem 0 #c96a0c;font-size:2.6rem;text-shadow:0 .2rem 0 rgba(107,53,17,.7)}
.mb{justify-content:center;width:48%;display:inline-flex;margin:1rem 1% 0}.mb.no{background:linear-gradient(#8ab4e8,#5a88c8);box-shadow:0 .4rem 0 #2f5090;text-shadow:none}
#bigc{width:100%;aspect-ratio:1;border-radius:1.6rem;background:linear-gradient(#5db4f5,#a9dcf8);display:block;margin-bottom:1rem}
#toast{position:fixed;left:50%;bottom:3rem;translate:-50% 2rem;background:var(--bd);padding:.8rem 2.4rem;border-radius:2rem;font-size:2.6rem;opacity:0;transition:opacity .3s,translate .35s cubic-bezier(.3,1.8,.5,1);z-index:99;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;translate:-50% 0}
#top{display:contents}#mid{display:contents}
@media(max-aspect-ratio:1/1){
html{font-size:2.5vw}
#ui{position:fixed;inset:0;overflow:auto;display:flex;flex-direction:column;gap:1.4rem;padding:1.2rem}
.ab{position:relative!important;left:auto!important;top:auto!important;right:auto!important;bottom:auto!important}
#top{display:flex;flex-wrap:wrap;align-items:center;gap:1.2rem 3rem}
#title{order:-1}#cats{display:none}
#show{width:auto!important;height:75vw!important;order:1}
#sbs{order:2;flex-direction:row!important;justify-content:center}
#info{order:3;width:auto!important;height:auto!important;margin-top:1.4rem}
#rec{order:4;width:auto!important}
#bot{order:5;width:auto!important;height:auto!important}
#tabs{overflow-x:auto}.tab{flex:0 0 14rem}
#gwrap,#grid{height:auto}#grid{grid-template-columns:repeat(2,1fr);grid-template-rows:none;grid-auto-rows:22rem}
#gem,#coin{right:auto}
}
</style></head>
<body>
<div id="sky"></div>
<div id="ui">
<div id="top">
 <button class="ab blue" id="back" aria-label="Kembali"><svg viewBox="0 0 24 24"><path d="M20 12H5m6-7-7 7 7 7" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
 <div class="ab blue" id="title"><svg viewBox="0 0 24 24"><path d="M3 8h18v4H3zM5 12h14v9H5z" fill="#fff"/><path d="M12 8v13" stroke="#2f8cf0" stroke-width="2"/><path d="M12 8C9 8 8 3 11 4c1 .5 1 4 1 4Zm0 0c3 0 4-5 1-4-1 .5-1 4-1 4Z" fill="#fff"/></svg>Inventory</div>
 <div class="ab cur" id="gem"><svg viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z" fill="#4cc9ff" stroke="#1d7fd0" stroke-width="1.200"/><path d="M2 9h20M9 3l-2 6 5 12 5-12-2-6" fill="none" stroke="#bff0ff" stroke-width=".8"/></svg><span id="gemV"></span><button class="plus" data-buy="gem" aria-label="Tambah gem"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg></button></div>
 <div class="ab cur" id="coin"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffc83a" stroke="#c98a0c" stroke-width="1.500"/><text x="12" y="17" font-size="14" font-weight="900" text-anchor="middle" fill="#c98a0c">$</text></svg><span id="coinV"></span><button class="plus" data-buy="coin" aria-label="Tambah coin"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg></button></div>
 <button class="ab blue" id="gear" aria-label="Pengaturan"><svg viewBox="0 0 24 24"><path fill="#fff" d="M19.400 13c.1-.3.1-.7.1-1s0-.7-.1-1l2.100-1.600-2-3.500-2.500 1a7 7 0 0 0-1.700-1L15 3.200h-4L10.600 6a7 7 0 0 0-1.700 1l-2.500-1-2 3.500L6.600 11c-.1.300-.1.700-.1 1s0 .7.100 1l-2.100 1.600 2 3.500 2.500-1c.5.400 1.100.7 1.700 1l.4 2.800h4l.4-2.800c.6-.3 1.200-.6 1.700-1l2.500 1 2-3.500zM12 15.500a3.500 3.500 0 1 1 0-7 3.500 3.500 0 0 1 0 7Z"/></svg></button>
</div>
<nav class="ab" id="cats" aria-label="Kategori"></nav>
<div class="ab" id="show"><canvas id="gl"></canvas><div id="art"></div></div>
<div class="ab" id="sbs"><button class="blue" id="b1" aria-label="Ganti pose"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3-6.200M20 3v5h-5M4 12a8 8 0 0 0 13 6.200" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="blue" id="b2" aria-label="Lihat yang dipakai"></button><button class="blue" id="b3" aria-label="Putar 360">360°</button></div>
<section class="ab" id="info"><span class="badge" id="irar"></span><div id="iname"></div><div id="idesc"></div></section>
<section class="ab" id="rec"><span id="rl"><svg viewBox="0 0 24 24"><path d="M3 18 2 7l5 4 5-7 5 7 5-4-1 11z" fill="#ffd24d"/></svg><b id="rlt"></b></span><button class="blue rarr" id="rp" aria-label="Sebelumnya"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div id="rlist"></div><button class="blue rarr" id="rn" aria-label="Berikutnya"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></section>
<section class="ab" id="bot"><div id="tabs"></div><div id="gwrap"><div id="grid"></div></div><button class="use" id="use"></button></section>
</div>
<div class="ov" id="modal"><div class="box" id="box" role="dialog" aria-modal="true"><button class="x" id="mx" aria-label="Tutup">✕</button><div id="mb"></div></div></div>
<div id="toast"></div>
<script src="assets/js/item-catalog.js"></script>
<script src="assets/js/item-art.js"></script>
<script src="assets/js/player-data.js"></script>
<script src="assets/js/app.js"></script>
<script>UT.App.init({page:'inventory'});</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s),fmt=n=>n.toLocaleString('id-ID');
// ---- data: inventory BUKAN database sendiri. Item & kepemilikan dibaca dari ItemCatalog + PlayerData.
const PD=window.PlayerData,IC=window.ItemCatalog,AR=window.ItemArt;
const RN={common:'COMMON',rare:'RARE',epic:'EPIC',legendary:'LEGENDARY'},RC={common:'var(--r0)',rare:'var(--r1)',epic:'var(--r2)',legendary:'var(--r3)'};
const BG={common:['#5a8aa8','#2f5f80'],rare:['#3a8ff0','#1b55c0'],epic:['#8a4ae0','#4a2aa8'],legendary:['#f0c040','#b98020']};
const KINDS=['skin','dice','theme','powerup'];
const CI={};KINDS.forEach(k=>CI[k]=IC.items.filter(i=>i.kind===k));
const SOON={item:'Item',effect:'Efek',emote:'Emote'}; /* kategori mock lama tanpa item canonical */
const CATS=[['skin','Skin','M8 3 2 6l2 5 3-1v11h10V10l3 1 2-5-6-3c-.5 1.700-2 2.600-4 2.600S8.500 4.700 8 3Z'],['dice','Dadu','M4 4h16v16H4zM8 8h.1M16 8h.1M12 12h.1M8 16h.1M16 16h.1'],['theme','Tema','M3 5h18v14H3zM3 15l5-5 4 4 3-3 6 6M15 9h.1'],['powerup','Power-Up','M13 2 4 14h6l-1 8 9-12h-6l1-8z'],['item','Item','M3 8h18v4H3zM5 12h14v9H5zM12 8v13'],['effect','Efek','M12 2l2.500 7.500L22 12l-7.500 2.500L12 22l-2.500-7.500L2 12l7.500-2.500z'],['emote','Emote','M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20ZM8 10h.1M16 10h.1M7 15c2 3 8 3 10 0']];
const icon=p=>`<svg viewBox="0 0 24 24"><path d="${p}" fill="#fff" stroke="#fff" stroke-width="1.800" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
const DM='<svg viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z" fill="#4cc9ff" stroke="#1d7fd0" stroke-width="1.200"/><path d="M2 9h20M9 3l-2 6 5 12 5-12-2-6" fill="none" stroke="#bff0ff" stroke-width=".8"/></svg>';
const CM='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffc83a" stroke="#c98a0c" stroke-width="1.500"/><text x="12" y="17" font-size="14" font-weight="900" text-anchor="middle" fill="#c98a0c">$</text></svg>';
// ---- state: tidak ada let coins/gems/own/eq permanen. Key legacy 'inv' tidak ditulis lagi.
let cat='skin',sel=null;
const SET=()=>PD.settings();
/* Item yang dimiliki utk kategori: [{item, equipped}] — langsung dari PlayerData */
const ownedList=c=>PD.ownedItems().filter(o=>o.item.kind===c).map(o=>({item:o.item,equipped:o.equipped}));
const equippedItem=c=>{const it=IC.byId(PD.equippedId(c));return it&&it.kind===c?it:null};
const SFX={click:'button',select:'button',open:'button',error:'button',coin:'button',purchase:'power',chest:'chest'};
function playSound(n){if(!SET().sound)return;try{UT.Audio.play(SFX[n]||'button')}catch(e){}}
const buzz=()=>{if(SET().vibration&&navigator.vibrate)navigator.vibrate(15)};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1600)}
function sparkle(el,n=12){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;for(let i=0;i<n;i++){const s=document.createElement('i');s.className='sp';s.style.left=cx+'px';s.style.top=cy+'px';const a=Math.random()*6.28,d=30+Math.random()*60;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),850)}}
// ---- sky
(()=>{const sk=$('#sky');[[5,60,6],[18,30,4],[30,70,5],[62,16,5],[86,48,7],[92,12,4],[2,20,5],[75,75,6],[45,85,4]].forEach((p,i)=>{const e=document.createElement('div');e.className='isl';e.style.cssText=`left:${p[0]}%;top:${p[1]}%;animation-delay:${-i}s;filter:blur(${i%3}px)`;e.innerHTML=`<i style="width:${p[2]}rem;height:${p[2]*.4}rem"></i><b style="width:${p[2]*.7}rem;height:${p[2]*.6}rem"></b>`;sk.appendChild(e)})})();
// ---- thumbs (ItemArt = satu sistem art)
function thumb(c,it){
 if(c==='skin')return AR.face(it.id);
 if(c==='dice')return AR.dice(it.id);
 if(c==='theme')return AR.theme(it.id);
 if(c==='powerup')return AR.powerup(it.id);
 return `<svg viewBox="0 0 40 40"><rect x="5" y="5" width="30" height="30" rx="7" fill="rgba(255,255,255,.25)"/><path d="M12 21l6 6 11-13" fill="none" stroke="#fff" stroke-width="3.500" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
// ---- UI render
const CK='<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>',SH=icon(CATS[0][2]);
const RB={common:['#4ad04a','#2a9a2a'],rare:['#4aa8ff','#2a78e0'],epic:['#b45cf0','#7a2ad0'],legendary:['#ffb02e','#e07a10']},POSES=['idle','wave','dance','victory','laugh'];
let off=0,pose='idle';
const bg=r=>`linear-gradient(${RB[r][0]},${RB[r][1]})`,badge=r=>`<span class="badge" style="background:${bg(r)}">${RN[r]}</span>`;
function renderCats(){$('#cats').innerHTML=CATS.map(c=>`<button class="blue cat ${c[0]===cat?'on':''}" data-c="${c[0]}" aria-label="${c[1]}">${icon(c[2])}${c[1]}</button>`).join('');
 $('#tabs').innerHTML=CATS.map(c=>`<button class="tab ${c[0]===cat?'on':''}" data-c="${c[0]}">${icon(c[2])}${c[1]}</button>`).join('');
 $('#rlt').textContent=CATS.find(c=>c[0]===cat)[1]+' Terbaru';
 document.querySelectorAll('[data-c]').forEach(b=>b.addEventListener('click',()=>{playSound('click');setCat(b.dataset.c)}))}
function setCat(c){cat=c;const l=ownedList(c);sel=l?(l.find(o=>o.equipped)||l[0]||{}).item||null:null;off=0;pose='idle';renderCats();renderGrid();renderInfo();renderRecent();buildModels();playSound('select')}
function pick(i){sel=i;renderGrid();renderInfo();renderRecent();buildModels();playSound('select')}
function renderGrid(){const g=$('#grid');g.innerHTML='';
 if(!CI[cat]){g.innerHTML=`<div style="grid-column:1/-1;display:grid;place-items:center;font-size:2.2rem;text-align:center">${SOON[cat]} — Segera hadir</div>`;return}
 ownedList(cat).forEach((o,n)=>{const i=o.item,eq=o.equipped,b=document.createElement('div');
  const pw=i.kind==='powerup';
  const btn=pw?`<button class="bt own">Dimiliki ×${PD.qty(i.id)}</button>`:`<button class="bt ${eq?'own':i.rarity==='legendary'?'gd':''}">${eq?'Digunakan':'Gunakan'}</button>`;
  b.className='card '+(i.rarity==='legendary'?'lg':'')+(i===sel?' sel':'');b.tabIndex=0;b.setAttribute('role','button');b.setAttribute('aria-label',i.name+(pw?' ×'+PD.qty(i.id):''));b.style.animationDelay=n*25+'ms';
  b.innerHTML=`${eq?`<span class="ck">${CK}</span>`:''}<div class="th">${thumb(cat,i)}</div><span class="nm">${i.name}</span>${badge(i.rarity)}${btn}`;
  b.addEventListener('click',e=>{pick(i);if(e.target.closest('.bt'))act(i)});b.addEventListener('keydown',e=>{if(e.key==='Enter')b.click()});g.appendChild(b)})}
function renderRecent(){const l=ownedList(cat).map(o=>o.item);off=Math.max(0,Math.min(off,Math.max(0,l.length-5)));$('#rlist').innerHTML=l.length?l.slice(off,off+5).map(i=>`<button class="rt ${i===sel?'on':''}" data-id="${i.id}" aria-label="${i.name}">${thumb(cat,i)}</button>`).join(''):'<div style="align-self:center;font-size:1.4rem;width:100%;text-align:center">Belum ada item</div>';
 document.querySelectorAll('.rt').forEach(b=>b.addEventListener('click',()=>pick(l.find(i=>i.id===b.dataset.id))))}
/* Equip lewat PlayerData; UI langsung di-refresh dan event inventory/skin/dice ikut dipancarkan oleh bridge.
   Power-Up = consumable (slot null): tidak di-equip; PlayerData.equip menolak dengan 'bukan-equipment'. */
function act(i){if(i.kind==='powerup'){toast('Power-Up tersimpan — pemakaian di gameplay menyusul.');playSound('select');return}
 const r=PD.equip(i.id);
 if(r.ok){toast('Berhasil digunakan!');playSound('select');buzz()}else{toast('Gagal memakai item.');playSound('error')}
 renderGrid();renderInfo();renderRecent();buildModels()}
function renderInfo(){const i=sel,u=$('#use');
 if(!i){$('#irar').textContent='SOON';$('#irar').style.background=bg('common');$('#iname').textContent=SOON[cat];$('#idesc').textContent='Belum ada item canonical di kategori ini.';u.className='use no';u.innerHTML='Segera hadir';renderCurrency();return}
 if(i.kind==='powerup'){const r=$('#irar');r.textContent=RN[i.rarity];r.style.background=bg(i.rarity);$('#iname').textContent=i.name;$('#idesc').textContent=i.desc+' (Dimiliki ×'+PD.qty(i.id)+')';u.className='use no';u.innerHTML='Dimiliki ×'+PD.qty(i.id);$('#info').animate([{transform:'translateY(.8rem)',opacity:.4},{transform:'none',opacity:1}],{duration:260,easing:'ease-out'});renderCurrency();return}
 const eq=PD.isEquipped(i.id),r=$('#irar');r.textContent=RN[i.rarity];r.style.background=bg(i.rarity);$('#iname').textContent=i.name;$('#idesc').textContent=i.desc;
 u.className='use'+(eq?' own':'');u.innerHTML=eq?CK+'Digunakan':SH+'Gunakan';
 $('#info').animate([{transform:'translateY(.8rem)',opacity:.4},{transform:'none',opacity:1}],{duration:260,easing:'ease-out'});
 renderCurrency()}
function renderCurrency(){$('#gemV').textContent=fmt(PD.gems());$('#coinV').textContent=fmt(PD.coins())}
function pulse(id){const e=$(id);e.classList.remove('pulse');void e.offsetWidth;e.classList.add('pulse')}
$('#use').addEventListener('click',e=>{if(sel){act(sel);sparkle(e.currentTarget)}});
$('#rp').addEventListener('click',()=>{off--;renderRecent()});$('#rn').addEventListener('click',()=>{off++;renderRecent()});
$('#b1').addEventListener('click',()=>{pose=POSES[(POSES.indexOf(pose)+1)%POSES.length];buildModels();toast('Pose: '+pose)});
$('#b2').innerHTML=SH;$('#b2').addEventListener('click',()=>{const e=equippedItem(cat);if(e)pick(e)});
$('#b3').addEventListener('click',()=>{spin=1;playSound('select')});
// ---- event: ikut memperbarui UI saat state berubah (tanpa reload halaman)
UT.Events.on('currencyChanged',renderCurrency);
UT.Events.on('inventoryChanged',()=>{setCat(cat)});
UT.Events.on('skinChanged',()=>setCat(cat));
UT.Events.on('diceChanged',()=>setCat(cat));
// ---- modal
const modal=$('#modal');let mOpen=false,onClose=null;
function openModal(html,init,big){$('#mb').innerHTML=html;$('#box').classList.toggle('big',!!big);modal.style.display='grid';requestAnimationFrame(()=>modal.classList.add('show'));mOpen=true;playSound('open');init&&init();$('#mx').focus()}
function closeModal(){if(!mOpen)return;mOpen=false;modal.classList.add('closing');modal.classList.remove('show');onClose&&onClose();onClose=null;setTimeout(()=>{modal.style.display='none';modal.classList.remove('closing')},250)}
$('#mx').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
/* Top-up lewat PlayerData.addCurrency — tidak ada currency state kedua. */
function buy(type){const g=type==='gem',packs=g?[[10,'Rp 15.000'],[50,'Rp 59.000'],[120,'Rp 129.000']]:[[500,'10 Gem'],[2500,'40 Gem'],[10000,'120 Gem']];
 openModal(`<h2>Tambah ${g?'Gem':'Coin'}</h2>`+packs.map((p,i)=>`<button class="pack" data-i="${i}"><span>+${fmt(p[0])}</span><span>${p[1]}</span></button>`).join(''),()=>{
  document.querySelectorAll('.pack').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.i,p=packs[i];const r=g?PD.addCurrency(0,p[0]):PD.addCurrency(p[0],-[10,40,120][i]);
   if(!r.ok){toast(r.reason==='gem-kurang'?'Gem tidak cukup.':'Transaksi gagal.');playSound('error');return}
   renderInfo();pulse(g?'#gem':'#coin');playSound('coin');toast(g?'Berhasil (mock)':'Berhasil');closeModal()}))})}
document.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click',()=>buy(b.dataset.buy)));
$('#gear').addEventListener('click',()=>{const T=SET();const row=(k,l)=>`<div class="row"><span>${l}</span><button class="tg ${T[k]?'on':''}" data-k="${k}">${T[k]?'ON':'OFF'}</button></div>`;
 openModal(`<h2>Pengaturan</h2>${row('music','Musik')}${row('sound','Suara')}${row('vibration','Getar')}<div class="row"><span>Grafik</span><button class="tg on" data-k="graphics">${T.graphics==='high'?'Tinggi':'Rendah'}</button></div>`,()=>{
  document.querySelectorAll('.tg').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.k,cur=SET();let v;
   if(k==='graphics'){v=cur.graphics==='high'?'low':'high';b.textContent=v==='high'?'Tinggi':'Rendah';PD.setSettings({graphics:v});fit()}
   else{v=!cur[k];b.classList.toggle('on',v);b.textContent=v?'ON':'OFF';PD.setSettings({[k]:v})}
   playSound('click');buzz()}))})});
$('#back').addEventListener('click',()=>{playSound('click');location.href='lobby.html'});
window.openShop=()=>{$('#ui').style.display=''};window.closeShop=()=>{$('#ui').style.display='none'};
// ---- 3D
const M=(c,r=.7)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const bx=(w,h,d,m,x=0,y=0,z=0,p)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p&&p.add(o);return o};
function character(sk,emote){const g=new THREE.Group(),P={};const skin=M(0xf0b98d),hood=M(sk.hood),hair=M(sk.hair),pants=M(sk.pants),wh=M(0xffffff),bl=M(0x2f6fd0),pk=M(0x7a4a2a),dk=M(0x221a18);
 const body=new THREE.Group();body.position.y=2.6;g.add(body);P.body=body;
 bx(1.7,1.9,1,hood,0,0,0,body);bx(.9,1.1,.1,wh,0,-.1,.52,body);bx(1.1,1.4,.5,pk,0,0,-.75,body);
 const head=new THREE.Group();head.position.y=2.1;body.add(head);P.head=head;
 bx(2.2,2.1,2.1,skin,0,0,0,head);bx(2.4,.8,2.3,hair,0,1.15,-.05,head);bx(2.4,1.8,.5,hair,0,.2,-1,head);bx(.4,1.2,2.1,hair,-1.2,.4,0,head);bx(.4,1.2,2.1,hair,1.2,.4,0,head);bx(2.2,.5,.5,hair,0,.8,1.05,head);
 P.eyes=[-.55,.55].map(x=>{const e=new THREE.Group();e.position.set(x,.05,1.06);head.add(e);bx(.42,.55,.1,dk,0,0,0,e);bx(.14,.16,.1,wh,.08,.12,.06,e);return e});
 bx(.7,.15,.1,M(0xc0473a),0,-.6,1.06,head);
 const arm=x=>{const a=new THREE.Group();a.position.set(x,.8,0);body.add(a);bx(.7,1.5,.7,hood,0,-.6,0,a);bx(.6,.5,.6,skin,0,-1.5,0,a);return a};
 P.aL=arm(-1.2);P.aR=arm(1.2);
 const leg=x=>{const l=new THREE.Group();l.position.set(x,-1,0);body.add(l);bx(.8,1.4,.9,pants,0,-.6,0,l);bx(1,.5,1.3,wh,0,-1.45,.15,l);bx(1.02,.18,1.32,bl,0,-1.2,.15,l);return l};
 P.lL=leg(-.45);P.lR=leg(.45);
 g.userData.anim=t=>{const k=emote||'idle',sw=Math.sin(t*10);P.body.position.y=2.6+Math.sin(t*2)*.05;P.body.scale.y=1+Math.sin(t*2)*.012;P.head.rotation.set(0,Math.sin(t*.7)*.12,Math.sin(t*.9)*.03);
  P.aL.rotation.z=-.15;P.aR.rotation.z=.15;g.position.y=Math.sin(t*1.6)*.08;P.body.rotation.z=0;
  if(k==='idle')P.aR.rotation.z=.15-Math.sin(t*2)*.05+(Math.sin(t*.4)>.97?1:0);
  if(k==='wave'){P.aR.rotation.z=2.4+Math.sin(t*10)*.35}
  if(k==='dance'){P.body.rotation.z=sw*.12;P.aL.rotation.z=-2+sw*.3;P.aR.rotation.z=2-sw*.3;g.position.y=Math.abs(sw)*.3}
  if(k==='victory'){P.aL.rotation.z=-2.8;P.aR.rotation.z=2.8;g.position.y=Math.abs(Math.sin(t*4))*.5}
  if(k==='laugh'){P.body.rotation.z=sw*.04;P.head.rotation.x=-.25+Math.sin(t*16)*.06;P.aL.rotation.z=-.9;P.aR.rotation.z=.9}
  if(k==='celebrate'){P.aL.rotation.z=-2.5+Math.sin(t*8)*.4;P.aR.rotation.z=2.5-Math.sin(t*8)*.4;g.position.y=Math.abs(Math.sin(t*5))*.9}
  P.eyes.forEach(e=>e.scale.y=(t%4<.15)?.1:1)};
 return g}
function diceTex(c,p){const cv=document.createElement('canvas');cv.width=cv.height=128;const x=cv.getContext('2d');x.fillStyle=c;x.fillRect(0,0,128,128);x.fillStyle=p;[[32,32],[96,32],[64,64],[32,96],[96,96]].forEach(a=>{x.beginPath();x.arc(a[0],a[1],12,0,6.3);x.fill()});return new THREE.CanvasTexture(cv)}
/* model hanya skin/dice canonical; tema memakai ItemArt overlay */
function model(c,it){let g;
 if(c==='skin')g=character(AR.palette(it.id)||{hood:'#00a8a8',hair:'#4a2e13',pants:'#3b4fd8'},pose);
 else if(c==='dice'){g=new THREE.Group();const m=new THREE.MeshStandardMaterial({map:diceTex(it.art.bg,it.art.pip),roughness:.35});const d=bx(2.6,2.6,2.6,m,0,3,0,g);g.userData.anim=t=>{d.rotation.y=t*.8;d.rotation.x=.5+Math.sin(t)*.2;d.position.y=3+Math.sin(t*1.6)*.2}}
 return g}
function island(){const g=new THREE.Group(),cells=[];for(let y=0;y>-4;y--){const r=y===0?3.2:y===-1?3:Math.max(1,3.2+y*.8);for(let x=-3;x<=3;x++)for(let z=-3;z<=3;z++)if(Math.hypot(x,z)<=r+(((x*7+z*13+y*5)%3)*.15)-.2)cells.push([x,y,z])}
 const m=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({roughness:.8}),cells.length),m4=new THREE.Matrix4(),col=new THREE.Color();
 cells.forEach((c,i)=>{m4.setPosition(c[0],c[1]-.5,c[2]);m.setMatrixAt(i,m4);m.setColorAt(i,col.setHex(c[1]===0?((c[0]+c[2])&1?0x58b83c:0x4fae36):c[1]===-1?0x8a5a3a:(c[0]*c[2]%3===0?0x7a7a80:0x754b30)))});m.castShadow=m.receiveShadow=true;g.add(m);
 for(let i=0;i<7;i++){const a=i*2.3;bx(.2,.5+.3*(i%2),.2,M(0x3fa83a),Math.cos(a)*2.4,.25,Math.sin(a)*2.4,g)}bx(.25,.25,.25,M(0xffffff),-1.8,.4,1.5,g);bx(.9,.25,.9,M(0x9a9aa0),2,.12,1.9,g);
 const glow=new THREE.Mesh(new THREE.RingGeometry(3.4,4.3,40),new THREE.MeshBasicMaterial({color:0xbfeaff,transparent:true,opacity:.6,side:THREE.DoubleSide}));glow.rotation.x=-Math.PI/2;glow.position.y=-3.6;g.add(glow);return g}
let ok=true;const rigs=[];
function rig(cv,withIsland,cy,dist,fov){if(!ok)return null;try{const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;
 const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(fov,1,.1,100);scene.add(new THREE.AmbientLight(0xffffff,.6),new THREE.HemisphereLight(0xcfeaff,0x6a9a50,.6));
 const sun=new THREE.DirectionalLight(0xfff2d8,.9);sun.position.set(6,12,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-8,right:8,top:10,bottom:-6});scene.add(sun);
 const holder=new THREE.Group();scene.add(holder);if(withIsland)holder.add(island());
 const R={r,scene,cam,holder,cv,cy,dist,rot:0,vel:0,cur:null,drag:false,fov};
 cv.addEventListener('pointerdown',e=>{R.drag=true;R.lx=e.clientX;cv.setPointerCapture(e.pointerId)});
 cv.addEventListener('pointermove',e=>{if(R.drag){R.vel=(e.clientX-R.lx)*.012;R.rot+=R.vel;R.lx=e.clientX}});
 const up=()=>R.drag=false;cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.style.touchAction='pan-y';
 rigs.push(R);return R}catch(e){ok=false;console.warn('WebGL unavailable',e);return null}}
let main,pv,spin=0;
function setModel(R,c,it,y){if(!R)return;if(R.cur)R.holder.remove(R.cur);const m=model(c,it);R.holder.add(m);R.cur=m;R.mc=c}
function showThemeArt(on){const s=$('#show');const sv=on&&sel?AR.forItem(sel.id):'';s.classList.toggle('art',!!sv);$('#art').innerHTML=sv}
function buildModels(){if(!CI[cat]||!sel){showThemeArt(false);return}
 if(cat==='theme'||cat==='powerup'||(cat==='skin'&&sel&&sel.renderer==='png')){showThemeArt(true);return} /* skin PNG: preview texture (pixel-art), bukan model 3D baru */
 showThemeArt(false);setModel(main,cat,sel);spin=1}
function fit(){const hi=SET().graphics==='high';rigs.forEach(R=>{const w=R.cv.clientWidth,h=R.cv.clientHeight;if(!w||!h)return;R.r.setPixelRatio(hi?Math.min(devicePixelRatio,1.5):1);R.r.setSize(w,h,false);R.cam.aspect=w/h;R.cam.fov=R.fov*(w/h<.8?1.15:1);R.cam.updateProjectionMatrix()})}
const clock=typeof THREE!=='undefined'?new THREE.Clock():null;
function loop(){requestAnimationFrame(loop);const t=clock.getElapsedTime();
 rigs.forEach(R=>{if(!R.cur||!R.cv.offsetParent)return;const el=R.cv.getBoundingClientRect();if(!el.width)return;
  if(!R.drag){R.vel*=.95;R.rot+=R.vel+.004}if(spin>0&&R===main){}R.holder.rotation.y=R.rot+(spin>0?(1-spin)*6.28:0);
  R.cur.userData.anim&&R.cur.userData.anim(t);R.cam.position.set(0,R.cy+1,R.dist);R.cam.lookAt(0,R.cy,0);R.r.render(R.scene,R.cam)});
 if(spin>0)spin=Math.max(0,spin-.012)}
if(typeof THREE==='undefined')ok=false;
setCat('skin'); /* mengisi sel dari PlayerData + render grid/info/recent */
if(ok){main=rig($('#gl'),true,1.8,19,36);if(ok){buildModels();new ResizeObserver(fit).observe(document.body);new ResizeObserver(fit).observe($('#show'));fit();requestAnimationFrame(loop)}}
if(!ok){$('#show').innerHTML='<div style="height:100%;display:grid;place-items:center;font-size:3rem">3D tidak tersedia</div>'}
})();
</script>
