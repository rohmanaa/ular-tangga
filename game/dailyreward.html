<!DOCTYPE html>
<html lang="id"><head><script src="assets/js/boot-guard.js"></script><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hadiah Harian</title>
<link rel="stylesheet" href="assets/css/base.css"><style>
:root{--bd:#12337f;--g:#3cc23c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html{font-size:min(1vw,2vh)}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Baloo 2','Fredoka','Nunito',system-ui,sans-serif;font-weight:800;color:#fff;background:#5db4f5}
/* latar penuh layar (tanpa ruang kosong kiri/kanan) */
#sky{position:fixed;inset:0;overflow:hidden;background:#79c4f7}
#sky svg{position:absolute;inset:0;width:100%;height:100%}
/* stage selalu selebar layar; tinggi 50rem (rasio referensi 2:1) */
#stage{position:absolute;left:0;top:50%;width:100%;height:50rem;translate:0 -50%}
.ab{position:absolute}
svg{display:block}
button{font:inherit;color:inherit;border:0;cursor:pointer;transition:transform .15s cubic-bezier(.3,1.6,.5,1),filter .15s}
button:hover{transform:scale(1.04);filter:brightness(1.08)}button:active{transform:scale(.94)}button:focus-visible{outline:.3rem solid #fff}
.blue{background:linear-gradient(#4aa8ff,#1f6fe0);box-shadow:0 .5rem 0 var(--bd),0 1rem 1.4rem rgba(18,51,127,.4),inset 0 .2rem .2rem rgba(255,255,255,.6)}
.pulse{animation:pu .4s}@keyframes pu{50%{transform:scale(1.15)}}
/* top bar */
#back{left:2.7rem;top:2rem;width:5.2rem;height:5.2rem;border-radius:1.6rem;padding:0;display:grid;place-items:center}
#back svg{width:3.2rem;height:3.2rem}
#title{left:12.6rem;top:3.4rem;width:48rem;white-space:nowrap;height:8.4rem;border-radius:4.2rem;padding:0 2rem 0 10.8rem;display:flex;flex-direction:column;justify-content:center;rotate:-2deg;background:linear-gradient(#3a78e6,#1a47b0);box-shadow:0 .5rem 0 var(--bd),0 1rem 1.6rem rgba(18,51,127,.4),inset 0 .2rem .3rem rgba(255,255,255,.45)}
#tgift{position:absolute;left:1.4rem;top:-2.2rem;width:9.6rem;height:9.6rem;filter:drop-shadow(0 .4rem 0 rgba(18,51,127,.45))}
#tgift svg{width:100%;height:100%}
#tspk{position:absolute;right:-3.6rem;top:-2.6rem;width:5.2rem;height:5.2rem}
#title h1{margin:0;font-size:4.3rem;line-height:1;font-style:italic;text-shadow:0 .3rem 0 var(--bd)}
#title h1 span{color:#ffd84a}
#title small{display:block;font-size:1.35rem;font-weight:700;color:#fff;line-height:1.2;margin-top:.3rem}
/* panel tengah */
.panel{background:linear-gradient(rgba(205,232,255,.74),rgba(150,200,250,.7));border:.35rem solid rgba(255,255,255,.55);box-shadow:0 .6rem 2.4rem rgba(18,51,127,.3),inset 0 0 2rem rgba(255,255,255,.35);backdrop-filter:blur(3px)}
#ctr{left:19rem;right:23.4rem;top:13.6rem;height:29.5rem;border-radius:3.2rem}
#lh{left:.8rem;right:.8rem;top:.8rem;height:5.2rem;border-radius:2rem 2rem 1.4rem 1.4rem;background:linear-gradient(#2b66d6,#1a46ae);box-shadow:inset 0 .2rem .3rem rgba(255,255,255,.25),0 .2rem .4rem rgba(18,51,127,.35);display:flex;align-items:center;padding:0 1.6rem;gap:1.2rem}
#lh>svg{width:3.8rem;height:3.8rem;flex:none}
#lh h2{margin:0;font-size:2rem;line-height:1;text-shadow:0 .2rem 0 var(--bd);white-space:nowrap}
#lh .vd{width:.2rem;height:3.6rem;background:rgba(255,255,255,.35);margin-left:auto;flex:none}
#rst{display:flex;align-items:center;gap:1rem;padding:0 .6rem 0 0;background:none;box-shadow:none;text-align:left;flex:none}
#rst svg{width:3rem;height:3rem}
#rst small{display:block;font-size:1.3rem;white-space:nowrap;font-weight:700;color:#e8f3ff;line-height:1}
#rst b{display:block;font-size:2.1rem;white-space:nowrap;line-height:1.1;color:#ffd84a;font-variant-numeric:tabular-nums;text-shadow:0 .15rem 0 rgba(10,40,120,.5)}
#days{left:.8rem;right:.8rem;top:6.5rem;height:18rem;border-radius:2.4rem;padding:.7rem;background:rgba(255,255,255,.3);box-shadow:inset 0 .2rem .4rem rgba(255,255,255,.45);display:grid;grid-template-columns:1.2fr repeat(5,1fr) 1.2fr;grid-template-rows:minmax(0,1fr);gap:.5rem}
.day{min-height:0;position:relative;border-radius:1.8rem;display:flex;flex-direction:column;align-items:center;cursor:pointer;min-width:0;background:linear-gradient(#f2f8ff,#c6dffa);box-shadow:0 0 0 .2rem rgba(255,255,255,.75),0 .3rem .7rem rgba(18,51,127,.25)}
.day .hd{width:100%;height:3.4rem;line-height:3.4rem;border-radius:1.8rem 1.8rem 1.2rem 1.2rem;background:linear-gradient(#3f94f4,#1f62c8);white-space:nowrap;font-size:1.5rem;text-align:center;box-shadow:0 .2rem 0 rgba(10,40,120,.35);text-shadow:0 .12rem 0 rgba(10,40,120,.45)}
.day .ic{flex:1;min-height:0;overflow:hidden;width:68%;display:grid;place-items:center;margin-top:.5rem}.day .ic svg{width:100%;height:100%}
.day .am{font-size:1.75rem;line-height:1.15;color:#163a8c;text-align:center;white-space:nowrap}
.day .am.s{font-size:1.4rem}
.day .st{width:90%;height:2.3rem;margin:.3rem 0 .7rem;overflow:hidden;white-space:nowrap;border-radius:1.3rem;display:flex;align-items:center;justify-content:center;gap:.3rem;font-size:1rem;padding:0;background:linear-gradient(#aab4d0,#8995b8);color:#eef3ff;box-shadow:inset 0 .15rem .3rem rgba(0,0,0,.15);text-shadow:0 .1rem 0 rgba(40,60,110,.4)}
.day .st svg{width:1.6rem;height:1.6rem}
.day.done{background:linear-gradient(#fff0b0,#f7bd36);box-shadow:0 0 0 .25rem #ffd45a,0 0 1.6rem rgba(255,200,60,.7)}
.day.done .hd{background:linear-gradient(#ffcf48,#ee9a0c);color:#fff;text-shadow:0 .12rem 0 #a35a08;box-shadow:0 .2rem 0 #b9740c}
.day.done .am{color:#8a4a0a}
.day.done .st{background:linear-gradient(#4fd44f,#1f9a2a);box-shadow:0 .2rem 0 #136b1c,inset 0 .15rem .15rem rgba(255,255,255,.5);color:#fff}
.day.now{background:linear-gradient(#fffbe0,#cfe8ff);box-shadow:0 0 0 .3rem #ffe36a,0 0 1.8rem #ffd24d;animation:glow 1.2s ease-in-out infinite}
.day.now .st{background:linear-gradient(#ffd24d,#ff9a1f);box-shadow:0 .2rem 0 #c96a0c;color:#fff;text-shadow:0 .1rem 0 #8a4a0a}
.day.done:after,.day.now:after{content:"\2726";position:absolute;left:-1rem;top:-1.3rem;font-size:2.8rem;line-height:1;color:#fff;text-shadow:0 0 .8rem #ffe36a,0 0 1.6rem #ffd24d;pointer-events:none}
@keyframes glow{50%{box-shadow:0 0 0 .3rem #fff3a0,0 0 2.6rem #ffd24d;transform:translateY(-.3rem)}}
.day.now .ic svg{animation:wig 1.2s ease-in-out infinite}
@keyframes wig{50%{rotate:6deg;scale:1.08}}
.day.big{background:linear-gradient(#efd9ff,#b98af0);box-shadow:0 0 0 .25rem rgba(200,150,255,.9),0 .3rem .7rem rgba(60,20,120,.3)}
.day.big .hd{background:linear-gradient(#b878f4,#7a3ad0)}
.day.big .am{color:#4b1c8f}
.day.big .am small{display:block;font-size:1.1rem;color:#6b3cb5;line-height:1}
.day.big.done{background:linear-gradient(#fff0b0,#f7bd36)}
.day.big.done .hd{background:linear-gradient(#ffcf48,#ee9a0c)}
.day.big.done .am,.day.big.done .am small{color:#8a4a0a}
.day.big.now{background:linear-gradient(#f4e4ff,#c9a0f6)}
.day.big .am{font-size:1.5rem}
/* hero kiri (di luar panel) */
#hero{left:-2rem;top:10rem;width:34rem;height:40rem;pointer-events:none}
#hero canvas{width:100%;height:100%;display:block}
/* progress track */
#track{position:absolute;left:50%;translate:-50% 0;width:min(34rem,60%);bottom:.8rem;height:3rem;display:flex;align-items:center;justify-content:space-between}
#track:before{content:"";position:absolute;left:1.3rem;right:1.3rem;top:50%;height:.8rem;margin-top:-.4rem;border-radius:.4rem;background:rgba(40,110,225,.85);box-shadow:inset 0 .1rem .2rem rgba(10,40,120,.4)}
#fill{position:absolute;left:1.3rem;top:50%;height:.8rem;margin-top:-.4rem;border-radius:.4rem;background:linear-gradient(#ffe36a,#ffb02e);transition:width .6s}
.nd{position:relative;width:2.6rem;height:2.6rem;border-radius:50%;background:linear-gradient(#4aa8ff,#2a78e0);border:.25rem solid #cfe8ff;box-shadow:0 .2rem 0 var(--bd);z-index:1}
.nd.dn{background:linear-gradient(#ffe36a,#ffb02e);border-color:#fff3b0;box-shadow:0 .2rem 0 #b9740c,0 0 1rem rgba(255,226,106,.8)}
/* panel kanan */
#rt{right:1.9rem;top:13.6rem;width:20.6rem;height:26.4rem;border-radius:3rem;background:linear-gradient(#3a72e0,#1c479f);border:.35rem solid rgba(180,220,255,.85);box-shadow:0 .6rem 2rem rgba(18,51,127,.35),inset 0 0 1.4rem rgba(255,255,255,.25)}
#rib{position:absolute;left:-.9rem;right:-.9rem;top:-1.8rem;height:4.8rem;border-radius:1.2rem;background:linear-gradient(#ffc23a,#e8860c);box-shadow:0 .3rem 0 #a35a08,inset 0 .2rem .2rem rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;gap:.6rem;font-size:2rem;white-space:nowrap;text-shadow:0 .15rem 0 #a35a08;z-index:2}
#rib svg{width:4rem;height:4rem;margin-left:-.4rem;filter:drop-shadow(0 .2rem 0 rgba(150,80,0,.6))}
#chest{left:.8rem;top:4.2rem;width:18.3rem;height:12.4rem;border-radius:2rem;overflow:hidden;background:radial-gradient(circle at 50% 58%,#fff1a8 0,#d28bff 38%,#6a45d8 72%,#4a35b8);box-shadow:inset 0 0 0 .2rem rgba(255,255,255,.4)}
#chest:before{content:"";position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.2) 0 7deg,transparent 7deg 22deg);animation:rot 24s linear infinite}
@keyframes rot{to{rotate:360deg}}
#chest canvas{position:relative;z-index:1;width:100%;height:100%;display:block}
#rtx{left:.8rem;top:16.9rem;width:18.3rem;height:8.4rem;padding:0 .6rem;border-radius:1.6rem;background:rgba(8,30,100,.55);display:grid;place-items:center;text-align:center;font-size:1.45rem;line-height:1.25;box-shadow:inset 0 .15rem .3rem rgba(0,0,0,.3)}
#rtx em{font-style:normal;color:#ffe36a;display:block}
#see{right:2.1rem;top:40.8rem;width:19.9rem;height:5.2rem;border-radius:2.6rem;padding:0 1.4rem;display:flex;align-items:center;justify-content:center;gap:1rem;font-size:2rem;white-space:nowrap;background:linear-gradient(#cfd5e6,#8f9ab8);box-shadow:0 .5rem 0 #5b6685,0 1rem 1.4rem rgba(18,51,127,.3),inset 0 .2rem .2rem rgba(255,255,255,.6);text-shadow:0 .12rem 0 rgba(50,60,100,.5)}
#see svg{width:2.6rem;height:2.6rem}
/* modal / toast / sparkle */
.sp{position:fixed;width:1.3rem;height:1.3rem;background:#fff6a0;rotate:45deg;pointer-events:none;z-index:99;animation:spk .9s forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.ov{position:fixed;inset:0;display:none;place-items:center;background:rgba(18,51,127,.45);backdrop-filter:blur(6px);z-index:50;opacity:0;transition:opacity .25s}
.ov.show{opacity:1}.ov>.box{transform:scale(.85);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}.ov.show>.box{transform:scale(1)}
.box{position:relative;width:48rem;max-width:92vw;max-height:92vh;overflow:auto;background:linear-gradient(#7cc2ff,#4a9ae8);border-radius:2.4rem;padding:2.6rem 2.4rem 2.4rem;box-shadow:0 1rem 0 var(--bd),0 2rem 3rem rgba(0,0,0,.3);font-size:2rem;text-align:center}
.box h2{margin:0 0 1rem;font-size:3.2rem;text-shadow:0 .2rem 0 var(--bd)}
.x{position:absolute;right:-1rem;top:-1rem;width:4.6rem;height:4.6rem;border-radius:50%;background:#ee4a4a;box-shadow:0 .3rem 0 #8e1d1d;font-size:2.4rem;padding:0}
.row{display:flex;align-items:center;gap:1.2rem;background:rgba(18,51,127,.28);border-radius:1.4rem;padding:.7rem 1.2rem;margin:.7rem 0;text-align:left;font-size:1.9rem}
.row .ri{width:4.4rem;height:4.4rem;flex:none}.row .ri svg{width:100%;height:100%}.row small{display:block;font-size:1.2rem;color:#d7ecff;font-weight:700}
.row.cl{outline:.25rem solid #ffe36a}.row .tag{margin-left:auto;font-size:1.2rem;padding:.2rem .9rem;border-radius:1rem;background:#7a8fb0}
.row.cl .tag{background:var(--g)}
.rw{margin:.4rem auto 1rem;width:12rem;height:12rem;animation:bounce .8s ease-in-out infinite}.rw svg{width:100%;height:100%}
@keyframes bounce{50%{translate:0 -1rem;scale:1.06}}
.ok{display:block;width:100%;margin-top:1rem;height:4.8rem;border-radius:2.4rem;font-size:2.4rem;padding:0;background:linear-gradient(#ffd24d,#ff9a1f);box-shadow:0 .4rem 0 #c96a0c;text-shadow:0 .1rem 0 #8a4a0a}
#toast{position:fixed;left:50%;bottom:3rem;translate:-50% 2rem;background:var(--bd);padding:.8rem 2.4rem;border-radius:2rem;font-size:2.2rem;opacity:0;transition:opacity .3s,translate .35s cubic-bezier(.3,1.8,.5,1);z-index:99;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;translate:-50% 0}
#rot{position:fixed;inset:0;z-index:200;display:none;place-items:center;background:#1f6fe0;font-size:5vw;text-align:center;padding:2rem}
@media(max-aspect-ratio:1/1){#rot{display:grid}}

<script>
(()=>{
const $=s=>document.querySelector(s),fmt=n=>n.toLocaleString('id-ID');
// ---------- icons
const I={
gem:'<svg viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z" fill="#4cc9ff" stroke="#1d7fd0" stroke-width="1.200" stroke-linejoin="round"/><path d="M2 9h20M9 3l-2 6 5 12 5-12-2-6" fill="none" stroke="#bff0ff" stroke-width=".8"/></svg>',
coin:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffc83a" stroke="#c98a0c" stroke-width="1.500"/><circle cx="12" cy="12" r="7.300" fill="none" stroke="#ffe27a" stroke-width="1"/><text x="12" y="17" font-size="13" font-weight="900" text-anchor="middle" fill="#c98a0c">$</text></svg>',
coins:'<svg viewBox="0 0 24 24"><ellipse cx="9" cy="17" rx="7" ry="3.500" fill="#e0a020" stroke="#c98a0c"/><ellipse cx="9" cy="14.500" rx="7" ry="3.500" fill="#ffc83a" stroke="#c98a0c"/><circle cx="16" cy="9" r="6" fill="#ffc83a" stroke="#c98a0c" stroke-width="1.200"/><text x="16" y="12" font-size="8" font-weight="900" text-anchor="middle" fill="#c98a0c">$</text></svg>',
box:'<svg viewBox="0 0 24 24"><path d="M12 2 3 6.500v11L12 22l9-4.500v-11z" fill="#a85ae8" stroke="#6a2ab0" stroke-width="1.200" stroke-linejoin="round"/><path d="M3 6.500 12 11l9-4.500M12 11v11" fill="none" stroke="#d6a8ff" stroke-width="1"/><text x="7.500" y="17.500" font-size="7" font-weight="900" fill="#fff" rotate="-8">?</text><text x="15" y="15" font-size="6" font-weight="900" fill="#ffe36a">?</text></svg>',
dice:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4.500" fill="#fff" stroke="#9ab4e0" stroke-width="1.200"/><g fill="#2f6fd0"><circle cx="8" cy="8" r="1.700"/><circle cx="16" cy="8" r="1.700"/><circle cx="12" cy="12" r="1.700"/><circle cx="8" cy="16" r="1.700"/><circle cx="16" cy="16" r="1.700"/></g></svg>',
skin:(h,hr)=>`<svg viewBox="0 0 40 40"><rect x="9" y="28" width="22" height="12" rx="2" fill="${h}"/><rect x="10" y="8" width="20" height="20" fill="#f0b98d"/><rect x="8" y="4" width="24" height="9" fill="${hr}"/><rect x="14" y="17" width="3.500" height="4.500" fill="#222"/><rect x="23" y="17" width="3.500" height="4.500" fill="#222"/><rect x="17" y="23" width="6" height="2" fill="#c0473a"/></svg>`,
ck:'<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
gift:'<svg viewBox="0 0 24 24"><path d="M4 11h16v10H4z" fill="#f5a623" stroke="#b86a0a" stroke-width=".8"/><path d="M3 8h18v4H3z" fill="#ffd24d" stroke="#b86a0a" stroke-width=".8"/><path d="M10.500 8h3v13h-3z" fill="#e8372c"/><path d="M12 8C8 8 7 3 10 3.600c1.600.5 2 4.400 2 4.400Zm0 0c4 0 5-5 2-4.400-1.600.5-2 4.400-2 4.400Z" fill="#ff5a3c" stroke="#b01e14" stroke-width=".8"/></svg>'};
$('#tgift').innerHTML=I.gift;$('#gemI').innerHTML=I.gem;$('#coinI').innerHTML=I.coin;
// ---------- data (reward table memakai ID canonical dari ItemCatalog; lihat DATA_MIGRATION.md)
const PD=window.PlayerData,IC=window.ItemCatalog;
const R=[
 {h:'Hari 1',a:'x50',t:'50 Gem',ic:I.gem,ty:'gem',n:50},
 {h:'Hari 2',a:'x1.000',t:'1.000 Coin',ic:I.coin,ty:'coin',n:1000},
 {h:'Hari 3',a:'x1',t:'Mystery Box x1',ic:I.box,ty:'box',n:1},
 {h:'Hari 4',a:'x1',t:'Dadu Rumput x1',ic:I.dice,ty:'dice',id:'rumput',dup:100},
 {h:'Hari 5',a:'x1',t:'Dadu Emas x1',ic:I.dice,ty:'dice',id:'emas',dup:300},
 {h:'Hari 6',a:'x2.000',t:'2.000 Coin',ic:I.coins,ty:'coin',n:2000},
 {h:'Hari 7',a:'Skin Epic',sub:'(Permanen)',t:'Skin Epic Enderman (Permanen)',ic:I.skin('#141414','#222222'),ty:'skin',id:'skin.ender',big:1}];
// ---------- state: currency/ownership dari PlayerData. State klaim yang EXISTING (inv.daily, inv.bag)
// tetap dipakai & disimpan ke key legacy 'inv' (read-modify-write; field lain TIDAK ditimpa, key tidak dihapus).
function invField(k,def){try{const r=JSON.parse(localStorage.getItem('inv')||'null');return (r&&r[k]&&typeof r[k]==='object')?r[k]:def}catch(e){return def}}
let D=Object.assign({claimed:0,last:'',shift:0,temp:null},invField('daily',{}));
let BAG=Object.assign({box:0},invField('bag',{}));
const save=()=>{try{const r=(()=>{try{return JSON.parse(localStorage.getItem('inv'))||{}}catch(e){return{}}})();r.daily=D;r.bag=BAG;localStorage.setItem('inv',JSON.stringify(r))}catch(e){}};
const now=()=>new Date(Date.now()+D.shift*864e5);
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const daysBetween=(a,b)=>Math.round((Date.UTC(...b.split('-').map((v,i)=>i===1?v-1:+v))-Date.UTC(...a.split('-').map((v,i)=>i===1?v-1:+v)))/864e5);
function sync(){const t=key(now());if(D.last){const df=daysBetween(D.last,t);if(df>1||(df>=1&&D.claimed>=7))D.claimed=0}
 if(D.temp&&Date.now()+D.shift*864e5>D.temp.exp)D.temp=null;save()}
const doneToday=()=>D.last===key(now());
// ---------- helpers
const SET=()=>PD.settings();
const SFX={click:'button',select:'button',open:'button',error:'button',coin:'button',purchase:'power',chest:'chest'};
function playSound(n){if(!SET().sound)return;try{UT.Audio.play(SFX[n]||'button')}catch(e){}}
const buzz=()=>{if(SET().vibration&&navigator.vibrate)navigator.vibrate(20)};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1700)}
function sparkle(el,n=16){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;for(let i=0;i<n;i++){const s=document.createElement('i');s.className='sp';s.style.left=cx+'px';s.style.top=cy+'px';const a=Math.random()*6.28,d=40+Math.random()*80;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),900)}}
function pulse(id){const e=$(id);e.classList.remove('pulse');void e.offsetWidth;e.classList.add('pulse')}
// ---------- modal
const modal=$('#modal');let mOpen=false;
function openModal(html,init){$('#mb').innerHTML=html;modal.style.display='grid';requestAnimationFrame(()=>modal.classList.add('show'));mOpen=true;playSound('open');init&&init();$('#mx').focus()}
function closeModal(){if(!mOpen)return;mOpen=false;modal.classList.remove('show');setTimeout(()=>{if(!mOpen)modal.style.display='none'},250)}
$('#mx').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
// ---------- render
function state(i){return i<D.claimed?'done':(i===D.claimed&&!doneToday()&&D.claimed<7)?'now':'wait'}
function renderDays(){
 $('#days').innerHTML=R.map((r,i)=>{const st=state(i);
  return `<div class="day ${st} ${r.big?'big':''}" data-i="${i}" role="button" tabindex="0" aria-label="${r.h}: ${r.t}"><div class="hd">${r.h}</div><div class="ic">${r.ic}</div><div class="am ${r.s?'s':''}">${r.a}${r.sub?`<small>${r.sub}</small>`:''}</div><button class="st">${st==='done'?I.ck+'Diklaim':st==='now'?'Klaim':'Menunggu'}</button></div>`}).join('');
 document.querySelectorAll('.day').forEach(d=>{const go=()=>{const i=+d.dataset.i,st=state(i);if(st==='now')claim(i,d);else if(st==='done'){toast('Hadiah sudah diklaim.');playSound('click')}else{toast(i>D.claimed?'Belum waktunya, login besok!':'Sudah klaim hari ini, kembali besok!');playSound('error')}};
  d.addEventListener('click',go);d.addEventListener('keydown',e=>{if(e.key==='Enter')go()})});
 const tr=$('#track');tr.querySelectorAll('.nd').forEach(n=>n.remove());
 for(let i=0;i<7;i++){const n=document.createElement('div');n.className='nd'+(i<D.claimed?' dn':'');tr.appendChild(n)}
 $('#fill').style.width=`calc((100% - 2.6rem) * ${Math.min(D.claimed,6)/6})`;
 renderCurrency()}
function renderCurrency(){try{$('#gemV').textContent=fmt(PD.gems());$('#coinV').textContent=fmt(PD.coins())}catch(e){}}
// ---------- claim (semua reward lewat transaksi PlayerData: atomik, tidak bisa digandakan)
function grant(r){let msg=r.t;
 if(r.ty==='gem')PD.grant({gems:r.n});
 else if(r.ty==='coin')PD.grant({coins:r.n});
 else if(r.ty==='box'){BAG.box=(BAG.box||0)+1;save()}
 else if(r.ty==='dice'){const res=PD.grant({item:'dice.'+r.id,duplicateCoins:r.dup||300});if(res.duplicate)msg='Dadu (sudah punya) → +'+fmt(r.dup||300)+' Coin'}
 else if(r.ty==='skin'){const res=PD.grant({item:r.id,duplicateGems:100});if(res.duplicate)msg='Skin (sudah punya) → +100 Gem'}
 else if(r.ty==='powerup'){const res=PD.grant({item:r.id});if(res.ok)msg=r.t+' ×1 diterima (Power)'}
 return msg}
function claim(i,el){const r=R[i],msg=grant(r);D.claimed=i+1;D.last=key(now());save();
 playSound('purchase');buzz();sparkle(el,22);pulse(r.ty==='gem'?'#gem':'#coin');renderDays();
 openModal(`<h2>Hadiah Diklaim!</h2><div class="rw">${r.ic}</div><div>${msg}</div><button class="ok" id="okb">Mantap!</button>`,()=>$('#okb').addEventListener('click',()=>{playSound('click');closeModal()}))}
// ---------- list modal
$('#see').addEventListener('click',()=>{playSound('click');
 openModal('<h2>Semua Hadiah</h2>'+R.map((r,i)=>`<div class="row ${state(i)==='now'?'cl':''}"><div class="ri">${r.ic}</div><div>${r.h}<small>${r.t}</small></div><span class="tag">${state(i)==='done'?'Diklaim':state(i)==='now'?'Klaim!':'Menunggu'}</span></div>`).join(''))});
// ---------- misc buttons
document.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click',()=>{playSound('click');location.href='shop.html'}));
$('#back').addEventListener('click',()=>{playSound('click');location.href='lobby.html'});
$('#rst').addEventListener('click',()=>{D.shift++;sync();renderDays();tick();playSound('select');toast('Simulasi: hari berikutnya (mock)')});
// ---------- countdown
function tick(){const n=now(),m=new Date(n);m.setHours(24,0,0,0);let s=Math.max(0,Math.floor((m-n)/1000));
 $('#cd').textContent=[s/3600|0,(s%3600)/60|0,s%60].map(v=>String(v).padStart(2,'0')).join(':');
 if(s===0||key(n)!==tick.k){if(tick.k&&key(n)!==tick.k){sync();renderDays()}tick.k=key(n)}}
// ---------- 3D
let ok=typeof THREE!=='undefined';
const M=(c,r=.7)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const bx=(w,h,d,m,x=0,y=0,z=0,p)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;p&&p.add(o);return o};
function island(){const g=new THREE.Group(),geo=new THREE.BoxGeometry(1,1,1),
 G=[M(0x6cc23a),M(0x7ed34a),M(0x62b535)],D=[M(0x8b5a36),M(0x7d4f2e),M(0x96623b)];
 let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 const put=(m,x,y,z,sx=1,sy=1,sz=1)=>{const b=new THREE.Mesh(geo,m);b.position.set(x,y,z);b.scale.set(sx,sy,sz);b.castShadow=true;b.receiveShadow=true;g.add(b);return b};
 [[5,4,0],[4.3,3.3,1],[3.3,2.5,2],[2.1,1.6,3]].forEach(([rx,rz,k])=>{for(let ix=-6;ix<=6;ix++)for(let iz=-5;iz<=5;iz++){
  if((ix/rx)**2+(iz/rz)**2>1+(k?rnd()*.15-.1:0))continue;
  put(D[(rnd()*3)|0],ix,-.55-k,iz);
  if(k===0)put(G[(rnd()*3)|0],ix,-.17,iz,1.02,.34,1.02)}});
 const wh=new THREE.MeshBasicMaterial({color:0xffffff}),ye=new THREE.MeshBasicMaterial({color:0xffd84a}),st=M(0x3d9a2a);
 [[-2.4,2.6],[-3.4,.8],[-1.6,3.4],[2.6,1.8],[3.6,.2],[1.4,-2.6],[-3.8,-1.4],[4,2.4],[.9,3]].forEach(([x,z])=>{
  put(st,x,.25,z,.08,.5,.08);const h=put(wh,x,.58,z,.3,.3,.12);h.rotation.y=rnd()*3;h.castShadow=false;
  put(ye,x,.58,z+.05,.14,.14,.14).castShadow=false});
 put(M(0x8a8a8a),3,.15,2.7,.55,.3,.45);put(M(0x9a9a9a),-4.2,.1,.5,.4,.2,.35);
 return g}
function hero(){const g=new THREE.Group(),skin=M(0xf0b98d),hood=M(0x2f8cf0),hair=M(0x4a2a1a),pants=M(0x3a4a78),wh=M(0xffffff),dk=M(0x221a18);
 const body=new THREE.Group();body.position.y=2.6;g.add(body);
 bx(1.7,1.9,1,hood,0,0,0,body);bx(.9,1.1,.1,wh,0,-.1,.52,body);
 const head=new THREE.Group();head.position.y=2.1;body.add(head);
 bx(2.2,2.1,2.1,skin,0,0,0,head);bx(2.5,.9,2.4,hood,0,1.2,-.05,head);bx(2.5,2,.5,hood,0,.2,-1.05,head);bx(.4,1.6,2.2,hood,-1.25,.4,0,head);bx(.4,1.6,2.2,hood,1.25,.4,0,head);
 bx(.6,.9,.4,hood,-.9,1.9,-.1,head);bx(.6,.9,.4,hood,.9,1.9,-.1,head);bx(1.1,.5,.2,wh,0,1.3,1.1,head);bx(2.2,.5,.3,hair,0,.75,1.05,head);
 [-.55,.55].forEach(x=>{bx(.42,.55,.1,dk,x,.0,1.06,head);bx(.14,.16,.1,wh,x+.08,.12,1.12,head)});bx(.9,.3,.1,M(0xc0473a),0,-.6,1.06,head);
 const arm=x=>{const a=new THREE.Group();a.position.set(x,.8,0);body.add(a);bx(.7,1.5,.7,hood,0,-.6,0,a);bx(.6,.5,.6,skin,0,-1.5,0,a);return a};
 const aL=arm(-1.2),aR=arm(1.2);
 [-.45,.45].forEach(x=>{const l=new THREE.Group();l.position.set(x,-1,0);body.add(l);bx(.8,1.4,.9,pants,0,-.6,0,l);bx(1,.5,1.3,wh,0,-1.45,.15,l)});
 g.rotation.y=.35;
 g.userData.anim=t=>{body.position.y=2.6+Math.sin(t*2)*.06;head.rotation.z=Math.sin(t*1.2)*.04;aL.rotation.z=-.15;aR.rotation.z=2.5+Math.sin(t*9)*.35;g.position.y=Math.abs(Math.sin(t*3))*.12};g.position.x=-.5;const root=new THREE.Group();root.add(g,island());root.userData.anim=t=>{g.userData.anim(t);root.position.y=Math.sin(t*1.3)*.08};return root}
function chest(){const g=new THREE.Group(),pu=M(0x8a3ad8,.5),go=M(0xffc83a,.35),gl=new THREE.MeshBasicMaterial({color:0xfff3a0});
 bx(5,2.6,3.4,pu,0,1.3,0,g);bx(5.2,1.6,3.6,pu,0,3.1,0,g);
 [-1.8,1.8].forEach(x=>{bx(.7,2.8,3.6,go,x,1.3,0,g);bx(.7,1.8,3.8,go,x,3.1,0,g)});
 bx(5.3,.4,3.7,go,0,2.5,0,g);bx(1.2,1.4,.3,go,0,2.2,1.75,g);bx(.5,.5,.35,M(0x6a2ab0),0,2.2,1.9,g);
 bx(3.4,.7,2.4,gl,0,4.1,0,g);
 const sp=[];for(let i=0;i<18;i++){const q=bx(.22,.22,.22,gl,0,0,0,g);q.castShadow=false;sp.push(q)}
 g.userData.anim=t=>{g.rotation.y=Math.sin(t*.7)*.5;g.position.y=-1.6+Math.sin(t*1.8)*.15;sp.forEach((q,i)=>{const a=t*1.2+i*.9,h=((t*.8+i*.37)%1);q.position.set(Math.cos(a)*(2.6+Math.sin(i)),3+h*3.5,Math.sin(a)*2);q.scale.setScalar(1-h);q.rotation.y=a})};return g}
const rigs=[];
function rig(cv,build,cy,dist,fov,cx=0,up=1,lk=1){if(!ok)return;try{const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});r.shadowMap.enabled=true;
 const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(fov,1,.1,100);sc.add(new THREE.AmbientLight(0xffffff,.65*lk),new THREE.HemisphereLight(0xcfeaff,0x6a9a50,.6*lk));
 const sun=new THREE.DirectionalLight(0xfff2d8,.9*lk);sun.position.set(6,12,8);sun.castShadow=true;sun.shadow.camera.left=-10;sun.shadow.camera.right=10;sun.shadow.camera.top=10;sun.shadow.camera.bottom=-10;sun.shadow.mapSize.set(1024,1024);sc.add(sun);
 const m=build();sc.add(m);rigs.push({r,sc,cam,cv,m,cy,dist,cx,up})}catch(e){ok=false;console.warn('WebGL unavailable',e)}}
function fit(){rigs.forEach(o=>{const w=o.cv.clientWidth,h=o.cv.clientHeight;if(!w||!h)return;o.r.setPixelRatio(Math.min(devicePixelRatio,1.5));o.r.setSize(w,h,false);o.cam.aspect=w/h;o.cam.updateProjectionMatrix()})}
function loop(){requestAnimationFrame(loop);const t=clock.getElapsedTime();rigs.forEach(o=>{o.m.userData.anim(t);o.cam.position.set(o.cx,o.cy+o.up,o.dist);o.cam.lookAt(o.cx,o.cy,0);o.r.render(o.sc,o.cam)})}
let clock;
if(ok){rig($('#glh'),hero,1.6,19,38,1.4,3,.72);rig($('#glc'),chest,2.3,18,34)}
if(ok&&rigs.length){clock=new THREE.Clock();new ResizeObserver(fit).observe(document.body);fit();requestAnimationFrame(loop)}
else{$('#hero').innerHTML='<div style="height:100%;display:grid;place-items:center;font-size:6rem">🧑‍🚀</div>';$('#chest').innerHTML='<div style="height:100%;display:grid;place-items:center;font-size:8rem">🎁</div>'}
// ---------- init
sync();renderDays();tick();setInterval(tick,1000);
})();
</script>
</body></html>
