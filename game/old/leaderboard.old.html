<link rel="stylesheet" href="assets/css/base.css"><style>
:root{--bd:#12337f;--g:#3cc23c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html{font-size:min(1vw,1.78vh)}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Baloo 2','Fredoka','Nunito',system-ui,sans-serif;font-weight:800;color:#fff;background:linear-gradient(#5db4f5,#a9dcf8 60%,#d5f0ff)}
#sky{position:fixed;inset:0;overflow:hidden}
.isl{position:absolute;opacity:.75;animation:fl 6s ease-in-out infinite}
.isl i{display:block;background:#6fbf4a}.isl b{display:block;background:#8a5a3a;margin:0 auto}
@keyframes fl{50%{translate:0 -.8rem}}
.ab{position:absolute}
button{font:inherit;color:inherit;border:0;cursor:pointer;transition:transform .15s cubic-bezier(.3,1.6,.5,1),filter .15s}
button:hover{transform:scale(1.05);filter:brightness(1.08)}button:active{transform:scale(.94)}button:focus-visible{outline:.3rem solid #fff}
.blue{background:linear-gradient(#4aa8ff,#1f6fe0);box-shadow:0 .5rem 0 var(--bd),0 1rem 1.4rem rgba(18,51,127,.4),inset 0 .2rem .2rem rgba(255,255,255,.6)}
svg{display:block}
#back{left:1.8rem;top:1.3rem;width:5.4rem;height:5.4rem;border-radius:1.6rem;padding:0;display:grid;place-items:center}

#title{left:7.8rem;top:1.3rem;width:32.6rem;height:5.4rem;border-radius:2.7rem;display:flex;align-items:center;gap:1.4rem;padding-left:2.4rem;font-size:4.2rem;text-shadow:0 .2rem 0 var(--bd)}
#title svg{width:4.4rem;height:4.4rem}
.pulse{animation:pu .4s}@keyframes pu{50%{transform:scale(1.15)}}
#gear{left:94rem;top:1.7rem;width:4.4rem;height:4.4rem;border-radius:1.4rem;padding:0;display:grid;place-items:center}#gear svg{width:2.8rem;height:2.8rem}

#tb{left:2.5rem;top:8.4rem;display:flex;gap:0;height:4.8rem}
.tb{height:4.8rem;border-radius:2.4rem;display:flex;align-items:center;justify-content:center;gap:1.2rem;font-size:2.2rem;padding:0 2rem;background:linear-gradient(#2f94f0,#1766d8);box-shadow:0 .3rem 0 var(--bd),inset 0 .15rem .2rem rgba(255,255,255,.4);border:.25rem solid transparent;text-shadow:0 .15rem 0 var(--bd)}
.tb svg{width:3.2rem;height:3.2rem}
.tb.on{border-color:#ffe36a;background:linear-gradient(#ffe36a,#f4b62a);box-shadow:0 .3rem 0 #b9740c,0 0 1.4rem #ffd24d;text-shadow:0 .2rem 0 #a35f08;transform:scale(1.04)}
/* podium */
#pod{left:0;top:12.4rem;width:48rem;height:32.6rem}

#pod canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.med{position:absolute;translate:-50% 0;pointer-events:none;filter:drop-shadow(0 .3rem .3rem rgba(0,0,0,.3));animation:fl 4s ease-in-out infinite}
.med svg{width:100%;height:100%}
.plate{position:absolute;translate:-50% 0;bottom:1rem;border-radius:1.6rem;text-align:center;padding:.6rem .6rem .5rem;line-height:1.15;box-shadow:0 .3rem 0 rgba(10,30,100,.55),inset 0 .15rem .2rem rgba(255,255,255,.35);border:.25rem solid rgba(255,255,255,.35)}
.plate .pn{font-size:2rem}.plate .ps{display:flex;gap:.5rem;justify-content:center;align-items:center;font-size:2.3rem}.plate svg{width:2.4rem;height:2.4rem}
#p1{left:50%;width:17rem;bottom:2.4rem;background:linear-gradient(#2d5fcb,#143a96);border-color:#ffc83a}

#p2{left:21%;width:12rem;background:linear-gradient(#34508a,#1c2f63)}
#p3{left:79%;width:12rem;background:linear-gradient(#7a4a3e,#4a2a2a)}

#me .bk{width:4rem;height:6.2rem;border-radius:1.2rem;padding:0;display:grid;place-items:center;flex:none}#me .bk svg{width:2.2rem;height:2.2rem}
.pos{background:linear-gradient(#2a6ad8,#1a4aa8);border-radius:1.4rem;padding:.4rem 1.2rem .3rem;text-align:center;line-height:1;box-shadow:inset 0 .15rem .3rem rgba(0,0,0,.25);flex:none;min-width:10rem}
.pos small{display:block;font-size:1.2rem;color:#dff0ff}.pos b{font-size:3.4rem;color:#ffd24d;text-shadow:0 .2rem 0 #a35f08}
.av{display:block;width:5.6rem;height:5.6rem;border-radius:1.2rem;border:.25rem solid #cfe6ff;overflow:hidden;background:#7cc2ff;flex:none}.av svg{width:100%;height:100%}
#me .inf{flex:1;min-width:0;line-height:1.1}#me .nm{font-size:2rem}#me .lv{font-size:1.4rem;color:#ffd24d}
.xp{position:relative;height:1.8rem;border-radius:.9rem;background:#12337f;margin-top:.4rem;overflow:hidden;box-shadow:inset 0 .1rem .2rem rgba(0,0,0,.4)}
.xp i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#5adcff,#1fa0e8);border-radius:.9rem}.xp span{position:absolute;inset:0;text-align:center;font-size:1.1rem;line-height:1.8rem}
.mysc{display:flex;align-items:center;gap:.7rem;font-size:2.8rem;flex:none;padding-right:.6rem}.mysc svg{width:3.6rem;height:3.6rem}
/* right panel */
#rt{left:50.6rem;top:11.2rem;width:47.2rem;height:41.9rem;border-radius:2.6rem;padding:1.2rem 1.3rem;background:linear-gradient(#3b9cf8,#2a86ee);box-shadow:0 .6rem 0 var(--bd),0 1.4rem 2.4rem rgba(18,51,127,.35),inset 0 .2rem .3rem rgba(255,255,255,.6),inset 0 0 0 .3rem #6cc0ff;display:flex;flex-direction:column;gap:.7rem}
.gc{display:grid;grid-template-columns:6.4rem 1fr 14rem 7rem;align-items:center}
#hd{height:3.4rem;border-radius:1.2rem;background:linear-gradient(#2a6ad8,#1a4aa8);font-size:1.7rem;text-align:center;flex:none;box-shadow:inset 0 .15rem .3rem rgba(0,0,0,.25)}
#hd span:nth-child(2){text-align:left;padding-left:5.2rem}
#rows{flex:1;min-height:0;display:flex;flex-direction:column;gap:.55rem}
.lr{flex:1;min-height:0;border-radius:1.4rem;background:linear-gradient(#1f5fd0,#143e9c);box-shadow:0 .2rem 0 rgba(10,30,100,.5),inset 0 .15rem .2rem rgba(255,255,255,.25);animation:pop .35s both;cursor:pointer}
@keyframes pop{from{opacity:0;transform:scale(.93)}}
.lr.me{background:linear-gradient(#2d8cf8,#1b62d8);box-shadow:0 0 0 .3rem #ffe36a,0 0 1.4rem rgba(255,227,106,.7),inset 0 .2rem .3rem rgba(255,255,255,.5)}
.lr .no{text-align:center;font-size:2.4rem}
.lr .who{display:flex;align-items:center;gap:1.2rem;min-width:0}.lr .av{width:4.6rem;height:4.6rem}
.lr .nm2{font-size:2rem;line-height:1.05}.lr .lv2{font-size:1.2rem;color:#cfe6ff;line-height:1}
.lr .sc{display:flex;align-items:center;gap:.7rem;font-size:2.1rem}.lr .sc svg{width:2.8rem;height:2.8rem}
.lr .rk{display:grid;place-items:center}.lr .rk svg{width:3.4rem;height:3.4rem}
#ft{height:7.2rem;border-radius:1.8rem;background:linear-gradient(#2a6ad8,#1a4aa8);display:flex;align-items:center;gap:1.4rem;padding:0 1.4rem;flex:none;box-shadow:inset 0 .15rem .3rem rgba(0,0,0,.25)}
#ft>svg{width:5rem;height:5rem;flex:none}#ft p{margin:0;flex:1;font-size:1.5rem;line-height:1.3;font-weight:700;color:#e0f2ff}
.gold{background:linear-gradient(#ffd24d,#ff9a1f);box-shadow:0 .4rem 0 #c96a0c,inset 0 .2rem .2rem rgba(255,255,255,.6);text-shadow:0 .15rem 0 #8a4a0a}
#rw{height:5rem;padding:0 2rem;border-radius:2.5rem;font-size:2.4rem;display:flex;align-items:center;gap:1rem}#rw svg{width:3.2rem;height:3.2rem}
/* modal */
.ov{position:fixed;inset:0;display:none;place-items:center;background:rgba(18,51,127,.4);backdrop-filter:blur(6px);z-index:50;opacity:0;transition:opacity .25s}
.ov.show{opacity:1}.ov>.box{transform:scale(.85);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}.ov.show>.box{transform:scale(1)}.ov.closing>.box{transform:scale(.9)}
.box{position:relative;width:min(48rem,92vw);max-height:92vh;overflow:auto;background:linear-gradient(#7cc2ff,#4a9ae8);border-radius:2.4rem;padding:3rem 2.4rem 2.4rem;box-shadow:0 1rem 0 var(--bd),0 2rem 3rem rgba(0,0,0,.3);font-size:2.6rem;text-align:center}
.box h2{margin:0 0 1.2rem;font-size:3.4rem;text-shadow:0 .2rem 0 var(--bd)}
.x{position:absolute;right:-1rem;top:-1rem;width:4.6rem;height:4.6rem;border-radius:50%;background:#ee4a4a;box-shadow:0 .3rem 0 #8e1d1d;font-size:2.4rem;padding:0}
.row{display:flex;justify-content:space-between;align-items:center;background:rgba(18,51,127,.25);border-radius:1.4rem;padding:1rem 1.4rem;margin:.8rem 0;gap:1rem}
.row b{display:flex;align-items:center;gap:.6rem}.row svg{width:2.8rem;height:2.8rem}
.tg{min-width:7.6rem;height:3.8rem;border-radius:2rem;background:#7b8aa8;box-shadow:inset 0 .2rem .4rem rgba(0,0,0,.3);font-size:2rem;padding:0 1rem}.tg.on{background:var(--g)}
.pack{width:100%;display:flex;justify-content:space-between;align-items:center;margin:.8rem 0;padding:1.2rem 1.6rem;border-radius:1.4rem;background:linear-gradient(#ffd24d,#ff9a1f);box-shadow:0 .4rem 0 #c96a0c;font-size:2.6rem;text-shadow:0 .2rem 0 rgba(107,53,17,.7)}
#toast{position:fixed;left:50%;bottom:3rem;translate:-50% 2rem;background:var(--bd);padding:.8rem 2.4rem;border-radius:2rem;font-size:2.6rem;opacity:0;transition:opacity .3s,translate .35s cubic-bezier(.3,1.8,.5,1);z-index:99;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;translate:-50% 0}
#top{display:contents}
@media(max-aspect-ratio:1/1){
html{font-size:2.5vw}
#ui{position:fixed;inset:0;overflow:auto;display:flex;flex-direction:column;gap:1.4rem;padding:1.2rem}
.ab{position:relative!important;left:auto!important;top:auto!important;right:auto!important}
#top{display:flex;flex-wrap:wrap;align-items:center;gap:1.2rem 3rem}
#title{order:-1;width:auto!important}
#tb{overflow-x:auto}.tb{flex:none}
#pod{width:auto!important;height:78vw!important}
#me{width:auto!important}
#rt{width:auto!important;height:auto!important}.lr{flex:none;height:7rem}
}

let tab='global';
const pad=n=>n<10?'0'+n:''+n;
function renderTabs(){$('#tb').innerHTML=TABS.map(t=>`<button class="tb ${t[0]===tab?'on':''}" data-t="${t[0]}"><svg viewBox="0 0 24 24" fill="#fff" stroke="#fff" stroke-width="1.800" stroke-linejoin="round" stroke-linecap="round">${t[2]}</svg>${t[1]}</button>`).join('');
 document.querySelectorAll('.tb').forEach(b=>b.addEventListener('click',()=>{if(tab===b.dataset.t)return;tab=b.dataset.t;playSound('select');buzz();renderTabs();renderAll()}))}
function renderPodium(){const d=DATA[tab].top;
 const pl=(i,k)=>`<div class="pn">${d[i][0]}</div><div class="ps">${TR}${fmt(d[i][1])}</div>`;
 $('#p1').innerHTML=pl(0);$('#p2').innerHTML=pl(1);$('#p3').innerHTML=pl(2)}
function renderMe(){const m=DATA[tab].me;
 $('#me').innerHTML=`<button class="blue bk" id="bk" aria-label="Sebelumnya"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="pos"><small>Posisi Kamu</small><b>#${m.rank}</b></div><span class="av">${face(ME.hair,ME.hood)}</span><div class="inf"><div class="nm">${ME.name}</div><div class="lv">Lv. ${ME.lv}</div><div class="xp"><i style="width:${ME.xp/ME.xpMax*100}%"></i><span>${ME.xp} / ${fmt(ME.xpMax)}</span></div></div><div class="mysc">${TR}${fmt(m.score)}</div>`;
 $('#bk').addEventListener('click',()=>{playSound('click');toast('Posisi kamu: #'+m.rank)})}
function renderRows(){const d=DATA[tab],m=d.me;
 const list=d.others.map(o=>({n:o[0],lv:o[1],s:o[2],h:o[3],c:o[4]}));
 const me={n:ME.name,lv:ME.lv,s:m.score,h:ME.hair,c:ME.hood,me:1};
 let out=[];
 if(m.rank<=8){list.splice(m.rank-4,0,me);out=list.map((o,i)=>({...o,r:4+i}))}
 else{out=list.slice(0,5).map((o,i)=>({...o,r:4+i}));out.push({...me,r:m.rank})}
 out=out.slice(0,6);if(m.rank<=8&&!out.some(o=>o.me))out[5]={...me,r:m.rank};
 $('#rows').innerHTML=out.map((o,i)=>`<div class="gc lr ${o.me?'me':''}" style="animation-delay:${i*40}ms" data-n="${o.n}" data-r="${o.r}"><span class="no">${o.me&&o.r>99?o.r:pad(o.r)}</span><div class="who"><span class="av">${face(o.h,o.c)}</span><div><div class="nm2">${o.n}</div><div class="lv2">Lv. ${o.lv}</div></div></div><div class="sc">${TR}${fmt(o.s)}</div><div class="rk">${o.me?SHD:DM}</div></div>`).join('');
 document.querySelectorAll('.lr').forEach(r=>r.addEventListener('click',()=>{playSound('click');toast(r.dataset.n+' — peringkat #'+r.dataset.r)}))}
function renderCur(){renderCurrency()}
function renderCurrency(){$('#gemV').textContent=fmt(PD.gems());$('#coinV').textContent=fmt(PD.coins())}
function renderAll(){renderPodium();renderMe();renderRows();renderCur()}
// ---- event: currency ikut berubah tanpa reload halaman
UT.Events.on('currencyChanged',renderCurrency);
$('#rw').innerHTML=TR+'Lihat Hadiah';
// ---- modal
const modal=$('#modal');let mOpen=false;
function openModal(html,init){$('#mb').innerHTML=html;modal.style.display='grid';requestAnimationFrame(()=>modal.classList.add('show'));mOpen=true;playSound('open');init&&init();$('#mx').focus()}
function closeModal(){if(!mOpen)return;mOpen=false;modal.classList.add('closing');modal.classList.remove('show');setTimeout(()=>{modal.style.display='none';modal.classList.remove('closing')},250)}
$('#mx').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function pulse(id){const e=$(id);e.classList.remove('pulse');void e.offsetWidth;e.classList.add('pulse')}
$('#rw').addEventListener('click',()=>{playSound('click');
 const R=[['Peringkat 1','500',DM],['Peringkat 2','300',DM],['Peringkat 3','200',DM],['Top 10','100',DM],['Top 100','50',DM]];
 openModal('<h2>Hadiah Musim Ini</h2>'+R.map(r=>`<div class="row"><span>${r[0]}</span><b>+${r[1]}${r[2]}</b></div>`).join(''))});
function buy(type){const g=type==='gem',packs=g?[[10,'Rp 15.000'],[50,'Rp 59.000'],[120,'Rp 129.000']]:[[500,'10 Gem'],[2500,'40 Gem'],[10000,'120 Gem']];
 openModal(`<h2>Tambah ${g?'Gem':'Coin'}</h2>`+packs.map((p,i)=>`<button class="pack" data-i="${i}"><span>+${fmt(p[0])}</span><span>${p[1]}</span></button>`).join(''),()=>{
  document.querySelectorAll('.pack').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.i,p=packs[i];const r=g?PD.addCurrency(0,p[0]):PD.addCurrency(p[0],-[10,40,120][i]);
   if(!r.ok){toast(r.reason==='gem-kurang'?'Gem tidak cukup.':'Transaksi gagal.');playSound('error');return}
   renderCurrency();pulse(g?'#gem':'#coin');playSound('coin');toast(g?'Berhasil (mock)':'Berhasil');closeModal()}))})}
document.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click',()=>buy(b.dataset.buy)));
$('#gear').addEventListener('click',()=>{const T=SET();const row=(k,l)=>`<div class="row"><span>${l}</span><button class="tg ${T[k]?'on':''}" data-k="${k}">${T[k]?'ON':'OFF'}</button></div>`;
 openModal(`<h2>Pengaturan</h2>${row('music','Musik')}${row('sound','Suara')}${row('vibration','Getar')}<div class="row"><span>Grafik</span><button class="tg on" data-k="graphics">${T.graphics==='high'?'Tinggi':'Rendah'}</button></div>`,()=>{
  document.querySelectorAll('.tg').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.k,cur=SET();let v;
   if(k==='graphics'){v=cur.graphics==='high'?'low':'high';b.textContent=v==='high'?'Tinggi':'Rendah';PD.setSettings({graphics:v});fit()}
   else{v=!cur[k];b.classList.toggle('on',v);b.textContent=v?'ON':'OFF';PD.setSettings({[k]:v})}
   playSound('click');buzz()}))})});
$('#back').addEventListener('click',()=>{playSound('click');location.href='lobby.html'});
window.openLeaderboard=()=>{$('#ui').style.display=''};window.closeLeaderboard=()=>{$('#ui').style.display='none'};
// ---- 3D podium
const M=(c,r=.7)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const bx=(w,h,d,m,x=0,y=0,z=0,p)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);p&&p.add(o);return o};
function character(sk,emote){const g=new THREE.Group(),P={};const skin=M(0xf0b98d),hood=M(sk.hood),hair=M(sk.hair),pants=M(sk.pants),wh=M(0xffffff),bl=M(0x2f6fd0),pk=M(0x7a4a2a),dk=M(0x221a18);
 const body=new THREE.Group();body.position.y=2.6;g.add(body);P.body=body;
 bx(1.7,1.9,1,hood,0,0,0,body);bx(.9,1.1,.1,wh,0,-.1,.52,body);bx(1.1,1.4,.5,pk,0,0,-.75,body);
 const head=new THREE.Group();head.position.y=2.1;body.add(head);P.head=head;
 bx(2.2,2.1,2.1,skin,0,0,0,head);bx(2.4,.8,2.3,hair,0,1.15,-.05,head);bx(2.4,1.8,.5,hair,0,.2,-1,head);bx(.4,1.2,2.1,hair,-1.2,.4,0,head);bx(.4,1.2,2.1,hair,1.2,.4,0,head);bx(2.2,.5,.5,hair,0,.8,1.05,head);
 P.eyes=[-.55,.55].map(x=>{const e=new THREE.Group();e.position.set(x,.05,1.06);head.add(e);bx(.42,.55,.1,dk,0,0,0,e);bx(.14,.16,.1,wh,.08,.12,.06,e);return e});
 bx(.7,.15,.1,M(0xc0473a),0,-.6,1.06,head);
 const arm=x=>{const a=new THREE.Group();a.position.set(x,.8,0);body.add(a);bx(.7,1.5,.7,hood,0,-.6,0,a);bx(.6,.5,.6,skin,0,-1.5,0,a);return a};
 P.aL=arm(-1.2);P.aR=arm(1.2);
 const leg=x=>{const l=new THREE.Group();l.position.set(x,-1,0);body.add(l);bx(.8,1.4,.9,pants,0,-.6,0,l);bx(1,.5,1.3,wh,0,-1.45,.15,l);bx(1.02,.18,1.32,bl,0,-1.2,.15,l);return l};
 P.lL=leg(-.45);P.lR=leg(.45);
 g.userData.anim=t=>{const k=emote||'idle';P.body.position.y=2.6+Math.sin(t*2)*.05;P.body.scale.y=1+Math.sin(t*2)*.012;P.head.rotation.set(0,Math.sin(t*.7)*.12,Math.sin(t*.9)*.03);
  P.aL.rotation.z=-.15;P.aR.rotation.z=.15;
  if(k==='idle')P.aR.rotation.z=.15-Math.sin(t*2)*.05;
  if(k==='wave')P.aR.rotation.z=2.4+Math.sin(t*10)*.35;
  P.eyes.forEach(e=>e.scale.y=(t%4<.15)?.1:1)};
 return g}
let ok=typeof THREE!=='undefined',R=null;
function build(){const cv=$('#gl');
 try{const r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
  const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(30,1.45,.1,100);
  scene.add(new THREE.AmbientLight(0xffffff,.75),new THREE.HemisphereLight(0xcfeaff,0x6a9a50,.6));
  const sun=new THREE.DirectionalLight(0xfff2d8,.9);sun.position.set(5,12,10);scene.add(sun);
  const holder=new THREE.Group();scene.add(holder);
  const cfg=[{x:-3.3,h:1.9,col:0x9fb4d4,cap:0xc4d4ec,sk:{hood:0xeeeef2,hair:0xcfcfd6,pants:0x2a2a30},rot:.25},
             {x:0,h:2.6,col:0xf2b72a,cap:0xffd964,sk:{hood:0x1fb8d8,hair:0x7a4a2a,pants:0x4a4a58},rot:0,emote:'wave'},
             {x:3.3,h:1.5,col:0xc8743a,cap:0xe29a60,sk:{hood:0xd23a32,hair:0x5a3420,pants:0x333a4a},rot:-.25}];
  const chars=[];
  cfg.forEach(c=>{const pod=new THREE.Mesh(new THREE.CylinderGeometry(1.75,1.95,c.h,8),M(c.col,.6));pod.position.set(c.x,c.h/2,0);pod.rotation.y=Math.PI/8;holder.add(pod);
   const cap=new THREE.Mesh(new THREE.CylinderGeometry(1.55,1.75,.14,8),M(c.cap,.5));cap.position.set(c.x,c.h+.07,0);cap.rotation.y=Math.PI/8;holder.add(cap);
   const w=new THREE.Group();w.position.set(c.x,c.h+.14,0);w.scale.setScalar(.46);w.rotation.y=c.rot;const ch=character(c.sk,c.emote);w.add(ch);holder.add(w);chars.push(ch)});
  const ring=new THREE.Mesh(new THREE.RingGeometry(4.6,5.6,48),new THREE.MeshBasicMaterial({color:0xbfeaff,transparent:true,opacity:.55,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.02;ring.scale.set(1.6,1,1);holder.add(ring);
  R={r,scene,cam,chars,cv}}catch(e){ok=false;console.warn('WebGL unavailable',e)}}
function fit(){if(!R)return;const w=R.cv.clientWidth,h=R.cv.clientHeight;if(!w||!h)return;const hi=SET().graphics==='high';R.r.setPixelRatio(hi?Math.min(devicePixelRatio,1.5):1);R.r.setSize(w,h,false);R.cam.aspect=w/h;R.cam.fov=w/h<1.2?36:30;R.cam.updateProjectionMatrix()}
function loop(t0){requestAnimationFrame(loop);const t=t0/1000;if(!R.cv.offsetParent)return;R.chars.forEach(c=>c.userData.anim(t));R.cam.position.set(0,4.2,15);R.cam.lookAt(0,3.4,0);R.r.render(R.scene,R.cam)}
renderTabs();renderAll();
if(ok)build();
if(ok&&R){new ResizeObserver(fit).observe($('#pod'));fit();requestAnimationFrame(loop)}
else $('#pod').insertAdjacentHTML('afterbegin','<div style="position:absolute;inset:0;display:grid;place-items:center;font-size:3rem">3D tidak tersedia</div>');
})();
</script>
</body></html>
