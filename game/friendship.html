<!DOCTYPE html>
<html lang="id">
<head><script src="assets/js/boot-guard.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teman — Voxel Game</title>
<link rel="stylesheet" href="assets/css/base.css"><style>
:root{--bd:#12337f;--blue:#2f8cf0;--y1:#ffd24d;--y2:#ff9a1f;--g:#3cc23c;--red:#ee4a4a;--panel:#3b9cf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html{font-size:min(1vw,1.78vh)}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Baloo 2','Fredoka','Nunito',system-ui,sans-serif;font-weight:800;color:#fff;background:linear-gradient(#5db4f5,#a9dcf8 60%,#d5f0ff)}
button,input{font:inherit;color:inherit;border:0}button{cursor:pointer;transition:transform .15s cubic-bezier(.3,1.6,.5,1),filter .15s}button:hover{transform:scale(1.05);filter:brightness(1.08)}button:active{transform:scale(.94)}button:focus-visible,input:focus-visible{outline:.3rem solid #fff}
#sky{position:fixed;inset:0;overflow:hidden;pointer-events:none}.isl{position:absolute;opacity:.65;animation:fl 6s ease-in-out infinite}.isl i{display:block;background:#6fbf4a}.isl b{display:block;background:#8a5a3a;margin:0 auto}@keyframes fl{50%{translate:0 -.8rem}}
.ab{position:absolute}.blue{background:linear-gradient(#4aa8ff,#1f6fe0);box-shadow:0 .5rem 0 var(--bd),0 1rem 1.4rem rgba(18,51,127,.4),inset 0 .2rem .2rem rgba(255,255,255,.6)}
svg{display:block}#back{left:1.4rem;top:1.5rem;width:4.7rem;height:4.7rem;border-radius:1.4rem;padding:0;display:grid;place-items:center}#back svg{width:3rem;height:3rem}
#title{left:7rem;top:1.3rem;width:22rem;height:5rem;border-radius:2.5rem;display:flex;align-items:center;gap:1.2rem;padding-left:2.4rem;font-size:3.6rem;text-shadow:0 .2rem 0 var(--bd)}#title svg{width:3.6rem;height:3.6rem}
.cur{top:1.8rem;display:flex;align-items:center;height:4.2rem;padding:0 .5rem 0 4.8rem;border-radius:2.1rem;background:linear-gradient(#2d62c8,#173c94);box-shadow:0 .4rem 0 #0b2160,0 1rem 1.4rem rgba(18,51,127,.4),inset 0 .2rem .2rem rgba(255,255,255,.35);font-size:2rem;justify-content:space-between;gap:1rem;min-width:11.5rem}.cur>svg{position:absolute;left:-.5rem;top:50%;translate:0 -50%;width:5.2rem;height:5.2rem;filter:drop-shadow(0 .3rem .3rem rgba(0,0,0,.35))}.plus{width:3.2rem;height:3.2rem;border-radius:50%;background:radial-gradient(#7af07a,#2cb02c);border:.2rem solid #1c7d1c;display:grid;place-items:center;padding:0}.plus svg{width:1.9rem;height:1.9rem}
#gem{right:21rem}#coin{right:7.6rem}#gear{right:1.4rem;top:1.7rem;width:4.4rem;height:4.4rem;border-radius:1.4rem;padding:0;display:grid;place-items:center}#gear svg{width:2.8rem;height:2.8rem}
#hero{left:2.4rem;top:8rem;width:34rem;height:43rem;border-radius:2.6rem;background:linear-gradient(180deg,rgba(63,160,250,.95),rgba(42,126,224,.82));box-shadow:0 .6rem 0 var(--bd),0 1.4rem 2.4rem rgba(18,51,127,.3),inset 0 .2rem .3rem rgba(255,255,255,.55),inset 0 0 0 .3rem #6cc0ff;overflow:hidden}
#hero h2{position:absolute;left:2rem;top:1.3rem;margin:0;font-size:2.7rem;text-shadow:0 .18rem 0 var(--bd)}#hero p{position:absolute;left:2rem;top:5rem;right:2rem;margin:0;color:#e7f7ff;font-size:1.35rem;line-height:1.25}
#character{position:absolute;left:2rem;right:2rem;top:7rem;height:27rem}#character canvas{width:100%;height:100%;display:block}
.heroBtn{position:absolute;bottom:1.6rem;left:2rem;right:2rem;height:4.6rem;border-radius:2.3rem;font-size:1.9rem;background:linear-gradient(#ffd24d,#ff9a1f);box-shadow:0 .4rem 0 #c96a0c,inset 0 .25rem .25rem rgba(255,255,255,.6);text-shadow:0 .12rem 0 #8a4a0a}
#main{left:38rem;right:1.8rem;top:8rem;bottom:2rem;border-radius:2.6rem;padding:1.1rem;background:linear-gradient(#3b9cf8,#2a86ee);box-shadow:0 .6rem 0 var(--bd),0 1.4rem 2.4rem rgba(18,51,127,.35),inset 0 .2rem .3rem rgba(255,255,255,.6),inset 0 0 0 .3rem #6cc0ff;display:flex;flex-direction:column;gap:.9rem}
#mainTop{display:flex;gap:.7rem;align-items:center;flex:none}.tab{height:4rem;min-width:11rem;border-radius:2rem;background:linear-gradient(#2f94f0,#1766d8);box-shadow:0 .3rem 0 var(--bd);border:.25rem solid transparent;font-size:1.7rem;padding:0 1.5rem}.tab.on{border-color:#ffe36a;background:linear-gradient(#ffe36a,#f4b62a);box-shadow:0 .3rem 0 #b9740c,0 0 1.2rem #ffd24d;color:#fff;text-shadow:0 .15rem 0 #9a6500}
#searchRow{display:flex;gap:.8rem;align-items:center;flex:none}.search{height:4.2rem;flex:1;border-radius:2.1rem;background:rgba(18,51,127,.34);box-shadow:inset 0 .25rem .5rem rgba(10,40,120,.3);display:flex;align-items:center;padding:0 1.3rem;gap:.7rem}.search svg{width:2.1rem;flex:none}.search input{width:100%;height:100%;background:transparent;outline:0;font-size:1.45rem}.search input::placeholder{color:#d8edff}.add{height:4.2rem;padding:0 1.5rem;border-radius:2.1rem;background:linear-gradient(#ffd24d,#ff9a1f);box-shadow:0 .3rem 0 #c96a0c,inset 0 .15rem .2rem rgba(255,255,255,.6);font-size:1.5rem;text-shadow:0 .1rem 0 #8a4a0a}
#list{flex:1;min-height:0;overflow:auto;border-radius:2rem;padding:.7rem;background:linear-gradient(#2a7ce0,#2f90f2);box-shadow:inset 0 .3rem .6rem rgba(10,40,120,.35)}#friends{display:flex;flex-direction:column;gap:.7rem}.friend{min-height:6.8rem;border-radius:1.6rem;padding:.6rem .8rem;display:grid;grid-template-columns:5.5rem 1fr auto;align-items:center;gap:1rem;background:linear-gradient(#3f9bff,#1c55c0);box-shadow:0 .25rem 0 rgba(10,30,100,.5),inset 0 0 0 .2rem rgba(120,190,255,.55);animation:pop .25s both}.friend:hover{filter:brightness(1.08)}@keyframes pop{from{opacity:0;transform:translateY(.5rem)}}
.avatar{width:5.2rem;height:5.2rem;border-radius:1.4rem;background:linear-gradient(#5db4f5,#a9dcf8);box-shadow:inset 0 0 0 .2rem rgba(255,255,255,.35);display:grid;place-items:center;overflow:hidden}.avatar svg{width:100%;height:100%}.finfo{min-width:0}.name{font-size:1.65rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;align-items:center;gap:.8rem;color:#dff3ff;font-size:1.05rem;margin-top:.25rem}.dot{width:.8rem;height:.8rem;border-radius:50%;background:#3eea59;box-shadow:0 0 .8rem #3eea59}.dot.off{background:#9aaac0;box-shadow:none}.dot.busy{background:#ffd24d;box-shadow:0 0 .8rem #ffd24d}.actions{display:flex;gap:.5rem}.act{height:3.4rem;min-width:8rem;padding:0 1rem;border-radius:1.7rem;background:linear-gradient(#4db7ff,#1f86ee);box-shadow:0 .2rem 0 #14449f,inset 0 .15rem .15rem rgba(255,255,255,.5);font-size:1.15rem}.act.play{background:linear-gradient(#4fd44f,#1f9a2a);box-shadow:0 .2rem 0 #136b1c}.act.remove{background:linear-gradient(#ee6b6b,#bd3434);box-shadow:0 .2rem 0 #7e2020}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:#dff3ff;font-size:1.5rem}.empty div{max-width:30rem}.badgeCount{margin-left:auto;padding:.25rem .8rem;border-radius:1rem;background:#1b55c0;font-size:1rem}.request .act{background:linear-gradient(#ffd24d,#ff9a1f);box-shadow:0 .2rem 0 #c96a0c}
#toast{position:fixed;left:50%;bottom:3rem;translate:-50% 2rem;background:var(--bd);padding:.8rem 2.4rem;border-radius:2rem;font-size:2rem;opacity:0;transition:opacity .3s,translate .35s cubic-bezier(.3,1.8,.5,1);z-index:99;pointer-events:none;white-space:nowrap}.toastOn{opacity:1!important;translate:-50% 0!important}
.ov{position:fixed;inset:0;display:none;place-items:center;background:rgba(18,51,127,.4);backdrop-filter:blur(6px);z-index:50;opacity:0;transition:opacity .25s}.ov.show{opacity:1}.box{position:relative;width:min(46rem,92vw);max-height:90vh;overflow:auto;background:linear-gradient(#7cc2ff,#4a9ae8);border-radius:2.4rem;padding:3rem 2.4rem 2.4rem;box-shadow:0 1rem 0 var(--bd),0 2rem 3rem rgba(0,0,0,.3);font-size:1.5rem;text-align:center;transform:scale(.85);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}.ov.show .box{transform:scale(1)}.box h2{margin:0 0 1rem;font-size:3rem;text-shadow:0 .2rem 0 var(--bd)}.x{position:absolute;right:-1rem;top:-1rem;width:4.6rem;height:4.6rem;border-radius:50%;background:#ee4a4a;box-shadow:0 .3rem 0 #8e1d1d;font-size:2.4rem;padding:0}.modalBtns{display:flex;gap:.8rem;justify-content:center;margin-top:1rem}.modalBtn{height:4.2rem;border-radius:2.1rem;padding:0 1.6rem;background:linear-gradient(#ffd24d,#ff9a1f);box-shadow:0 .3rem 0 #c96a0c;font-size:1.5rem}.modalBtn.no{background:linear-gradient(#8ab4e8,#5a88c8);box-shadow:0 .3rem 0 #2f5090}
@media(max-aspect-ratio:1/1){html{font-size:2.5vw}body{overflow:auto}#ui{position:relative;min-height:100vh;display:flex;flex-direction:column;gap:1rem;padding:1.2rem}.ab{position:relative!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important}#top{display:flex;flex-wrap:wrap;align-items:center;gap:1rem}#title{order:0;width:auto;flex:1;min-width:15rem}#gem,#coin{right:auto;top:auto}.cur{top:auto;min-width:9rem;height:3.8rem;padding-left:3.8rem;font-size:1.5rem}.cur>svg{width:4.2rem;height:4.2rem}.plus{width:2.7rem;height:2.7rem}.cur .plus svg{width:1.5rem}.gear{top:auto!important}#hero{width:auto;height:35rem;order:1}.heroBtn{bottom:1.2rem}.main,#main{order:2;left:auto;right:auto;top:auto;bottom:auto;width:auto;height:65rem;min-height:65rem}.friend{grid-template-columns:5rem 1fr}.actions{grid-column:2}.actions .act{flex:1}.avatar{width:4.7rem;height:4.7rem}.name{font-size:1.45rem}.tab{min-width:9rem;font-size:1.35rem;padding:0 1rem}.search input{font-size:1.25rem}}
</style>
</head>
<body>
<div id="sky"></div>
<div id="ui">
<div id="top">
<button class="ab blue" id="back" aria-label="Kembali"><svg viewBox="0 0 24 24"><path d="M20 12H5m6-7-7 7 7 7" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/></svg></button>
<div class="ab blue" id="title"><svg viewBox="0 0 24 24"><path d="M7 20a5 5 0 1 1 0-10 5 5 0 0 1 10 0 5 5 0 1 1 0 10" fill="#fff"/><circle cx="9" cy="12" r="1.3" fill="#2f8cf0"/><circle cx="15" cy="12" r="1.3" fill="#2f8cf0"/></svg>Teman</div>
<div class="ab cur" id="gem"><svg viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z" fill="#4cc9ff" stroke="#1d7fd0"/><path d="M2 9h20M9 3l-2 6 5 12 5-12-2-6" fill="none" stroke="#bff0ff"/></svg><span id="gemV">120</span><button class="plus" aria-label="Tambah gem"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg></button></div>
<div class="ab cur" id="coin"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffc83a" stroke="#c98a0c"/><text x="12" y="17" font-size="14" font-weight="900" text-anchor="middle" fill="#c98a0c">$</text></svg><span id="coinV">8.450</span><button class="plus" aria-label="Tambah coin"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg></button></div>
<button class="ab blue" id="gear" aria-label="Pengaturan"><svg viewBox="0 0 24 24"><path fill="#fff" d="M19.4 13c.1-.3.1-.7.1-1s0-.7-.1-1l2.1-1.6-2-3.5-2.5 1a7 7 0 0 0-1.7-1L15 3.2h-4L10.6 6a7 7 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11c-.1.3-.1.7-.1 1s0 .7.1 1l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.8h4l.4-2.8c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg></button>
</div>
<section id="hero" class="ab">
<h2>Teman & Sosial</h2><p>Temukan teman, lihat siapa yang online, dan ajak mereka bermain bersama.</p>
<div id="character"><canvas id="gl"></canvas></div>
<button class="heroBtn" id="inviteHero">＋ Undang Teman</button>
</section>
<main id="main" class="ab">
<div id="mainTop"><button class="tab on" data-filter="online">Online <span class="badgeCount" id="onlineCount">0</span></button><button class="tab" data-filter="all">Semua</button><button class="tab" data-filter="request">Permintaan <span class="badgeCount" id="reqCount">2</span></button></div>
<div id="searchRow"><label class="search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="#fff" stroke-width="2.5"/><path d="m16 16 5 5" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg><input id="search" placeholder="Cari nama pemain..." autocomplete="off"></label><button class="add" id="addBtn">＋ Tambah</button></div>
<div id="list"><div id="friends"></div></div>
</main>
</div>
<div class="ov" id="modal"><div class="box"><button class="x" id="mx">✕</button><div id="mb"></div></div></div>
<div id="toast"></div>
<script src="assets/js/item-catalog.js"></script>
<script src="assets/js/player-data.js"></script>
<script src="assets/js/app.js"></script>
<script src="hud/ui-core.js"></script>
<script>UT.App.init({page:'friendship'});</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s);
// currency dari PlayerData (single source of truth) — angka hardcoded di HTML hanya fallback noscript
const PD=window.PlayerData,fmt=n=>n.toLocaleString('id-ID');
function renderCurrency(){$('#gemV').textContent=fmt(PD.gems());$('#coinV').textContent=fmt(PD.coins())}
renderCurrency();
UT.Events.on('currencyChanged',renderCurrency);
const friends=[
{id:1,name:'RakaPlay',level:28,status:'online',mode:'Lobby',skin:0x22b8d8},
{id:2,name:'NayaCraft',level:24,status:'online',mode:'Menunggu',skin:0x9a4ae0},
{id:3,name:'BimaGG',level:31,status:'busy',mode:'Ranked',skin:0xf0b030},
{id:4,name:'AlyaVoxel',level:19,status:'online',mode:'Lobby',skin:0x4acb58},
{id:5,name:'DinoRush',level:35,status:'offline',mode:'Offline',skin:0xd23a32},
{id:6,name:'KikoPlay',level:17,status:'offline',mode:'Offline',skin:0x5a75d6}
];
const requests=[{id:101,name:'FajarCube',level:21,status:'online',mode:'Mengirim permintaan',skin:0x35d3f0},{id:102,name:'SalsaFun',level:26,status:'online',mode:'Mengirim permintaan',skin:0xff7ad0}];
let filter='online',query='';
function avatar(color,seed){return `<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#a9dcf8"/><ellipse cx="50" cy="82" rx="31" ry="9" fill="#6fbf4a" opacity=".75"/><rect x="31" y="27" width="38" height="31" rx="3" fill="#f1c49b"/><rect x="27" y="23" width="46" height="13" rx="3" fill="#7a4a2a"/><rect x="26" y="50" width="48" height="32" rx="3" fill="${'#'+color.toString(16).padStart(6,'0')}"/><rect x="39" y="38" width="6" height="6" fill="#24335a"/><rect x="55" y="38" width="6" height="6" fill="#24335a"/><rect x="42" y="49" width="16" height="3" rx="1.5" fill="#a45a4d"/></svg>`}
function statusText(f){return f.status==='online'?'Online':f.status==='busy'?'Sedang bermain':'Offline'}
function render(){
 const source=filter==='request'?requests:friends;
 const arr=source.filter(f=>(f.name+' '+f.level).toLowerCase().includes(query.toLowerCase())).filter(f=>filter!=='online'||f.status==='online');
 $('#friends').innerHTML=arr.length?arr.map((f,i)=>`<article class="friend ${filter==='request'?'request':''}" data-id="${f.id}" style="animation-delay:${i*35}ms"><div class="avatar">${avatar(f.skin,i)}</div><div class="finfo"><div class="name">${f.name}</div><div class="meta"><span class="dot ${f.status==='offline'?'off':f.status==='busy'?'busy':''}"></span>Lv. ${f.level} · ${statusText(f)}${f.status!=='offline'&&filter!=='request'?` · ${f.mode}`:''}</div></div><div class="actions">${filter==='request'?`<button class="act accept">Terima</button><button class="act remove decline">Tolak</button>`:f.status==='online'?`<button class="act play">Ajak Main</button><button class="act remove" data-action="remove">Hapus</button>`:`<button class="act" data-action="profile">Profil</button>`}</div></article>`).join(''):`<div class="empty"><div><div style="font-size:4rem">👥</div><p>Tidak ada teman yang ditemukan.</p></div></div>`;
 $('#onlineCount').textContent=friends.filter(x=>x.status==='online').length;
 $('#reqCount').textContent=requests.length;
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('toastOn');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('toastOn'),1800)}
function openModal(html){$('#mb').innerHTML=html;$('#modal').style.display='grid';requestAnimationFrame(()=>$('#modal').classList.add('show'))}
function closeModal(){ $('#modal').classList.remove('show');setTimeout(()=>$('#modal').style.display='none',220)}
function addFriend(){openModal(`<h2>Tambah Teman</h2><p>Masukkan username pemain yang ingin kamu tambahkan.</p><label class="search" style="height:4.2rem;width:100%;display:flex;margin:1rem 0"><input id="friendName" placeholder="Contoh: Player123" style="text-align:center"></label><div class="modalBtns"><button class="modalBtn no" id="cancel">Batal</button><button class="modalBtn" id="send">Kirim Permintaan</button></div>`);$('#cancel').onclick=closeModal;$('#send').onclick=()=>{const n=$('#friendName').value.trim();if(!n){toast('Masukkan username dulu.');return}closeModal();toast('Permintaan teman dikirim!')}}
$('#search').addEventListener('input',e=>{query=e.target.value;render()});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.filter;render()}));
$('#addBtn').onclick=addFriend;$('#inviteHero').onclick=addFriend;$('#mx').onclick=closeModal;$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});
$('#back').onclick=()=>{location.href='lobby.html'};$('#gear').onclick=()=>toast('Pengaturan dibuka');
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action],.accept,.decline,.play');if(!btn)return;const card=btn.closest('.friend');const id=Number(card?.dataset.id);const f=[...friends,...requests].find(x=>x.id===id);if(btn.classList.contains('accept')){const idx=requests.findIndex(x=>x.id===id);if(idx>-1){friends.push({...requests[idx],status:'online',mode:'Lobby'});requests.splice(idx,1);filter='online';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.filter===filter));render();toast(f.name+' sekarang menjadi teman!')}}else if(btn.classList.contains('decline')){const idx=requests.findIndex(x=>x.id===id);if(idx>-1)requests.splice(idx,1);render();toast('Permintaan ditolak.')}else if(btn.classList.contains('play')){toast('Undangan bermain dikirim ke '+f.name+'!')}else if(btn.dataset.action==='remove'){const idx=friends.findIndex(x=>x.id===id);if(idx>-1)friends.splice(idx,1);render();toast('Teman dihapus.')}else if(btn.dataset.action==='profile'){openModal(`<h2>${f.name}</h2><p>Level ${f.level}<br>${statusText(f)}${f.mode?' · '+f.mode:''}</p><div class="modalBtns"><button class="modalBtn" onclick="document.querySelector('#mx').click()">Tutup</button></div>`)}});
// 3D friendly voxel character
let scene,camera,renderer,group,drag=false,lastX=0,rot=0;
function buildCharacter(){group=new THREE.Group();const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.78});const box=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=true;group.add(m);return m};
box(1.5,1.5,1.5,0xf1c49b,0,2.9,0);box(1.65,.45,1.7,0x7a4a2a,0,3.65,0);box(1.9,2.1,1.1,0x22b8d8,0,1.55,0);box(.55,1.8,.75,0x22b8d8,-1.2,1.65,0);box(.55,1.8,.75,0x22b8d8,1.2,1.65,0);box(.55,1.7,.75,0x3d4255,-.48,-.25,0);box(.55,1.7,.75,0x3d4255,.48,-.25,0);box(.7,.4,1.05,0xffffff,-.48,-1.25,-.05);box(.7,.4,1.05,0xffffff,.48,-1.25,-.05);box(.18,.18,.12,0x26365c,-.34,3.0,-.76);box(.18,.18,.12,0x26365c,.34,3.0,-.76);box(.7,.18,.1,0xb45c54,0,2.62,-.78);const arm=group;arm.userData.anim=t=>{arm.children.forEach((m,i)=>{if(i===2)m.rotation.z=Math.sin(t*2)*.08})};group.position.y=-.3;scene.add(group)}
function init3D(){const cv=$('#gl');scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(34,1,.1,100);camera.position.set(0,1.7,9);renderer=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;scene.add(new THREE.HemisphereLight(0xdff5ff,0x3d6d40,2.2));const dl=new THREE.DirectionalLight(0xffffff,2.8);dl.position.set(4,8,6);dl.castShadow=true;scene.add(dl);const island=new THREE.Mesh(new THREE.CylinderGeometry(3.1,3.5,.55,6),new THREE.MeshStandardMaterial({color:0x78d24a}));island.position.y=-2.15;island.receiveShadow=true;scene.add(island);const dirt=new THREE.Mesh(new THREE.CylinderGeometry(3.1,3.5,.55,6),new THREE.MeshStandardMaterial({color:0x8a5a3a}));dirt.position.y=-2.55;scene.add(dirt);buildCharacter();cv.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX});window.addEventListener('pointermove',e=>{if(drag){rot+=(e.clientX-lastX)*.012;lastX=e.clientX}});window.addEventListener('pointerup',()=>drag=false);window.addEventListener('resize',fit3D);fit3D();loop()}
