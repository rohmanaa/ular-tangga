<link rel="stylesheet" href="assets/css/base.css"><style>
:root{--bd:#12337f;--g:#3cc23c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html{font-size:min(1vw,1.78vh)}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Baloo 2','Fredoka','Nunito',system-ui,sans-serif;font-weight:800;color:#fff;background:linear-gradient(#4aa6f0,#9fd6fa 55%,#d5f0ff)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;left:50%;top:50%;width:100rem;height:56.25rem;translate:-50% -50%;pointer-events:none}
#ui>*{pointer-events:auto}
.ab{position:absolute}
svg{display:block}
button{font:inherit;color:inherit;border:0;cursor:pointer;padding:0;transition:transform .15s cubic-bezier(.3,1.6,.5,1),filter .15s}
button:hover{transform:scale(1.05);filter:brightness(1.08)}button:active{transform:scale(.94)}button:focus-visible{outline:.3rem solid #fff}
.pn{background:linear-gradient(#45a9ff,#1d66dc);box-shadow:0 .4rem 0 var(--bd),0 .9rem 1.3rem rgba(18,51,127,.35),inset 0 .2rem .2rem rgba(255,255,255,.65),inset 0 0 0 .22rem rgba(150,215,255,.45)}
.tx{text-shadow:0 .18rem 0 var(--bd),0 0 .5rem rgba(18,51,127,.5)}
.dot{position:absolute;right:-.3rem;top:-.4rem;width:1.6rem;height:1.6rem;border-radius:50%;background:radial-gradient(#ff7a6a,#e8261c);border:.2rem solid #fff;box-shadow:0 .1rem .3rem rgba(0,0,0,.4);pointer-events:none}
/* profile */
#prof{left:1.8rem;top:1.3rem;width:25.3rem;height:7.3rem;border-radius:3.7rem;cursor:pointer}
#ava{position:absolute;left:.7rem;top:.55rem;width:6.2rem;height:6.2rem;border-radius:50%;border:.3rem solid #fff;overflow:hidden;background:linear-gradient(#8fd8ff,#3a9ae8);box-shadow:0 .2rem .4rem rgba(0,0,0,.3)}
#ava svg{width:100%;height:100%}
#pname{position:absolute;left:8.9rem;top:.5rem;font-size:2.7rem;line-height:3rem}
#flag{position:absolute;right:2rem;top:1.1rem;width:2.5rem;height:1.9rem;border-radius:.4rem;overflow:hidden;border:.12rem solid #fff;box-shadow:0 .1rem .3rem rgba(0,0,0,.3)}
#crown{position:absolute;left:8.7rem;top:3.5rem;width:2.5rem;height:2.5rem}
#lv{position:absolute;left:11.8rem;top:3.15rem;font-size:2rem;line-height:2rem}
#xp{position:absolute;left:11.8rem;top:5.15rem;width:12.2rem;height:1.55rem;border-radius:1rem;background:#12337f;box-shadow:inset 0 .15rem .25rem rgba(0,0,0,.4);overflow:hidden}
#xp i{display:block;height:100%;border-radius:1rem;background:linear-gradient(#7af0ff,#25bfe8);box-shadow:inset 0 .15rem .15rem rgba(255,255,255,.6)}
#xp span{position:absolute;inset:0;display:grid;place-items:center;font-size:1.15rem;line-height:1}
/* currency */
.cur{top:1.7rem;height:3.8rem;display:flex;align-items:center;justify-content:space-between;padding:0 .5rem 0 4.6rem;border-radius:2rem;background:linear-gradient(#2d62c8,#173c94);box-shadow:0 .35rem 0 #0b2160,0 .9rem 1.2rem rgba(18,51,127,.4),inset 0 .2rem .2rem rgba(255,255,255,.35),inset 0 0 0 .2rem rgba(80,170,255,.7);font-size:2.3rem}
.cur>svg{position:absolute;left:-.4rem;top:50%;translate:0 -50%;width:4.8rem;height:4.8rem;filter:drop-shadow(0 .3rem .3rem rgba(0,0,0,.35))}
.cur span{flex:1;text-align:center;padding-right:.4rem}
.plus{width:2.9rem;height:2.9rem;border-radius:50%;background:radial-gradient(#7af07a,#2cb02c);border:.2rem solid #1c7d1c;display:grid;place-items:center}.plus svg{width:1.8rem;height:1.8rem}
#gem{right:26rem;width:12.3rem}#coin{right:11.8rem;width:13rem}
.sm{top:1.6rem;width:3.9rem;height:3.9rem;border-radius:1.2rem;display:grid;place-items:center}.sm svg{width:2.4rem;height:2.4rem}
#mail{right:6.6rem}#gear{right:1.6rem}
/* event */
#event{right:1.8rem;top:7.7rem;width:23.4rem;height:6.7rem;border-radius:1.8rem;text-align:left;padding:0 3rem 0 9.4rem;background:linear-gradient(100deg,#2f60dc,#5a34c8 70%,#7a3ee0);box-shadow:0 0 0 .3rem #ffd24d,0 .45rem 0 #b9740c,0 0 1.8rem rgba(255,210,77,.6),inset 0 .2rem .3rem rgba(255,255,255,.4);overflow:visible}
#event>svg.gf{position:absolute;left:.4rem;top:-1.6rem;width:8.6rem;height:8.6rem;filter:drop-shadow(0 .4rem .3rem rgba(0,0,0,.35))}
#event b{display:block;font-size:2.1rem;line-height:2.3rem;margin-top:.9rem}
#event small{display:block;font-size:1.12rem;line-height:1.25rem;color:#e8f2ff;font-weight:700;margin-top:.15rem;white-space:normal}
#event .ch{position:absolute;right:.8rem;top:50%;translate:0 -50%;width:1.8rem;height:2.6rem}
/* menu */
.mn{left:1.8rem;width:15.9rem;height:5rem;border-radius:1.7rem;display:flex;align-items:center;justify-content:center;font-size:2.3rem;padding-left:3.4rem}
.mn>svg{position:absolute;left:1rem;top:50%;translate:0 -50%;width:4rem;height:4rem;filter:drop-shadow(0 .2rem .2rem rgba(0,0,0,.3))}
.sq{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;border-radius:1.9rem;font-size:2rem;line-height:1}
.sq>svg{width:4.6rem;height:4.6rem;filter:drop-shadow(0 .2rem .2rem rgba(0,0,0,.3))}
/* play */
#play{left:34.2rem;top:43.4rem;width:31.5rem;height:9.3rem;border-radius:4.7rem;display:flex;align-items:center;justify-content:center;gap:1.4rem;background:linear-gradient(#ffe85e,#ffb81c 70%,#ffa514);box-shadow:0 .6rem 0 #b8700a,0 1rem 1.8rem rgba(120,60,0,.4),inset 0 .3rem .3rem rgba(255,255,255,.8),inset 0 0 0 .3rem #ffe9a0;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 .6rem 0 #b8700a,0 0 2.8rem rgba(255,230,90,.95),inset 0 .3rem .3rem rgba(255,255,255,.8),inset 0 0 0 .3rem #ffe9a0}}
#play:hover,#play:active{animation:none}
#play .gp{width:7.4rem;height:5.6rem;filter:drop-shadow(0 .3rem .2rem rgba(120,60,0,.4))}
#pt{text-align:center;color:#fff}
#pt b{display:block;font-size:4.7rem;line-height:4.4rem;-webkit-text-stroke:.35rem #c8610d;paint-order:stroke fill;text-shadow:0 .3rem 0 #c8610d}
#pt small{display:block;font-size:2rem;line-height:2rem;margin-top:.1rem;-webkit-text-stroke:.22rem #c8610d;paint-order:stroke fill;text-shadow:0 .15rem 0 #c8610d}
.pa{position:absolute;top:50%;translate:0 -50%;width:3.6rem;height:5rem;display:grid;place-items:center;background:none}
.pa svg{width:2.8rem;height:3.6rem;filter:drop-shadow(0 .15rem 0 #c8610d)}#pl{left:.6rem}#pr{right:.6rem}
/* free gift */
#free{right:2.4rem;top:47.6rem;width:13.9rem;height:4.4rem;border-radius:1.5rem;display:flex;align-items:center;gap:.5rem;padding:0 .6rem;text-align:left;background:linear-gradient(#1b4fb8,#0f2f85);box-shadow:0 .3rem 0 #081c58,inset 0 .15rem .2rem rgba(255,255,255,.3),inset 0 0 0 .18rem rgba(70,150,255,.6)}
#free>svg{width:4.4rem;height:4.4rem;flex:none;margin-top:-.4rem;filter:drop-shadow(0 .2rem .2rem rgba(0,0,0,.35))}
#free b{display:block;color:#ffd24d;font-size:1.5rem;line-height:1.5rem}
#free span{display:flex;align-items:center;gap:.4rem;font-size:1.65rem;line-height:1.8rem}#free span svg{width:1.4rem;height:1.4rem}
/* modal */
.ov{position:fixed;inset:0;display:none;place-items:center;background:rgba(18,51,127,.4);backdrop-filter:blur(6px);z-index:50;opacity:0;transition:opacity .25s}
.ov.show{opacity:1}.ov>.box{transform:scale(.85);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}.ov.show>.box{transform:scale(1)}
.box{position:relative;width:min(48rem,92vw);max-height:92vh;overflow:auto;background:linear-gradient(#7cc2ff,#4a9ae8);border-radius:2.4rem;padding:3rem 2.4rem 2.4rem;box-shadow:0 1rem 0 var(--bd),0 2rem 3rem rgba(0,0,0,.3);font-size:2.4rem;text-align:center}
.box h2{margin:0 0 1.2rem;font-size:3.4rem;text-shadow:0 .2rem 0 var(--bd)}.box p{margin:.4rem 0 1rem}
.x{position:absolute;right:-1rem;top:-1rem;width:4.6rem;height:4.6rem;border-radius:50%;background:#ee4a4a;box-shadow:0 .3rem 0 #8e1d1d;font-size:2.4rem}
.row{display:flex;justify-content:space-between;align-items:center;background:rgba(18,51,127,.25);border-radius:1.4rem;padding:1rem 1.4rem;margin:.8rem 0;gap:1rem}
.mode{width:100%;display:flex;align-items:center;justify-content:space-between;margin:.8rem 0;padding:1.2rem 1.6rem;border-radius:1.4rem;background:linear-gradient(#ffd24d,#ff9a1f);box-shadow:0 .4rem 0 #c96a0c;font-size:2.4rem;text-shadow:0 .2rem 0 rgba(107,53,17,.7)}
.mode small{font-size:1.4rem;font-weight:700;text-shadow:none;color:#fff3c8}
.tg{min-width:7.6rem;height:3.8rem;border-radius:2rem;background:#7b8aa8;box-shadow:inset 0 .2rem .4rem rgba(0,0,0,.3);font-size:2rem;padding:0 1rem}.tg.on{background:var(--g)}
#toast{position:fixed;left:50%;bottom:3rem;translate:-50% 2rem;background:var(--bd);padding:.8rem 2.4rem;border-radius:2rem;font-size:2.4rem;opacity:0;transition:opacity .3s,translate .35s cubic-bezier(.3,1.8,.5,1);z-index:99;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;translate:-50% 0}
#rot{position:fixed;inset:0;display:none;place-items:center;text-align:center;background:linear-gradient(#4aa6f0,#bfe6ff);z-index:200;font-size:6vw;padding:2rem}
@media(max-aspect-ratio:1/1){#rot{display:grid}}
@media(prefers-reduced-motion:reduce){#play{animation:none}}
</style></head>
