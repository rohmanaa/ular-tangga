<html lang="id"><head><script src="assets/js/boot-guard.js"></script><meta charset="utf-8">

<title>Lobby</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css"><style>
:root{--bd:#12337f;--g:#3cc23c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html{font-size:min(1vw,1.78vh)}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Baloo 2','Fredoka','Nunito',system-ui,sans-serif;font-weight:800;color:#fff;background:linear-gradient(#3d9bfd,#6fbdfc 50%,#bfe4ff 85%,#d8f0ff)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;left:0;top:50%;width:100vw;height:56.25rem;translate:0 -50%;pointer-events:none}
#ui>*{pointer-events:auto}
.ab{position:absolute}
svg{display:block}
button{font:inherit;color:inherit;border:0;cursor:pointer;padding:0;transition:transform .15s cubic-bezier(.3,1.6,.5,1),filter .15s}
button:hover{transform:scale(1.05);filter:brightness(1.08)}button:active{transform:scale(.94)}button:focus-visible{outline:.3rem solid #fff}
.pn{background:linear-gradient(#2b78ea,#1550c2);box-shadow:0 .35rem 0 #0b2468,0 .8rem 1.2rem rgba(10,30,90,.4),inset 0 .15rem .2rem rgba(255,255,255,.55),inset 0 0 0 .2rem rgba(140,205,255,.5)}
.tx{text-shadow:0 .18rem 0 var(--bd),0 0 .5rem rgba(18,51,127,.5)}
.dot{position:absolute;right:-.6rem;top:-.7rem;min-width:2.7rem;height:2.7rem;padding:0 .5rem;border-radius:1.4rem;display:grid;place-items:center;font-style:normal;font-size:1.6rem;line-height:1;background:radial-gradient(#ff7a6a,#e8261c);border:.2rem solid #fff;box-shadow:0 .1rem .3rem rgba(0,0,0,.4);pointer-events:none;z-index:2}
.dot:empty{min-width:1.7rem;width:1.7rem;height:1.7rem;padding:0;right:-.3rem;top:-.4rem}
/* profile */
#prof{left:1.7rem;top:1.5rem;width:26rem;height:9rem;border-radius:1.7rem;cursor:pointer;background:linear-gradient(#1f5cc9,#0d3088)}
#ava{position:absolute;left:1.3rem;top:1.3rem;width:6.4rem;height:6.4rem;border-radius:.9rem;border:.28rem solid #fff;overflow:hidden;background:linear-gradient(#8fd8ff,#3a9ae8);box-shadow:0 .2rem .4rem rgba(0,0,0,.35)}
#ava svg{width:100%;height:100%}
#nrow{position:absolute;left:9.2rem;top:.7rem;display:flex;align-items:center;gap:1rem}
#pname{font-size:2.7rem;line-height:3.2rem}
#flag{width:2.5rem;height:1.75rem;border-radius:.3rem;overflow:hidden;border:.1rem solid #fff;box-shadow:0 .1rem .3rem rgba(0,0,0,.3)}
#crown{position:absolute;left:9.1rem;top:4.15rem;width:2.4rem;height:2.4rem}
#lv{position:absolute;left:11.9rem;top:4.1rem;font-size:2rem;line-height:2.4rem}
#xp{position:absolute;left:9.2rem;top:6.65rem;width:15.7rem;height:1.55rem;border-radius:1rem;background:#0a2160;box-shadow:inset 0 .15rem .25rem rgba(0,0,0,.45),0 0 0 .12rem rgba(150,215,255,.35);overflow:hidden}
#xp i{display:block;height:100%;border-radius:1rem;background:linear-gradient(#7af0ff,#25bfe8);box-shadow:inset 0 .15rem .15rem rgba(255,255,255,.6)}
#xp span{position:absolute;inset:0;display:grid;place-items:center;font-size:1.15rem;line-height:1;text-shadow:0 .1rem 0 rgba(10,33,96,.8)}
/* currency */
.sm{top:1.9rem;width:4.3rem;height:4.3rem;border-radius:1.3rem;display:grid;place-items:center}.sm svg{width:2.6rem;height:2.6rem}
#mail{right:6.7rem}#gear{right:1.7rem}
/* event carousel */
#event{right:1rem;top:8.4rem;width:35rem;height:24.2rem;border-radius:1.9rem;cursor:pointer;overflow:hidden;text-align:left;transition:filter .15s;
 background:radial-gradient(circle at 78% 42%,rgba(150,100,255,.65),transparent 55%),radial-gradient(circle at 12% 100%,rgba(70,40,170,.8),transparent 60%),linear-gradient(135deg,#2a1470,#4a22ae 60%,#5f2cc8);
 box-shadow:0 0 0 .25rem #cfeaff,0 0 0 .55rem rgba(120,190,255,.45),0 .7rem 1.6rem rgba(5,20,80,.45),0 0 2rem rgba(140,100,255,.5)}
#event:hover{filter:brightness(1.07)}
#evbg{position:absolute;inset:0;background:var(--bg,none) center/cover no-repeat}
#evd{position:absolute;left:0;right:0;bottom:.5rem;display:flex;justify-content:center}
.dt{width:2rem;height:2rem;display:grid;place-items:center;cursor:pointer}
.dt::before{content:"";width:1rem;height:1rem;border-radius:50%;background:rgba(255,255,255,.6);box-shadow:0 .1rem .3rem rgba(0,0,0,.6);transition:all .25s}
.dt.on::before{background:#ffd23a;width:1.5rem}
#evn{position:absolute;right:.4rem;top:50%;translate:0 -50%;width:3.4rem;height:5rem;display:grid;place-items:center;cursor:pointer}
#evn svg{width:1.9rem;height:3rem;filter:drop-shadow(0 .1rem .25rem rgba(0,0,0,.7))}
#event.one #evn,#event.one #evd{display:none}
.box:has(.mimg){padding:.8rem;width:min(70rem,92vw)}
.mimg{display:block;width:100%;max-height:80vh;object-fit:contain;border-radius:1.6rem}
/* toko */
#toko{right:1rem;top:35.6rem;width:35rem;height:7.8rem;border-radius:1.8rem;display:flex;align-items:center;gap:1.4rem;padding:0 1.6rem;text-align:left;
 background:linear-gradient(#ffb82e,#f58a12);box-shadow:0 .4rem 0 #a85a08,0 .9rem 1.3rem rgba(120,60,0,.35),inset 0 .2rem .3rem rgba(255,255,255,.65),inset 0 0 0 .2rem #ffd98a}
#toko>svg.ct{width:5.6rem;height:5.6rem;flex:none;filter:drop-shadow(0 .2rem 0 #a85a08)}
#toko .tt b{display:block;font-size:3.6rem;line-height:3.6rem;-webkit-text-stroke:.3rem #a85a08;paint-order:stroke fill;text-shadow:0 .25rem 0 #a85a08}
#toko .tt small{display:block;font-size:1.35rem;line-height:1.6rem;font-weight:700;text-shadow:0 .12rem 0 #a85a08;white-space:nowrap}
#toko>svg.ch2{position:absolute;right:1rem;top:-1.5rem;width:11.5rem;height:9.2rem;filter:drop-shadow(0 .4rem .3rem rgba(90,40,0,.4))}
.nw{position:absolute;right:.7rem;top:-.9rem;background:linear-gradient(#ff5a4a,#d9261c);border:.18rem solid #fff;border-radius:1rem;padding:0 .9rem;font-size:1.4rem;line-height:2rem;box-shadow:0 .2rem .3rem rgba(0,0,0,.35);pointer-events:none}
/* kartu teman / hadiah */
.cd{top:44.4rem;height:9.1rem;border-radius:1.7rem;display:flex;align-items:center;gap:.8rem;padding:0 1.1rem;text-align:left}
.cd>svg{width:5rem;height:5rem;flex:none;filter:drop-shadow(0 .2rem .2rem rgba(0,0,0,.35))}
.cd b{display:block;font-size:2.5rem;line-height:2.6rem}
.cd small{display:flex;align-items:center;gap:.5rem;font-size:1.3rem;line-height:1.6rem;font-weight:700;white-space:nowrap;text-shadow:0 .1rem 0 rgba(10,30,90,.6)}
#teman{right:19.8rem;width:16.1rem}
#hadc{right:1rem;width:18.1rem;background:linear-gradient(#9a5cf0,#5d2cc4);box-shadow:0 .4rem 0 #30136e,0 .8rem 1.2rem rgba(30,10,90,.4),inset 0 .15rem .2rem rgba(255,255,255,.5),inset 0 0 0 .2rem rgba(210,180,255,.5)}
.on-d{width:1.1rem;height:1.1rem;border-radius:50%;background:#3cd23c;box-shadow:0 0 .5rem #3cd23c;flex:none}
/* menu kiri */
.sq{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;border-radius:1.8rem;line-height:1;white-space:nowrap}
.sq>svg{width:4.6rem;height:4.6rem;filter:drop-shadow(0 .2rem .2rem rgba(0,0,0,.3))}
.lm{left:1.7rem;width:8.8rem;height:8.1rem;font-size:1.4rem}
.bm{top:44.6rem;width:8.8rem;height:8.9rem;font-size:2rem}.bm>svg{width:5rem;height:5rem}
/* play */
#play{left:44.5%;margin-left:-14.6rem;top:43.7rem;width:29.2rem;height:10rem;border-radius:5rem;display:flex;align-items:center;justify-content:center;gap:1.4rem;padding-right:3rem;background:linear-gradient(#ffe85e,#ffb81c 70%,#ffa514);box-shadow:0 .6rem 0 #b8700a,0 1rem 1.8rem rgba(120,60,0,.4),inset 0 .3rem .3rem rgba(255,255,255,.8),inset 0 0 0 .3rem #ffe9a0;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 .6rem 0 #b8700a,0 0 2.8rem rgba(255,230,90,.95),inset 0 .3rem .3rem rgba(255,255,255,.8),inset 0 0 0 .3rem #ffe9a0}}
#play:hover,#play:active{animation:none}
#play .gp{width:7.2rem;height:5.4rem;flex:none;filter:drop-shadow(0 .3rem .2rem rgba(120,60,0,.4))}
#pt{text-align:left;color:#fff}
#pt b{display:block;font-size:4.7rem;line-height:4.4rem;-webkit-text-stroke:.35rem #c8610d;paint-order:stroke fill;text-shadow:0 .3rem 0 #c8610d}
#pt small{display:block;font-size:1.8rem;line-height:2rem;margin-top:.1rem;white-space:nowrap;-webkit-text-stroke:.22rem #c8610d;paint-order:stroke fill;text-shadow:0 .15rem 0 #c8610d}
.pa{position:absolute;top:50%;translate:0 -50%;width:3.6rem;height:5rem;display:grid;place-items:center;background:none}
.pa svg{width:2.4rem;height:3.4rem;filter:drop-shadow(0 .15rem 0 #c8610d)}#pr{right:1.4rem}
/* animasi masuk */
#ui>:not(.ut-curbar){animation:in .55s cubic-bezier(.2,1.2,.4,1) backwards}
@keyframes in{from{opacity:0;transform:translateY(1.4rem) scale(.96)}}
/* modal */
.ov{position:fixed;inset:0;display:none;place-items:center;background:rgba(18,51,127,.4);backdrop-filter:blur(6px);z-index:50;opacity:0;transition:opacity .25s}
.ov.show{opacity:1}.ov>.box{transform:scale(.85);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}.ov.show>.box{transform:scale(1)}
.box{position:relative;width:min(48rem,92vw);max-height:92vh;overflow:auto;background:linear-gradient(#7cc2ff,#4a9ae8);border-radius:2.4rem;padding:3rem 2.4rem 2.4rem;box-shadow:0 1rem 0 var(--bd),0 2rem 3rem rgba(0,0,0,.3);font-size:2.4rem;text-align:center}
.box h2{margin:0 0 1.2rem;font-size:3.4rem;text-shadow:0 .2rem 0 var(--bd)}.box p{margin:.4rem 0 1rem}
.x{position:absolute;right:.8rem;top:.8rem;width:4.6rem;height:4.6rem;border-radius:50%;background:#ee4a4a;box-shadow:0 .3rem 0 #8e1d1d;font-size:2.4rem}
.row{display:flex;justify-content:space-between;align-items:center;background:rgba(18,51,127,.25);border-radius:1.4rem;padding:1rem 1.4rem;margin:.8rem 0;gap:1rem}
.mode{width:100%;display:flex;align-items:center;justify-content:space-between;margin:.8rem 0;padding:1.2rem 1.6rem;border-radius:1.4rem;background:linear-gradient(#ffd24d,#ff9a1f);box-shadow:0 .4rem 0 #c96a0c;font-size:2.4rem;text-shadow:0 .2rem 0 rgba(107,53,17,.7)}
.mode small{font-size:1.4rem;font-weight:700;text-shadow:none;color:#fff3c8}
.tg{min-width:7.6rem;height:3.8rem;border-radius:2rem;background:#7b8aa8;box-shadow:inset 0 .2rem .4rem rgba(0,0,0,.3);font-size:2rem;padding:0 1rem}.tg.on{background:var(--g)}
#toast{position:fixed;left:50%;bottom:3rem;translate:-50% 2rem;background:var(--bd);padding:.8rem 2.4rem;border-radius:2rem;font-size:2.4rem;opacity:0;transition:opacity .3s,translate .35s cubic-bezier(.3,1.8,.5,1);z-index:99;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;translate:-50% 0}
#rot{position:fixed;inset:0;display:none;place-items:center;text-align:center;background:linear-gradient(#4aa6f0,#bfe6ff);z-index:200;font-size:6vw;padding:2rem}
@media(max-aspect-ratio:1/1){#rot{display:grid}}
@media(prefers-reduced-motion:reduce){#play,#ui>*{animation:none!important}}

<script>UT.App.init({page:'lobby'});</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s),fmt=n=>n.toLocaleString('id-ID');
/* ---------- data: currency, skin terpasang, dan settings dibaca dari PlayerData (single source of truth).
   Tidak ada state kedua; key legacy 'inv' tidak dibaca/ditulis lagi oleh halaman ini. ---------- */
const PD=window.PlayerData,AR=window.ItemArt;
let PAL=AR.palette(PD.equippedId('skin'))||AR.palette('skin.steve');
let hero3d=null; /* diisi bagian 3D bila WebGL tersedia */
const SET=()=>PD.settings();
const buzz=()=>{if(SET().vibration&&navigator.vibrate)navigator.vibrate(15)};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1700)}
/* ---------- HUD ---------- */
function renderAvatar(){$('#ava').innerHTML=`<svg viewBox="0 0 40 40"><rect x="7" y="29" width="26" height="12" rx="2" fill="${PAL.hood}"/><rect x="10" y="9" width="20" height="19" fill="#f0b98d"/><rect x="8" y="4" width="24" height="9" fill="${PAL.hair}"/><rect x="8" y="9" width="3" height="10" fill="${PAL.hair}"/><rect x="29" y="9" width="3" height="10" fill="${PAL.hair}"/><rect x="14" y="17" width="3.5" height="4.5" fill="#222"/><rect x="23" y="17" width="3.5" height="4.5" fill="#222"/><path d="M15 23q5 5 10 0z" fill="#c0473a"/></svg>`}
function renderCurrency(){$('#gemV').textContent=fmt(PD.gems());$('#coinV').textContent=fmt(PD.coins())}
renderAvatar();renderCurrency();
document.querySelectorAll('#ui>:not(.ut-curbar)').forEach((e,i)=>e.style.animationDelay=(i*.045)+'s');
/* event: UI ikut berubah tanpa reload halaman */
UT.Events.on('currencyChanged',renderCurrency);
UT.Events.on('skinChanged',()=>{PAL=AR.palette(PD.equippedId('skin'))||PAL;renderAvatar();if(hero3d)hero3d.rebuild()});
/* ---------- modal ---------- */
const modal=$('#modal');let mOpen=false;
function openModal(html,init){$('#mb').innerHTML=html;modal.style.display='grid';requestAnimationFrame(()=>modal.classList.add('show'));mOpen=true;init&&init();$('#mx').focus()}
function closeModal(){if(!mOpen)return;mOpen=false;modal.classList.remove('show');setTimeout(()=>{if(!mOpen)modal.style.display='none'},250)}
$('#mx').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
/* ---------- game modes ---------- */
const MODES=[['Ular Tangga Blok','Main sendiri atau lawan bot'],['Lawan Teman','Main bareng di satu perangkat'],['Online','Cari lawan secara acak']];
let mi=-1;
const setMode=i=>{mi=i;$('#pm').textContent=i<0?'Pilih Mode':MODES[i][0]};
$('#pr').addEventListener('click',e=>{e.stopPropagation();setMode(mi>=MODES.length-1?-1:mi+1);buzz()});
function startMode(i){closeModal();setMode(i);buzz();location.href='mode.html'}
$('#play').addEventListener('click',()=>{buzz();location.href='mode.html'});
/* ---------- event: gambar saja; klik membuka modal (gambar sendiri per event) ----------
   img   = gambar kartu di lobby
   modal = gambar yang tampil di modal saat kartu diklik (kosong = pakai img)
   url   = (opsional) kalau diisi, klik langsung pindah halaman, bukan modal */
const EVENTS=[
 {img:'promosi/placeholder.jpg',modal:'promosi/placeholder.jpg'}
 /* tambah event: ,{img:'promosi/event2.jpg',modal:'promosi/event2_detail.jpg'} */
];
let si=0;const ev=$('#event'),dts=$('#evd');
ev.classList.toggle('one',EVENTS.length<2);
dts.innerHTML=EVENTS.map((_,i)=>`<span class="dt" data-i="${i}" role="button" aria-label="Event ${i+1}"></span>`).join('');
function renderEvent(){$('#evbg').style.setProperty('--bg',`url("${EVENTS[si].img}")`);dts.querySelectorAll('.dt').forEach((d,i)=>d.classList.toggle('on',i===si))}
const goEv=i=>{si=(i+EVENTS.length)%EVENTS.length;renderEvent();clearInterval(goEv.t);if(EVENTS.length>1)goEv.t=setInterval(()=>{if(!mOpen)goEv(si+1)},6000)};
$('#evn').addEventListener('click',e=>{e.stopPropagation();buzz();goEv(si+1)});
dts.addEventListener('click',e=>{const d=e.target.closest('.dt');if(d){e.stopPropagation();goEv(+d.dataset.i)}});
goEv(0);
/* ---------- actions ---------- */
const soon=n=>toast(n+' segera hadir');
const ACT={
 inv(){location.href='inventory.html'},
 lead(){location.href='leaderboard.html'},prof(){location.href='profile.html'},misi(){soon('Misi')},hadiah(){location.href='dailyreward.html'},toko(){location.href='shop.html'},teman(){location.href='friendship.html'},mail(){soon('Pesan')},
 event(){const e=EVENTS[si];if(e.url){location.href=e.url;return}openModal(`<img class="mimg" src="${e.modal||e.img}" alt="Event">`)},
 free(){soon('Hadiah gratis')},buygem(){soon('Beli gem')},buycoin(){soon('Beli coin')},
 gear(){const T=SET(),row=(k,l)=>`<div class="row"><span>${l}</span><button class="tg ${T[k]?'on':''}" data-k="${k}">${T[k]?'ON':'OFF'}</button></div>`;
  openModal(`<h2>Pengaturan</h2>${row('music','Musik')}${row('sound','Suara')}${row('vibration','Getar')}`,()=>document.querySelectorAll('.tg').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.k,v=!SET()[k];const n=PD.setSettings({[k]:v});b.classList.toggle('on',n[k]);b.textContent=n[k]?'ON':'OFF';buzz()})))}
};
document.querySelectorAll('[data-act]').forEach(b=>{const f=()=>{buzz();ACT[b.dataset.act]()};b.addEventListener('click',f);if(b.getAttribute('role')==='button')b.addEventListener('keydown',e=>{if(e.key==='Enter')f()})});

/* ================= 3D LOBBY ================= */
if(typeof THREE==='undefined'){document.body.insertAdjacentHTML('afterbegin','<div style="position:fixed;inset:0;display:grid;place-items:center;font-size:3rem;z-index:0">3D tidak tersedia</div>');return}
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const V=[];
const col=(h,j)=>{const c=new THREE.Color(h);return c.multiplyScalar(1+(rnd()-.5)*2*j)};
const B=(x,y,z,c,sx=1,sy=1,sz=1,j=.07)=>V.push([x,y,z,sx,sy,sz,col(c,j)]);
const GR=[0x2f7d24,0x2a741f],DIRT=0x7a4d2c,STN=[0x6c6e7c,0x7a7c8a,0x5e606c];
function isle(cx,cy,cz,rx,rz,depth,grass,stoneFn){const R=Math.ceil(Math.max(rx,rz));
 for(let ix=-Math.ceil(rx);ix<=Math.ceil(rx);ix++)for(let iz=-Math.ceil(rz);iz<=Math.ceil(rz);iz++)for(let d=0;d<depth;d++){
  const k=1-d/(depth+1.5),nx=ix/(rx*k),nz=iz/(rz*k);if(nx*nx+nz*nz+(rnd()-.5)*.25>1)continue;
  const c=d===0?(stoneFn&&stoneFn(cx+ix,cz+iz)?STN[Math.abs(ix*7+iz*3)%3]:GR[(ix+iz)&1]):d===1?DIRT:rnd()<.25?0x7b7b86:0x6e4628;B(cx+ix,cy-.5-d,cz+iz,c)}}
function tree(x,gy,z,h=3,w=1){for(let i=0;i<h;i++)B(x,gy+.5+i,z,0x7a4b2a);const t=gy+h;
 for(let dx=-w;dx<=w;dx++)for(let dz=-w;dz<=w;dz++)for(let dy=0;dy<2;dy++){if(Math.abs(dx)+Math.abs(dz)===2*w&&rnd()<.6)continue;B(x+dx,t+.5+dy,z+dz,rnd()<.5?0x3aa83a:0x2f9a34)}
 B(x,t+2.5,z,0x45b840);B(x+1,t+2.5,z,0x45b840,1,1,1);}
function bush(x,gy,z){B(x,gy+.5,z,0x2c8a2c);if(rnd()<.6)B(x+1,gy+.5,z,0x257a28);if(rnd()<.5)B(x,gy+1.5,z,0x34993a)}
function flower(x,gy,z){const c=[0xff7ab8,0xffffff,0xffe05a,0xc78bff][rnd()*4|0];B(x,gy+.2,z,0x2f9a34,.15,.4,.15,0);B(x,gy+.5,z,c,.45,.3,.45,0)}
function character(sk,emote){const g=new THREE.Group(),P={};const skin=M(0xf0b98d),hood=M(sk.hood),hair=M(sk.hair),pants=M(sk.pants),wh=M(0xffffff),bl=M(0x2f6fd0),pk=M(0x7a4a2a),dk=M(0x221a18);
 const body=new THREE.Group();body.position.y=2.6;g.add(body);P.body=body;
 bx(1.7,1.9,1,hood,0,0,0,body);bx(.9,1.1,.1,wh,0,-.1,.52,body);bx(1.1,1.4,.5,pk,0,0,-.75,body);
 const head=new THREE.Group();head.position.y=2.1;body.add(head);P.head=head;
 bx(2.2,2.1,2.1,skin,0,0,0,head);bx(2.4,.8,2.3,hair,0,1.15,-.05,head);bx(2.4,1.8,.5,hair,0,.2,-1,head);bx(.4,1.2,2.1,hair,-1.2,.4,0,head);bx(.4,1.2,2.1,hair,1.2,.4,0,head);bx(2.2,.5,.5,hair,0,.8,1.05,head);
 P.eyes=[-.55,.55].map(x=>{const e=new THREE.Group();e.position.set(x,.05,1.06);head.add(e);bx(.42,.55,.1,dk,0,0,0,e);bx(.14,.16,.1,wh,.08,.12,.06,e);return e});
 bx(.7,.15,.1,M(0xc0473a),0,-.6,1.06,head);
 const arm=x=>{const a=new THREE.Group();a.position.set(x,.8,0);body.add(a);bx(.7,1.5,.7,hood,0,-.6,0,a);bx(.6,.5,.6,skin,0,-1.5,0,a);return a};
 P.aL=arm(-1.2);P.aR=arm(1.2);
 const leg=x=>{const l=new THREE.Group();l.position.set(x,-1,0);body.add(l);bx(.8,1.4,.9,pants,0,-.6,0,l);bx(1,.5,1.3,wh,0,-1.45,.15,l);bx(1.02,.18,1.32,bl,0,-1.2,.15,l);return l};
 P.lL=leg(-.45);P.lR=leg(.45);
 g.userData.anim=t=>{const k=emote||'idle';P.body.position.y=2.6+Math.sin(t*2)*.05;P.body.scale.y=1+Math.sin(t*2)*.012;P.head.rotation.set(0,Math.sin(t*.7)*.12,Math.sin(t*.9)*.03);
  P.aL.rotation.z=-.15;P.aR.rotation.z=k==='cheer'?2.5+Math.sin(t*12)*.35:.15-Math.sin(t*2)*.05;if(k==='cheer')g.position.y=Math.abs(Math.sin(t*6))*.5;
  P.eyes.forEach(e=>e.scale.y=(t%4<.15)?.1:1)};
 return g}
function bx(w,h,d,m,x=0,y=0,z=0,p){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;p&&p.add(o);return o}
function M(c,r=.7){return new THREE.MeshStandardMaterial({color:new THREE.Color(c),roughness:r})}

/* scene */
const cv=$('#gl'),renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0xc8e8ff,45,135);
const cam=new THREE.PerspectiveCamera(36,16/9,.1,250);
scene.add(new THREE.AmbientLight(0xffffff,.5),new THREE.HemisphereLight(0xcfeaff,0x6a9a50,.4));
const sun=new THREE.DirectionalLight(0xfff2d8,.8);sun.position.set(9,18,14);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-24,right:24,top:16,bottom:-14,near:1,far:60});sun.shadow.bias=-.0008;scene.add(sun);
const anims=[];

// pulau utama: rumput gelap + motif batu
const GY=-2;
const stoneAt=(x,z)=>{const r=Math.hypot(x,z);if(r<=4.4)return false;
 if(r<8.4&&rnd()<.5)return true;
 if(z>5&&Math.abs(x)<2.6&&rnd()<.8)return true;
 return Math.sin(x*.8)+Math.cos(z*1.1)+Math.sin((x+z)*.45)>2.15};
isle(0,GY,2,22,9,6,0,stoneAt);
// pedestal batu
for(let x=-5;x<=5;x++)for(let z=-5;z<=5;z++){const r=Math.hypot(x,z);
 if(r<=3.9)B(x,-1.5,z,((x+z)&1)?0x5f6274:0x525568,1,1,1,.06);
 if(r<=4.4)B(x,-.5,z,r<=3.4?((x+z)&1?0x8a8d9d:0x7a7d8e):GR[(x+z)&1],1,1,1,.05)}
// rumput kecil & batu kecil
const tuft=(x,z)=>{B(x,GY+.5,z,0x25761f,.5,1,.5);B(x+.6,GY+.5,z+.2,0x1f6a1c,.5,1.7,.5);B(x-.5,GY+.5,z+.3,0x2c8626,.5,1.3,.5)};
const rock=(x,z)=>{B(x,GY+.4,z,0x73758a,1,.8,1);if(rnd()<.6)B(x+.9,GY+.3,z+.3,0x62647a,.7,.6,.7)};
[[-6,0],[6.5,-.5],[-9,4],[9.5,3],[-13,1],[14,2],[-4.5,6],[5,7],[-16,5],[17,6]].forEach(p=>tuft(p[0],p[1]));
[[-7.5,3],[8,5],[-11,-1],[12,0],[-3,8],[3.5,9.5]].forEach(p=>rock(p[0],p[1]));
// siluet balok biru pucat di kejauhan + kabut tipis
const farM=new THREE.MeshBasicMaterial({color:0x74bdf8,transparent:true,opacity:.5,fog:false,depthWrite:false});
[[-72,-20,14,34],[-58,-14,12,24],[-46,-22,10,18],[-86,-12,16,30],[44,-22,10,22],[56,-14,14,32],[70,-18,12,26],[84,-10,16,36]].forEach(b=>{const m=new THREE.Mesh(new THREE.BoxGeometry(b[2],b[3],8),farM);m.position.set(b[0],b[1]+b[3]/2-14,-80);scene.add(m)});
const hc=document.createElement('canvas');hc.width=4;hc.height=128;{const c=hc.getContext('2d'),g=c.createLinearGradient(0,0,0,128);g.addColorStop(0,'rgba(215,240,255,0)');g.addColorStop(1,'rgba(215,240,255,.95)');c.fillStyle=g;c.fillRect(0,0,4,128)}
const haze=new THREE.Mesh(new THREE.PlaneGeometry(400,44),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(hc),transparent:true,fog:false,depthWrite:false}));haze.position.set(0,-14,-60);scene.add(haze);
// awan voxel
const clouds=[];const cm=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x9cc8ff,emissiveIntensity:.35,roughness:1,transparent:true,opacity:.96,fog:false});
for(let i=0;i<7;i++){const g=new THREE.Group(),n=3+(rnd()*3|0);for(let k=0;k<n;k++){const m=new THREE.Mesh(new THREE.BoxGeometry(3+rnd()*3,1.6+rnd(),2.5+rnd()*2),cm);m.position.set(k*2.6-n,rnd()*.9,rnd()*1.5);g.add(m)}
 g.position.set(-55+rnd()*110,8+rnd()*16,-30-rnd()*14);g.userData.v=.2+rnd()*.3;scene.add(g);clouds.push(g)}
// pedestal glow
const ring=new THREE.Mesh(new THREE.RingGeometry(2.1,2.7,48),new THREE.MeshBasicMaterial({color:0x57dfff,transparent:true,opacity:.95,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.03;scene.add(ring);
const disc=new THREE.Mesh(new THREE.CircleGeometry(2.1,48),new THREE.MeshBasicMaterial({color:0xaaf0ff,transparent:true,opacity:.35}));disc.rotation.x=-Math.PI/2;disc.position.y=.025;scene.add(disc);
// voxel mesh
const mesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({roughness:.85}),V.length);
{const m=new THREE.Matrix4(),q=new THREE.Quaternion(),p=new THREE.Vector3(),s=new THREE.Vector3();V.forEach((v,i)=>{m.compose(p.set(v[0],v[1],v[2]),q,s.set(v[3],v[4],v[5]));mesh.setMatrixAt(i,m);mesh.setColorAt(i,v[6])});mesh.instanceMatrix.needsUpdate=true;mesh.instanceColor.needsUpdate=true}
mesh.castShadow=mesh.receiveShadow=true;mesh.frustumCulled=false;scene.add(mesh);
// hero character (palet dari ItemArt.palette skin terpasang di PlayerData)
const hero=new THREE.Group();let chI=character(PAL,'idle'),chC=character(PAL,'cheer');chC.visible=false;hero.add(chI,chC);hero.position.set(.3,0,0);scene.add(hero);
hero3d={rebuild(){const p=AR.palette(PD.equippedId('skin'))||AR.palette('skin.steve');hero.remove(chI);hero.remove(chC);chI=character(p,'idle');chC=character(p,'cheer');chC.visible=false;hero.add(chI,chC)}};
let cheer=0;
cv.addEventListener('pointerdown',e=>{const x=e.clientX/innerWidth,y=e.clientY/innerHeight;if(x>.33&&x<.57&&y>.2&&y<.68){cheer=1.6;chI.visible=false;chC.visible=true;buzz()}});
// pointer parallax
let px=0,py=0,tx=0,ty=0;addEventListener('pointermove',e=>{tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5});
function fit(){const w=innerWidth,h=innerHeight;renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(w,h,false);cam.aspect=w/h;const a=w/h,base=36;cam.fov=a<16/9?2*Math.atan(Math.tan(base*Math.PI/360)*(16/9)/a)*180/Math.PI:base;const u=$('#ui').getBoundingClientRect(),d=w/2-(u.left+u.width*.445);cam.setViewOffset(w,h,Math.round(d),0,w,h)}
addEventListener('resize',fit);fit();
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const t=clock.getElapsedTime(),dt=Math.min(clock.getDelta(),.05);
 px+=(tx-px)*.05;py+=(ty-py)*.05;cam.position.set(px*3,5.5-py*1.2,26);cam.lookAt(0,3,0);
 if(cheer>0){cheer-=.016;if(cheer<=0){chI.visible=true;chC.visible=false}}
 (chC.visible?chC:chI).userData.anim(t);hero.rotation.y=-.3+Math.sin(t*.5)*.08;
 anims.forEach(f=>f(t));
 clouds.forEach(c=>{c.position.x+=c.userData.v*.016;if(c.position.x>60)c.position.x=-60});
 ring.material.opacity=.75+Math.sin(t*2.5)*.2;ring.scale.setScalar(1+Math.sin(t*2.5)*.03);
 renderer.render(scene,cam)}
loop();
})();
</script>
