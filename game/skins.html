#volBtn{width:34px;height:34px;border-radius:50%;border:1px solid #2f3f7a;background:#101d38;color:#eaf2ff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
#volBtn svg{width:18px;height:18px}
#volSlider{-webkit-appearance:none;appearance:none;width:96px;height:4px;border-radius:999px;
  background:linear-gradient(90deg,#7dff2e var(--p,50%),#22385f var(--p,50%));outline:none;cursor:pointer}
#volSlider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:#7dff2e;border:2px solid #08140a;cursor:pointer}
#volSlider::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#7dff2e;border:2px solid #08140a;cursor:pointer}
#volLabel{font-family:'Lilita One',sans-serif;font-size:11px;color:#b9c9e4;min-width:30px;text-align:center}
</style>
<script>
(function(){
  'use strict';
  var STEPS=[6,5,15,30,50,75,100];
  function load(){ try{ return JSON.parse(localStorage.getItem('ut-music')); }catch(e){ return null; } }
  function save(v){ try{ localStorage.setItem('ut-music',JSON.stringify(v)); }catch(e){} }
  function snap(v){ var best=STEPS[0],d=Math.abs(v-STEPS[0]); for(var i=1;i<STEPS.length;i++){ var dd=Math.abs(v-STEPS[i]); if(dd<d){d=dd;best=STEPS[i]} } return best; }
  var s=load()||{on:true,v:50}; s.v=snap(s.v);
  var audio=document.getElementById('bgMusic');
  if(audio){ audio.volume=s.v/100; audio.muted=!s.on; if(s.on){ audio.play().catch(function(){}); } }
  function apply(){
    if(!audio) return;
    audio.volume=s.v/100; audio.muted=!s.on;
    var sl=document.getElementById('volSlider'); if(sl){ sl.value=s.v; sl.style.setProperty('--p',s.v+'%'); }
    var lb=document.getElementById('volLabel'); if(lb){ lb.textContent=s.on?(s.v+'%'):'OFF'; }
    var b=document.getElementById('volBtn'); if(b){ b.setAttribute('aria-pressed',String(s.on)); }
  }
  function build(){
    var d=document.createElement('div'); d.id='volPanel';
    var b=document.createElement('button'); b.id='volBtn'; b.type='button'; b.setAttribute('aria-label','Volume');
    b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M19 5a9 9 0 010 14"/></svg>';
    b.addEventListener('click',function(){ s.on=!s.on; save(s); apply(); });
    var sl=document.createElement('input'); sl.type='range'; sl.id='volSlider'; sl.min=0; sl.max=100; sl.step=1; sl.value=s.v;
    sl.addEventListener('input',function(){ s.v=snap(parseInt(sl.value,10)||0); save(s); apply(); });
    var lb=document.createElement('span'); lb.id='volLabel';
    d.appendChild(b); d.appendChild(sl); d.appendChild(lb);
    document.body.appendChild(d); apply();
  }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',build); }
  else { build(); }
})();
</script>
</body></html>
<script>
(function(){
  var cur=null;
  function reduced(){return window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches}
  function clr(w){if(!w)return;var a=w.querySelectorAll('.dt');for(var i=0;i<a.length;i++){a[i].style.removeProperty('--rx');a[i].style.removeProperty('--ry');a[i].style.removeProperty('--s')}}
  function tilt(w,ev,press){
    if(reduced())return;
    var r=w.getBoundingClientRect(),dx=((ev.clientX-r.left)/r.width-.5)*2,dy=((ev.clientY-r.top)/r.height-.5)*2;
    dx=Math.max(-1,Math.min(1,dx));dy=Math.max(-1,Math.min(1,dy));
    var a=w.querySelectorAll('.dt');
    for(var i=0;i<a.length;i++){
      var d=a[i],sm=d.classList.contains('dtA');
      d.style.setProperty('--rx',((sm?-28:-24)-dy*8)+'deg');
      d.style.setProperty('--ry',((sm?-38:-30)+dx*10)+'deg');
      d.style.setProperty('--s',press?'.94':'1');
    }
  }
  function hit(ev){var t=ev.target;return t&&t.closest?t.closest('.dtw'):null}
  document.addEventListener('pointermove',function(ev){
    var w=hit(ev);if(cur&&cur!==w)clr(cur);cur=w;
    if(w)tilt(w,ev,ev.buttons>0||ev.pointerType==='touch');
  });
  document.addEventListener('pointerdown',function(ev){var w=hit(ev);if(w){cur=w;tilt(w,ev,true)}});
  function up(ev){
    if(!cur)return;
    if(ev.pointerType&&ev.pointerType!=='mouse'){clr(cur);cur=null}
    else tilt(cur,ev,false);
  }
  document.addEventListener('pointerup',up);
  document.addEventListener('pointercancel',function(){clr(cur);cur=null});
  document.documentElement.addEventListener('mouseleave',function(){clr(cur);cur=null});
})();
</script>
