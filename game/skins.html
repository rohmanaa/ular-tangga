<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:980}}">
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const flt = st.flt ?? 'Semua', sel = st.sel ?? 1, eq = st.eq ?? 1;
const RC = { Common:'#7e93b6', Rare:'#3b92ee', Epic:'#b07af0', Legendary:'#f2b705' };
// id,nama,set,rarity,milik,kulit,rambut,baju,celana,sepatu,topi,tipe topi,jubah,sayap,deskripsi
const D = [
[1,'Penjelajah','Default','Common',1,'#f2c9a0','#5a3a22','#3b92ee','#2f3f7a','#3a3a3a','','','','','Pakaian standar para pemain baru. Sederhana, nyaman, siap menaiki tangga.'],
[2,'Petualang Hutan','Adventure','Common',1,'#e8b98a','#3b2a1a','#58b02d','#6b4a2b','#3a2a1a','#2d7a21','cap','','','Topi hijau dan rompi lumut untuk menembus rimba blok.'],
[3,'Pendaki Gunung','Adventure','Rare',1,'#f2c9a0','#4a2e1a','#f08a24','#3d4a66','#28324a','#b5600f','cap','#b5600f','','Jaket oranye cerah dengan jubah kecil anti angin puncak.'],
[4,'Penyihir Rimba','Fantasy','Rare',1,'#f5d6b8','#d8d8e8','#6a3db0','#28324a','#1b2236','#9a63e8','cap','#6a3db0','','Jubah ungu bertabur mantra untuk lemparan dadu yang beruntung.'],
[5,'Peri Hutan','Fantasy','Epic',1,'#f5d6b8','#9ff2e0','#2fbfa3','#1b8672','#145f50','','','','#9ff2e0','Sayap tembus pandang yang berkilau di bawah cahaya pagi.'],
[6,'Ksatria Baja','Adventure','Epic',0,'#e8b98a','#3b2a1a','#aebdd3','#5d7090','#3d4a66','#8497b3','cap','#3b92ee','','Zirah baja dan jubah biru. Dibuka lewat Toko.'],
[7,'Naga Emas','Fantasy','Legendary',0,'#f2c9a0','#7a5230','#f2b705','#a35a22','#5f3f25','','crown','#c48f00','#ffe27a','Mahkota emas, sayap naga, dan jubah kerajaan. Skin paling langka.'],
[8,'Ninja Bayangan','Adventure','Epic',0,'#e8b98a','#1b2236','#28324a','#1b2236','#0f1626','#1b2236','cap','','','Serba gelap dan senyap. Tersedia di Toko musim ini.']];
const mk = (r) => { const own = !!r[4]; return { id:r[0], name:r[1], cat:r[2], rar:r[3], rarU:r[3].toUpperCase(), rc:RC[r[3]], owned:own, locked:!own, skin:r[5], hair:r[6], shirt:r[7], pants:r[8], boots:r[9], hat:r[10]||'#000', cap:r[11]==='cap', crown:r[11]==='crown', cape:!!r[12], capeC:r[12]||'#000', wings:!!r[13], wingC:r[13]||'#000', desc:r[14], op:own?1:.5, sw:[r[7],r[8],r[6],r[5]], bc: r[0]===sel?'#7dff2e':'#22385f', sh: r[0]===sel?'0 0 0 2px rgba(125,255,46,.25),0 10px 26px rgba(125,255,46,.18)':'none', pick:() => this.setState({ sel:r[0] }) }; };
const all = D.map(mk);
const list = all.filter(i => flt==='Semua' || i.cat===flt || i.rar===flt);
const b = all.find(i => i.id===sel) || all[0];
const s = { ...b, status: b.locked ? 'Belum dimiliki' : b.id===eq ? 'Sedang dipakai' : 'Siap dipakai', btnText: b.locked ? 'Terkunci' : b.id===eq ? 'Sedang Dipakai' : 'Terapkan', btn: b.locked ? 'background:#1b2f52;color:#6b7a99;cursor:not-allowed' : b.id===eq ? 'background:rgba(125,255,46,.12);color:#7dff2e;border:2px solid #7dff2e' : 'background:#7dff2e;color:#08140a;box-shadow:0 7px 0 #3fa312,0 16px 38px rgba(125,255,46,.35)' };
const names = ['Semua','Default','Adventure','Fantasy','Rare','Epic','Legendary'];
return { s, list, eqName: (all.find(i => i.id===eq)||all[0]).name,
 filters: names.map(n => ({ name:n, on:n===flt, style: n===flt ? 'background:#7dff2e;color:#08140a;border:0;box-shadow:0 3px 0 #3fa312' : 'background:#101d38;color:#b9c9e4;border:1px solid #22385f', pick:() => this.setState({ flt:n }) })),
 apply: () => { if (b.owned) this.setState({ eq:b.id }); } };
}
}
</script>
