<style>
/* Layout: kanvas 3D memenuhi layar. HUD di atas (pemain + alat), dock di bawah (pesan + dadu), menu dan hasil sebagai kartu di tengah. Warna langit berganti sesuai tema. */
:root{
  --sky-top:#5EC1FF;
  --sky-bot:#DDF4FF;
  --ink:#1B2A3B;
  --paper:#FFFDF2;
  --sun:#FFC21A;
  --ladder-tile:#FFE27A;
  --snake-tile:#FF8F7A;
  --font-display:'Silkscreen','Courier New',monospace;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html{height:100%;overflow:hidden;box-sizing:border-box}
body{
  height:100%;margin:0;overflow:hidden;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bot) 78%);
  color:var(--ink);font-family:var(--font-body);font-weight:600;
  -webkit-tap-highlight-color:transparent;
}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
#c:active{cursor:grabbing}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.panel{background:var(--paper);border:3px solid var(--ink);border-radius:6px;box-shadow:0 4px 0 var(--ink)}
.btn{
  font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  font-size:14px;line-height:1.1;color:var(--ink);background:var(--sun);
  border:3px solid var(--ink);border-radius:6px;padding:12px 16px;cursor:pointer;
  box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;
  -webkit-user-select:none;user-select:none;
}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{background:#D7DCE2;color:#6B7886;cursor:default;box-shadow:0 2px 0 var(--ink);transform:translateY(3px)}
.btn.light{background:var(--paper)}
.btn.small{font-size:11px;padding:8px 10px;box-shadow:0 3px 0 var(--ink)}
.btn.small:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.big{font-size:16px;padding:14px 20px}

/* HUD: panel kiri (pemain, giliran, skor) + bar power-up, alat di kanan atas */
.hud,.side{display:none}
body.playing .hud{display:flex}
body.playing .side{display:block}
.hud{position:fixed;top:0;right:0;z-index:5;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 12px;pointer-events:none;max-width:100%}
.hud>*{pointer-events:auto}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.side{position:fixed;inset:0;z-index:5;pointer-events:none}
.col{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));width:204px;display:flex;flex-direction:column;gap:10px;pointer-events:auto}
.pnl{background:rgba(27,42,59,.9);color:#fff;border:3px solid var(--ink);border-radius:8px;box-shadow:0 4px 0 var(--ink);padding:10px}
.pnl h3{margin:0 0 8px;font-family:var(--font-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.pr{display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:6px;border:3px solid transparent;border-radius:6px;font-family:var(--font-display);font-size:12px;text-transform:uppercase;opacity:.65;flex-wrap:wrap}
.pr:last-child{margin-bottom:0}
.pr.on{border-color:#fff;opacity:1}
.pr img,.sr img{width:24px;height:24px;image-rendering:pixelated;border:2px solid rgba(0,0,0,.45);flex:none}
.pr .pos{margin-left:auto;opacity:.85}
.hp{flex:1 0 100%;height:8px;background:#4a1010;border:2px solid var(--ink)}.hp i{display:block;height:100%;background:#E53935}
.trow{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
#turnName{font-family:var(--font-display);font-size:14px;text-transform:uppercase}
.tn .btn{width:100%;box-sizing:border-box}
.msg{margin:10px 0 0;font-size:13px;font-weight:800;line-height:1.3;text-align:center;min-height:2.6em}
.sr{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-family:var(--font-display);font-size:12px;text-transform:uppercase}
.sr b{margin-left:auto}
.pu{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);pointer-events:auto}
#pus{display:flex;gap:8px}
.pb{width:46px;height:46px;font-size:24px;background:#312b26;border:3px solid #574d44;border-radius:6px;position:relative;cursor:pointer;padding:0;box-shadow:0 3px 0 #110e0c}
.pb:disabled{opacity:.35;cursor:default}
.pb b{position:absolute;right:2px;bottom:-2px;font:10px var(--font-display);color:#fff;text-shadow:1px 1px #000}

@media(max-width:699px){
  .col{left:8px;right:8px;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:auto;gap:8px}
  .sc,.pl h3,.pu h3{display:none}
  .pl{order:1}.pu{order:2;position:static;transform:none}.tn{order:3}
  #players{display:flex;gap:6px}.pr{margin:0;flex:1 1 0;min-width:0;padding:4px 6px;font-size:10px}
  .pnl{padding:8px}#pus{justify-content:center}
}
/* Dadu 3D */
.die-scene{width:64px;height:64px;perspective:420px;flex:none}
.die-scene.hop{animation:hop 1.1s}
@keyframes hop{0%{transform:translateY(0)}30%{transform:translateY(-30px)}58%{transform:translateY(0)}72%{transform:translateY(-9px)}100%{transform:translateY(0)}}
.die-tilt{width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(-20deg) rotateY(26deg)}
.die{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.face{
  position:absolute;inset:0;background:#fff;border:3px solid var(--ink);box-sizing:border-box;
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:7px;backface-visibility:hidden;
}
.face i{display:block}
.face i.on{background:var(--ink);transform:scale(.82)}
.f1{transform:translateZ(32px)}
.f6{transform:rotateY(180deg) translateZ(32px)}
.f3{transform:rotateY(90deg) translateZ(32px)}
.f4{transform:rotateY(-90deg) translateZ(32px)}
.f5{transform:rotateX(90deg) translateZ(32px)}
.f2{transform:rotateX(-90deg) translateZ(32px)}

/* Overlay */
.overlay{
  position:fixed;inset:0;z-index:20;display:flex;overflow:auto;background:rgba(27,42,59,.42);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.overlay.soft{background:rgba(27,42,59,.12);align-items:flex-end}
.card{
  width:min(480px,100%);margin:auto;background:var(--paper);border:4px solid var(--ink);border-radius:8px;
  box-shadow:0 8px 0 var(--ink);padding:20px 20px 22px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box;
}
.card h1,.card h2{
  margin:0;font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.02em;
  font-size:clamp(26px,8vw,38px);line-height:1.05;text-shadow:3px 3px 0 var(--sun);text-wrap:balance;
}
.card p{margin:0;font-size:15px;line-height:1.45}
.eyebrow{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:12px}

.lbl{margin:0;font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding-bottom:5px}
.err{color:#9B1C1C;font-weight:800}
.center{text-align:center;align-items:stretch}

@media (max-width:420px){
  .roller{gap:12px;padding:8px 10px}
  .btn.big{font-size:14px;padding:13px 14px}
  .msg{font-size:14px}
}
@media (prefers-reduced-motion:reduce){
  .die-scene.hop{animation:none}
  .chip,.btn{transition:none}
}
</style>

<style>

/* menu, jeda, hasil */
body .card{background:linear-gradient(#7cc2ff,#4a9ae8);border:0;border-radius:26px;color:#fff;box-shadow:0 10px 0 var(--bd),0 22px 30px rgba(0,0,0,.3),inset 0 3px 3px rgba(255,255,255,.55)}
body .card h1,body .card h2,body #pauseMenu .card h2,body #exitConfirm .card h2{color:#fff;text-transform:none;letter-spacing:0;font-size:clamp(30px,8vw,42px);text-shadow:0 4px 0 var(--bd)}
body .card p{color:#eaf6ff;font-weight:700}
/* hasil: menang biru / kalah merah; mahkota di tengah garis atas card (tanpa chip) */
#win .card{position:relative;padding-top:58px}
#win .res-ico{position:absolute;top:0;left:50%;transform:translate(-50%,-50%);width:88px;height:88px;pointer-events:none;color:#ffc93c;filter:drop-shadow(0 4px 0 #b86a0b) drop-shadow(0 8px 8px rgba(0,0,0,.28))}
#win .res-ico svg{display:block;width:100%;height:100%}
#win .res-ico{animation:ico-float 2.4s ease-in-out infinite}
#win[data-state=lose] .res-ico{animation-duration:3.2s}
@keyframes ico-float{0%,100%{translate:0 0;rotate:-4deg}50%{translate:0 -7px;rotate:4deg}}
@media (prefers-reduced-motion:reduce){#win .res-ico{animation:none}}
#win .res-ico .ico-lose{display:none}
#win .res-ico .ico-win path{stroke:#fff3b0;stroke-width:.7;stroke-linejoin:round;paint-order:stroke}
#win[data-state=lose] .card{background:linear-gradient(#ff9a9a,#e54848);box-shadow:0 10px 0 #8f1620,0 22px 30px rgba(0,0,0,.3),inset 0 3px 3px rgba(255,255,255,.55)}
#win[data-state=lose] .card h2{text-shadow:0 4px 0 #8f1620}
#win[data-state=lose] .res-ico{filter:drop-shadow(0 4px 0 #8f1620) drop-shadow(0 8px 8px rgba(0,0,0,.28))}
#win[data-state=lose] .res-ico .ico-win{display:none}
#win[data-state=lose] .res-ico .ico-lose{display:block}
#win[data-state=lose] .btn.light{background:linear-gradient(#ff8f8f,#d93434);text-shadow:0 2px 0 #8f1620;box-shadow:0 5px 0 #8f1620,0 10px 14px rgba(120,10,20,.35),inset 0 2px 2px rgba(255,255,255,.6)}
body .eyebrow,body .lbl{color:#d7ecff;text-transform:none;letter-spacing:.02em;font-size:15px}
body #pauseMenu,body #exitConfirm{background:rgba(18,51,127,.5);backdrop-filter:blur(6px)}
@media(max-width:699px){body .tn .msg{font-size:12px}body .btn.small,body .hud .btn.small{font-size:12px;padding:6px 10px}}
</style>

<style id="hud-upgrade">
/* ===== HUD UPGRADE v2 (mengikuti referensi) — CSS scoped ke #side; canvas/scene 3D tidak disentuh =====
   Sistem: panel biru glossy, pill header navy bertumpuk di tepi atas panel, outline terang 3px, tombol utama emas. */
#side{--slot:clamp(54px,4.7vw,76px);--ok:#3cc23c;--warn:#ffb62a;--off:#7a8fb0;--navy:#0d3a9a;--rim:#6cc0ff}
#side .pnl{position:relative;overflow:visible}
@media(max-width:699px){#side .pnl.pu{position:relative}}
/* pill header */
#side .pnl>h3{position:absolute;top:-17px;margin:0;padding:3px 18px 4px;border-radius:999px;font-size:clamp(15px,1.15vw,18px);line-height:1.15;white-space:nowrap;
  background:linear-gradient(#2d78e0,var(--navy));box-shadow:0 3px 0 var(--bd),inset 0 0 0 2px var(--rim),inset 0 2px 2px rgba(255,255,255,.35);display:flex;align-items:center;gap:8px;text-align:center}

/* --- Player status --- */
#side .pnl.pl{padding:26px 12px 12px}
#side .pl>h3{left:50%;translate:-50% 0;min-width:78%;justify-content:center}
#side #players{display:flex;flex-direction:column;gap:8px}
#side .pr{position:relative;margin:0;gap:10px;min-height:clamp(46px,3.5vw,56px);padding:6px 10px 6px 7px;border-radius:15px;line-height:1.1;font-size:clamp(14px,1.05vw,17px);opacity:.95;filter:none;transform:none;
  background:linear-gradient(#3f9bff,#1c64d4);box-shadow:0 3px 0 rgba(10,30,100,.5),inset 0 0 0 2px rgba(190,225,255,.75)}
#side .pr img{width:clamp(34px,2.7vw,42px);height:clamp(34px,2.7vw,42px);border-radius:8px;border-width:2px}
#side .pr>span:first-of-type{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#side .pr .pos{min-width:2.4em;padding:0 10px;text-align:center;font-size:clamp(13px,1vw,16px);line-height:1.55;border-radius:999px;background:rgba(10,40,120,.6)}
#side .pr.on{background:linear-gradient(#ffd24d,#f4a81f);box-shadow:0 3px 0 #b9740c,inset 0 0 0 2px rgba(255,255,255,.8);animation:hud-on .25s ease-out}
#side .pr.on .pos{background:rgba(163,95,8,.45)}
@keyframes hud-on{from{transform:scale(.97)}to{transform:none}}

/* --- Power-up (kiri bawah): pill header + panah + slot --- */
#side .pnl.pu{display:flex;align-items:center;gap:6px;width:clamp(380px,36vw,600px);padding:24px 10px 10px}
#side .pu>h3{left:14px}
#side .pu>h3::before{content:"\26A1";font-size:1.15em;filter:drop-shadow(0 1px 0 rgba(0,0,0,.3))}
#side #pus{flex:1;min-width:0;display:flex;flex-wrap:nowrap;gap:2px;max-width:none;overflow-x:auto;overflow-y:visible;scroll-snap-type:x proximity;scrollbar-width:none;padding:12px 4px 0;margin-top:-6px}
#side #pus::-webkit-scrollbar{display:none}
#side .pu-nav{background:linear-gradient(#4aa8ff,#1f6fe0);border:0;cursor:pointer;box-shadow:0 4px 0 var(--bd),inset 0 2px 2px rgba(255,255,255,.55);flex:none;width:clamp(30px,2.4vw,38px);height:clamp(36px,3vw,46px);padding:0;border-radius:12px;display:grid;place-items:center}
#side .pu-nav svg{width:55%;height:55%}
#side .pu-nav:disabled{opacity:.4;cursor:default;transform:none;filter:none}
#side .pb{flex:1 0 var(--slot);min-width:var(--slot);height:calc(var(--slot)*1.18);scroll-snap-align:start;font-size:calc(var(--slot)*.52);border-radius:14px;overflow:visible;
  background:transparent;box-shadow:none;transition:transform .15s cubic-bezier(.3,1.6,.5,1),background .15s,opacity .15s}
#side .pb em{margin-top:3px;font-size:clamp(11px,.85vw,13px);line-height:1}
#side .pb b{top:0;right:2px;min-width:22px;height:22px;font-size:12px;border:2px solid #fff;box-shadow:0 2px 0 rgba(10,30,100,.4)}
#side .pb[data-state=ready]{background:rgba(255,255,255,.1)}
#side .pb[data-state=locked]{opacity:.8}
#side .pb[data-state=locked] b{background:var(--warn);color:#6b3a05}
#side .pb[data-state=empty]{opacity:.6;filter:grayscale(.45)}
#side .pb[data-state=empty] b{background:var(--off)}
#side .pb:disabled{cursor:not-allowed}
#side .pb:not(:disabled):hover{transform:translateY(-3px) scale(1.06);background:rgba(255,255,255,.2)}
#side .pb:not(:disabled):active{transform:translateY(1px) scale(.93)}
#side .pb:focus-visible{outline:3px solid #ffe36a;outline-offset:1px}

/* --- Panel giliran (kanan bawah): avatar + dadu menonjol di atas panel --- */
#side .rcol .pnl.tn{display:flex;flex-direction:column;margin-top:clamp(70px,7vw,110px);padding:14px 16px 12px;
  background:linear-gradient(#2a86ee,#1456c4);box-shadow:0 6px 0 var(--bd),0 14px 24px rgba(18,51,127,.35),inset 0 2px 3px rgba(255,255,255,.5),inset 0 0 0 3px var(--rim)}
#side .tn>h3{right:16px;top:-18px;padding-left:14px}
#side .tn>h3::before{content:"";width:1.15em;height:.9em;background:#ffd24d;clip-path:polygon(0 100%,0 25%,25% 55%,50% 0,75% 55%,100% 25%,100% 100%)}
#side .tn.is-wait>h3::before{background:var(--warn)}
#side .tn.is-wait>h3{opacity:.95}
.tn-av{position:absolute;left:4px;bottom:calc(100% - clamp(36px,3.2vw,52px));width:clamp(104px,9vw,150px);aspect-ratio:1;pointer-events:none;z-index:1;
  --pc:#27b6e6;filter:drop-shadow(0 6px 4px rgba(10,30,100,.35))}
.tn-av::before{content:"";position:absolute;inset:-12% -8% -2%;border-radius:50%;background:radial-gradient(circle,rgba(255,226,120,.95),rgba(255,210,77,0) 68%);z-index:-1}
.tn-av svg,.tn-av img:not([src]){visibility:hidden}.tn-av img{display:block;width:100%;height:100%}
.tn-av img{display:block;image-rendering:pixelated;object-fit:contain;padding:8%;border-radius:18%;background:#fff;box-shadow:0 0 0 4px var(--pc,#fff),0 5px 0 rgba(10,30,100,.4)}
#side .tn .die-scene{position:absolute;right:clamp(18px,1.8vw,30px);top:22px;zoom:1.05;margin:0;z-index:1}
#side .tn .trow{order:1;display:block;margin:clamp(46px,4vw,60px) 0 0;padding:0;min-height:0}
#side #turnName{display:block;max-width:60%;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:clamp(22px,1.8vw,28px);line-height:1.1;margin-left:0}
#side .tn-meta{order:2;display:flex;align-items:center;gap:10px;margin:2px 0 10px;font-size:clamp(13px,1vw,15px);color:#d8ecff;font-weight:800}
#side .tn-meta .on::before{content:"";display:inline-block;width:.7em;height:.7em;margin-right:.4em;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px rgba(255,255,255,.6)}
#side .tn.is-wait .tn-meta .on::before{background:var(--warn)}

function pickRoamTarget(o){
  for(let a=0;a<8;a++){
    const ang=lr()*6.283,d=0.7+lr()*1.8,nx=o.x+Math.sin(ang)*d,nz=o.z+Math.cos(ang)*d;
    if(Math.hypot(nx-o.hx,nz-o.hz)>o.rad) continue;
    if(walkBlocked(nx,nz)||walkBlocked((nx+o.x)/2,(nz+o.z)/2)) continue;
    o.tx=nx; o.tz=nz; o.state='walk'; o.wt=0; o.eat=false; return;
  }
  o.t=1+lr()*2;
}
function updateRoam(dt,t){
  if(reduce) return;
  for(let i=0;i<ROAM.length;i++){
    const o=ROAM[i];
    if(o.state==='walk'){
      o.wt+=dt;
      const dx=o.tx-o.x,dz=o.tz-o.z,d=Math.hypot(dx,dz);
      if(d<0.06||o.wt>14){ o.state='idle'; o.t=1.5+lr()*4; o.eat=o.graze&&lr()<0.65; }
      else{
        let da=Math.atan2(dx,dz)-o.yaw; da=Math.atan2(Math.sin(da),Math.cos(da)); o.yaw+=da*Math.min(1,dt*7);
        const sp=o.speed*Math.max(0,1-Math.abs(da)/1.2),st=Math.min(d,sp*dt);
        const nx=o.x+Math.sin(o.yaw)*st,nz=o.z+Math.cos(o.yaw)*st;
        if(walkBlocked(nx,nz)&&!walkBlocked(o.x,o.z)){ o.state='idle'; o.t=0.4; }
        else{ o.x=nx; o.z=nz; }
        o.cur+=(sp-o.cur)*Math.min(1,dt*6);
      }
    }else{
      o.cur+=(0-o.cur)*Math.min(1,dt*6); o.t-=dt;
      if(o.t<=0) pickRoamTarget(o);
    }
    const k=Math.min(1,o.cur/o.speed);
    o.ph+=dt*(3+o.cur*(o.kind==='chicken'?26:15));
    const sw=Math.sin(o.ph)*0.7*k,L=o.legs;
    if(L.length===4){ L[0].rotation.x=sw; L[3].rotation.x=sw; L[1].rotation.x=-sw; L[2].rotation.x=-sw; }
    else if(L.length===2){ L[0].rotation.x=sw; L[1].rotation.x=-sw; }
    if(o.head){
      let hp=0;
      if(o.state==='idle'&&o.eat) hp=o.kind==='chicken'?0.9*Math.max(0,Math.sin(t*7+o.ph0)):0.85+0.1*Math.sin(t*5+o.ph0);
      else hp=0.08*Math.sin(o.ph*2)*k;
      o.head.rotation.x+=(hp-o.head.rotation.x)*Math.min(1,dt*7);
      if(o.kind==='villager') o.head.rotation.y=o.state==='idle'?Math.sin(t*0.8+o.ph0)*0.5:0;
    }
    if(o.tail) o.tail.rotation.z=Math.sin(t*6+o.ph0)*0.35*(0.4+k);
    for(let w=0;w<o.wings.length;w++) o.wings[w].rotation.z=(w?1:-1)*(0.08+0.2*Math.max(0,Math.sin(t*12+o.ph0))*k);
    o.g.position.set(o.x,Math.abs(Math.sin(o.ph))*0.02*k,o.z); o.g.rotation.y=o.yaw;
  }
}

/* tangga: mengikuti lintasan yang diangkat di atas blok/teras yang menghalangi (mis. petak 21 dan 40), dengan tiang penyangga */
function buildLadders(th){
  const out={},LB=makeBatch();
  Object.keys(LADDERS).forEach(key=>{
    const from=+key,to=LADDERS[key],A=TILES[from],B=TILES[to];
    const dx=B.x-A.x,dz=B.z-A.z,dy=B.h-A.h,hl=Math.hypot(dx,dz)||1;
    const N=Math.max(8,Math.round(hl/0.3)),P=[];
    for(let i=0;i<=N;i++){
      const t=i/N,x=A.x+dx*t,z=A.z+dz*t,base=A.h+dy*t;
      P.push({x,z,y:(i>0&&i<N)?Math.max(base,topAt(x,z,0.34)+0.14):base});
    }
    for(let i=1;i<N;i++) P[i].y=Math.max(P[i].y,P[i-1].y-0.2);
    for(let i=N-1;i>=1;i--) P[i].y=Math.max(P[i].y,P[i+1].y-0.2);
    const sgx=-dz/hl,sgz=dx/hl,seg=[],cum=[0];
    for(let i=0;i<N;i++){
      const F=[P[i].x,P[i].y,P[i].z],T=[P[i+1].x,P[i+1].y,P[i+1].z];
      const d=[T[0]-F[0],T[1]-F[1],T[2]-F[2]],L=Math.hypot(d[0],d[1],d[2]);
      const dn=[d[0]/L,d[1]/L,d[2]/L],hz=Math.hypot(dn[0],dn[2])||1;
      const s=[-dn[2]/hz,0,dn[0]/hz];
      const n=[s[1]*dn[2]-s[2]*dn[1],s[2]*dn[0]-s[0]*dn[2],s[0]*dn[1]-s[1]*dn[0]];
      const M=[F[0]+d[0]/2,F[1]+d[1]/2,F[2]+d[2]/2];
      seg.push({F,dn,s,n,L}); cum.push(cum[i]+L);
      [-1,1].forEach(sd=>{
        addOBox(LB,[M[0]+s[0]*0.25*sd,M[1],M[2]+s[2]*0.25*sd],
          [dn[0]*(L/2+0.06),dn[1]*(L/2+0.06),dn[2]*(L/2+0.06)],[s[0]*0.05,0,s[2]*0.05],[n[0]*0.045,n[1]*0.045,n[2]*0.045],jit(th.rail,0.06));
      });
    }
    const total=cum[N];
    for(let t=0.1,k=0;t<=total-0.08;t+=0.17){
      while(k<N-1&&t>cum[k+1]) k++;
      const sg=seg[k],u=t-cum[k],Q=[sg.F[0]+sg.dn[0]*u,sg.F[1]+sg.dn[1]*u,sg.F[2]+sg.dn[2]*u];
      addOBox(LB,Q,[sg.s[0]*0.25,0,sg.s[2]*0.25],[sg.dn[0]*0.035,sg.dn[1]*0.035,sg.dn[2]*0.035],[sg.n[0]*0.035,sg.n[1]*0.035,sg.n[2]*0.035],jit(th.rung,0.08));
    }
    /* tiang penyangga di bagian yang melayang di atas tanah */
    for(let i=2;i<N-1;i+=3){
      const gy=topAt(P[i].x,P[i].z,0.12),hgt=P[i].y-0.05-gy;
      if(hgt>0.3) [-1,1].forEach(sd=>addBox(LB,P[i].x+sgx*0.25*sd,gy+hgt/2,P[i].z+sgz*0.25*sd,0.06,hgt,0.06,jit(th.rail,0.06),{edge:false}));
    }
    const path=P.map(p=>new THREE.Vector3(p.x,p.y+0.08,p.z));
    out[from]={p1:path[0].clone(),p2:path[N].clone(),path};
  });
  world.add(buildBatch(LB));
  return out;
}

/* ular: tubuh meliuk menuruni teras, kepala di atas petak */
function buildSnakes(th){
  const out={},SB=makeBatch(),dyn=new THREE.Group();
  let si=0;
  Object.keys(SNAKES).forEach(key=>{
    const head=+key,tail=SNAKES[key],H=TILES[head],Tt=TILES[tail],pal=th.snakes[si++%th.snakes.length];
    const dx=Tt.x-H.x,dz=Tt.z-H.z,len=Math.hypot(dx,dz),ux=dx/len,uz=dz/len,px=-uz,pz=ux;
    const N=Math.round(len*9),yH=H.h+1.12,yT=Tt.h+0.2,kw=Math.max(1,Math.round(len/1.7));
    const pts=[];
    for(let i=0;i<=N;i++){
      const t=i/N,dd=t*len;
      const wob=0.33*Math.pow(Math.sin(Math.PI*t),0.8)*Math.sin(t*Math.PI*2*kw);
      const x=H.x+dx*t+px*wob,z=H.z+dz*t+pz*wob;
      const u=Math.min(1,Math.max(0,(dd-0.6)/Math.max(0.5,len-0.6)));
      const s=0.32-0.17*t;
      let y=yT+(yH-yT)*Math.pow(1-u,1.25);
      y=Math.max(y,topAt(x,z,s*0.5)+0.08+s/2);
      pts.push({x,y,z,s});
    }
    for(let i=1;i<=N;i++) pts[i].y=Math.max(pts[i].y,pts[i-1].y-0.08);
    for(let i=N-1;i>=0;i--) pts[i].y=Math.max(pts[i].y,pts[i+1].y-0.08);
    pts.forEach((p,i)=>{
      const acc=Math.floor(i/4)%3===2;
      addBox(SB,p.x,p.y,p.z,p.s,p.s,p.s,jit(acc?pal[1]:pal[0],0.05));
    });
    for(let j=0;j<4;j++) addBox(SB,H.x,H.h+0.14+0.28*j,H.z,0.28,0.28,0.28,jit(pal[0],0.05));
    const fx=-ux,fz=-uz,yaw=Math.atan2(fx,fz);
    const hd=makeSnakeHead(pal);
    hd.head.position.set(H.x,yH,H.z); hd.head.rotation.y=yaw;
    dyn.add(hd.head);
    const bridge=[];
    const bm=new THREE.MeshLambertMaterial({color:pal[0]}),bg=new THREE.BoxGeometry(0.27,0.27,0.27);
    for(let i=0;i<3;i++){ const m=new THREE.Mesh(bg,bm); m.castShadow=true; m.visible=false; dyn.add(m); bridge.push(m); }
    out[head]={
      path:pts,head:hd.head,jaw:hd.jaw,tongue:hd.tongue,bridge,busy:false,phase:rnd()*6,
      rest:{x:H.x,y:yH,z:H.z},neckTopY:H.h+0.98,f:[fx,fz],
      bitePos:new THREE.Vector3(H.x+fx*0.42,H.h,H.z+fz*0.42)
    };
  });
  world.add(buildBatch(SB));
  world.add(dyn);
  return out;
}

function updateMobs(dt,t){
  const pw=players.map(p=>p.pawn.position);
  for(const n in MOBOBJ){
    const m=MOBOBJ[n],g=m.g; let best=null,bd=1e9;
    pw.forEach(q=>{ const d=Math.hypot(q.x-m.x,q.z-m.z); if(d<bd){ bd=d; best=q; } });
    const near=bd<2.6; m.react=Math.max(0,m.react-dt); const rx=m.react>0;
    const lx=near?best.x:camera.position.x,lz=near?best.z:camera.position.z;
    let dy=Math.atan2(lx-m.x,lz-m.z)-g.rotation.y; dy=Math.atan2(Math.sin(dy),Math.cos(dy));
    g.rotation.y+=dy*Math.min(1,dt*(near?8:2.5));
    let y=Math.abs(Math.sin(t*(near?9:2)+m.ph))*(near?0.07:0.012)*(m.k==='warden'?0.6:1),sc=1,jx=0;
    if(m.k==='creeper'&&(near||rx)) sc=1+0.12*Math.abs(Math.sin(t*(rx?22:12)));
    if(m.k==='ender'&&(near||rx)) jx=(Math.random()-0.5)*0.05;
    if(m.k==='warden'&&(near||rx)){ jx=Math.sin(t*40)*0.02*(rx?2:1); sc=1+0.03*Math.sin(t*14)*(rx?2:1); }
    if(rx) y+=0.1*Math.abs(Math.sin(t*16));
    g.position.set(m.x+jx,m.y+y,m.z); g.scale.setScalar(m.s*sc);
    if(m.rods) m.rods.rotation.y+=dt*(near?6:2.2);
  }
  if(FX) FX.updateSparks(dt);
  for(const n in CHESTOBJ){
    const c=CHESTOBJ[n]; c.open=Math.max(0,c.open-dt);
    const a=c.open>0?Math.max(0,Math.min(1,Math.min((1.6-c.open)*6,c.open*3))):0;

  }
}

const tweens=[];
function tween(dur,fn,ease){ return new Promise(res=>{ tweens.push({t:0,dur:Math.max(0.01,dur),fn,ease,res}); }); }

function hopTo(pawn,to,dur,hop){
  const from=pawn.position.clone(),dx=to.x-from.x,dz=to.z-from.z;
  if(dx*dx+dz*dz>1e-4) pawn.rotation.y=Math.atan2(dx,dz);
  return tween(dur,k=>{ pawn.position.lerpVectors(from,to,k); pawn.position.y+=Math.sin(Math.PI*k)*hop; });
}
function glide(pawn,pts,speed,ease,bob){
  const seg=[];let total=0;
  for(let i=1;i<pts.length;i++){ const l=pts[i].distanceTo(pts[i-1]); seg.push(l); total+=l; }
  return tween(Math.max(0.2,total/speed),k=>{
    let d=k*total,i=0;
    while(i<seg.length-1&&d>seg[i]){ d-=seg[i]; i++; }
    const f=seg[i]>0?Math.min(1,d/seg[i]):1;
    pawn.position.lerpVectors(pts[i],pts[i+1],f);
    if(bob) pawn.position.y+=Math.abs(Math.sin(k*total*3.4))*bob;
    const dx=pts[i+1].x-pts[i].x,dz=pts[i+1].z-pts[i].z;
    if(dx*dx+dz*dz>1e-4) pawn.rotation.y=Math.atan2(dx,dz);
  },ease);
}
function faceCamera(pawn){
  let r=pawn.rotation.y; r=Math.atan2(Math.sin(r),Math.cos(r));

}

const cv=$('c'),ptrs=new Map();let pinch=0,twist=0,rotating=false;
const span=()=>{ const a=Array.from(ptrs.values()); return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); };
const ang=()=>{ const a=Array.from(ptrs.values()); return Math.atan2(a[1].y-a[0].y,a[1].x-a[0].x); };
const mid=()=>{ const a=Array.from(ptrs.values()); return {x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}; };
/* geser papan di bidang tanah, searah layar (bebas ke mana saja) */
function panBy(dx,dy){
  const wpp=2*baseDist*cam.zoom*Math.tan(camera.fov*Math.PI/360)/window.innerHeight;
  const sy=Math.sin(cam.yaw),cy=Math.cos(cam.yaw);
  panGoal.x+=-(cy*dx)*wpp + (-sy)*dy*wpp;
  panGoal.z+= (sy*dx)*wpp + (-cy)*dy*wpp;
  panGoal.x=clamp(panGoal.x,-PAN_MAX,PAN_MAX); panGoal.z=clamp(panGoal.z,-PAN_MAX,PAN_MAX);
}

cv.addEventListener('pointerdown',e=>{
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  rotating=(e.button===2||e.shiftKey);
  if(ptrs.size===2){ pinch=span(); twist=ang(); }
  cv.style.cursor=rotating?'crosshair':'grabbing';
});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId); if(!p) return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
  if(ptrs.size===1){
    if(rotating){ goal.yaw-=dx*0.006; goal.pitch=clamp(goal.pitch+dy*0.005,0.22,1.3); }
    else panBy(dx,dy);
  }else if(ptrs.size===2){
    const d=span(); if(pinch>0&&d>0) goal.zoom=clamp(goal.zoom*pinch/d,0.4,1.5); pinch=d;
    let da=ang()-twist; twist=ang();
    if(da>Math.PI) da-=Math.PI*2; if(da<-Math.PI) da+=Math.PI*2;
    goal.yaw-=da;                       /* putar dua jari = putar papan */
    /* dua jari geser ke atas/bawah = ubah sudut miring */
    goal.pitch=clamp(goal.pitch+dy*0.0025,0.22,1.3);
  }
});
const endPtr=e=>{ ptrs.delete(e.pointerId); pinch=0; if(ptrs.size===1){ const q=Array.from(ptrs.values())[0]; } if(!ptrs.size){ rotating=false; cv.style.cursor='grab'; } };
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr);

const FURL={};
function faceURL(k){
  if(FURL[k]) return FURL[k];
  if(PNG_DEFS.some(d=>d.key===k)){ /* wajah dari texture PNG (kepala + hat); belum siap -> wajah Steve tanpa disimpan di cache */
    const im=SKIN_IMG[k]; if(!im) return faceURL('steve');
    const cv=document.createElement('canvas'); cv.width=cv.height=16; const x=cv.getContext('2d'); x.imageSmoothingEnabled=false;
    x.drawImage(im,8,8,8,8,0,0,16,16); x.drawImage(im,40,8,8,8,0,0,16,16); return FURL[k]=cv.toDataURL();
  }
  const c=FC[k],cv=document.createElement('canvas'); cv.width=cv.height=16; const x=cv.getContext('2d');
  c.f.forEach((r,j)=>[...r].forEach((l,i)=>{ x.fillStyle=c.p[l]; x.fillRect(i*2,j*2,2,2); }));
  for(let i=0;i<16;i++)for(let j=0;j<16;j++){ x.fillStyle='rgba(0,0,0,'+(Math.random()*0.14).toFixed(2)+')'; x.fillRect(i,j,1,1); }
  x.fillStyle='rgba(255,255,255,.22)'; x.fillRect(0,0,16,1); x.fillRect(0,0,1,16);
  return FURL[k]=cv.toDataURL();
}

/* CPU hanya memilih Power yang valid (aturan sama dengan usePU): punya stok, bukan Pedang/Totem di fase Dragon, TNT wajib punya target. */
function cpuPUValid(p,k){
  if(!p||!p.pu[k]) return false;
  if(p.pos===100&&(k==='sword'||k==='apple')) return false;
  if(k==='tnt') return players.some(q=>q!==p&&q.pos>0&&q.pos<100);
  return true;
}
async function usePU(k,cpu){
  const p=players[cur];
  if(!p||busy||gameOver||!p.pu[k]||(p.cpu&&!cpu)) return;
  /* Fase Dragon = p.pos===100 (kondisi existing di playTurn). Pedang/Totem Undying (id 'apple') hanya relevan untuk gerak papan: tolak SEBELUM konsumsi, Power tidak berkurang. CPU: tolak diam-diam (CPU sudah memfilter Power valid sebelum usePU, 4.1.8). */
  if(p.pos===100&&(k==='sword'||k==='apple')){ if(!cpu){ const m=PUN[k][1]+' tidak dapat digunakan saat melawan Ender Dragon.'; fb('short',k,PUN[k][1],p.name,{text:m,icon:PUN[k][0]})||hud('showPower',k,PUN[k][1],p.name,{text:m,icon:PUN[k][0]}); } return; }
  const gid=gameId,L=players.filter(q=>q!==p&&q.pos>0&&q.pos<100).sort((a,b)=>b.pos-a.pos)[0];
  if(k==='tnt'&&!L){ if(cpu) return; fb('event','info','TNT belum punya target.'); return setMsg('TNT belum punya target.'); }
  if(k==='grass'&&(!L||L.pos<=p.pos)){ if(cpu) return; fb('event','info','Tidak ada pemain di depanmu.'); return setMsg('Tidak ada pemain di depanmu.'); }
  busy=true; setRoll(false); p.pu[k]--; sfx.pop(); setMsg(p.name+' memakai '+PUN[k][1]+': '+PUN[k][2]+'.');
  if(k==='sword') p.bonus=3; if(k==='feather') p.extra=true; if(k==='potion') p.p4=true; if(k==='apple') p.shield=true;
  renderChips();
  const oldL=L?L.pos:0; /* posisi sebelum efek, untuk feedback target (TNT/Grass) */
  try{
    if(k==='tnt'){ const to=Math.max(1,L.pos-6); await teleport(L,to); L.pos=to; }
    if(k==='grass'){ const a=p.pos,b=L.pos; await teleport(p,b); p.pos=b; await teleport(L,a); L.pos=a; }
  }catch(e){ console.error(e); }
  if(gid!==gameId) return;
  /* Power = feedback singkat (banner HUD), BUKAN kartu/modal hadiah Chest (#puCard). Urutan: pakai → terapkan efek → feedback → lanjut.
     Self-power → Feedback.short. Power bertarget (TNT/Grass) → Feedback.event: pelaku → target → efek → hasil aktual. */
  if(k==='tnt'||k==='grass'){
    let t,e;
    if(k==='tnt'){ const d=oldL-L.pos; t=p.name+' → TNT → '+L.name+(d>0?' mundur '+d+' petak':' tidak bergerak')+' ('+oldL+' → '+L.pos+')'; }
    else t=p.name+' bertukar posisi dengan '+L.name+' — '+p.name+' '+p.pos+', '+L.name+' '+L.pos;
    e=k==='tnt'?L.name+(oldL-L.pos>0?' mundur '+(oldL-L.pos)+' petak':' tidak bergerak'):'Bertukar posisi dengan '+L.name; setMsg(t); { const po={gid,icon:PUN[k][0],desc:e}; fb('short',k,PUN[k][1],p.name,po)||hud('showPower',k,PUN[k][1],p.name,po); }
  }else{ const po={gid,icon:PUN[k][0],desc:PUN[k][2]}; fb('short',k,PUN[k][1],p.name,po)||hud('showPower',k,PUN[k][1],p.name,po); }
  busy=false; if(!p.cpu) setRoll(true); focus=p.pawn; renderChips();
}

async function walk(p,from,to){
  const dir=to>from?1:-1;
  for(let c=from;c!==to;c+=dir){
    const dst=slotPos(p.idx,c+dir),d=p.pawn.position.distanceTo(dst);
    sfx.hop();
    await hopTo(p.pawn,dst,0.16+0.12*d,0.28+0.06*d);
  }
}
async function climb(p,from,to){
  const L=LADINFO[from];
  sfx.ladder();
  await hopTo(p.pawn,L.p1.clone(),0.3,0.25);
  await glide(p.pawn,L.path?L.path.map(v=>v.clone()):[L.p1.clone(),L.p2.clone()],1.7,null,0.07);
  await hopTo(p.pawn,slotPos(p.idx,to),0.3,0.3);
}

/* kepala ular: posisi relatif terhadap posisi istirahat */
function poseHead(S,fw,dy,pitch,jawOpen){
  const h=S.head;
  h.position.set(S.rest.x+S.f[0]*fw,S.rest.y+dy,S.rest.z+S.f[1]*fw);
  h.rotation.x=pitch; S.jaw.rotation.x=jawOpen;
  const nx=S.rest.x,ny=S.neckTopY,nz=S.rest.z;
  const ex=h.position.x-nx,ey=h.position.y-ny,ez=h.position.z-nz,dist=Math.hypot(ex,ey,ez);
  S.bridge.forEach((m,i)=>{
    const t=(i+1)/(S.bridge.length+1);
    m.visible=dist>0.32; m.position.set(nx+ex*t,ny+ey*t,nz+ez*t);
  });
}
function resetSnakes(){
  Object.keys(SNAKEINFO).forEach(k=>{ const S=SNAKEINFO[k]; S.busy=false; poseHead(S,0,0,0,0); });
  scene.remove(lump); lump.visible=false;
}
/* caplok: kepala menyambar, rahang menutup, pion ditelan, benjolan turun ke ekor, pion dimuntahkan */
async function bite(p,from,to,gid){
  const S=SNAKEINFO[from],pts=S.path;
  const A=async pr=>{ await pr; if(gid!==gameId) throw STALE; };
  S.busy=true;
  await A(hopTo(p.pawn,S.bitePos.clone(),0.35,0.3));
  p.pawn.rotation.y=Math.atan2(-S.f[0],-S.f[1]);
  focus=p.pawn;
  sfx.hiss();
  await A(tween(0.4,k=>poseHead(S,0,0.18*k,-0.45*k,1.05*k)));
  await A(tween(0.2,k=>poseHead(S,lerp(0,0.42,k),lerp(0.18,-0.52,k),lerp(-0.45,0.9,k),1.05),k=>k*k));
  S.head.updateMatrixWorld(true);
  const mouth=S.head.localToWorld(new THREE.Vector3(0,-0.12,0.42));
  const p0=p.pawn.position.clone();
  sfx.chomp();
  await A(tween(0.16,k=>{
    poseHead(S,0.42,-0.52,0.9,lerp(1.05,0.02,k));
    p.pawn.position.lerpVectors(p0,mouth,k);
    p.pawn.scale.setScalar(lerp(1,0.2,k));
  }));
  p.pawn.visible=false;
  await A(tween(0.18,k=>poseHead(S,0.42,-0.52,0.9+0.12*Math.sin(k*24),0.02)));
  sfx.gulp();
  scene.add(lump); lump.visible=true; lump.material.color.setHex(p.hex); focus=lump;
  const back=tween(0.45,k=>poseHead(S,lerp(0.42,0,k),lerp(-0.52,0,k),lerp(0.9,0,k),0));
  const total=pts.length,dur=Math.max(1.0,total*0.036);
  let ate=false; /* suara 'makan' dipicu dari progres animasi: saat benjolan mencapai tengah badan ular */
  const trip=tween(dur,k=>{
    if(!ate&&k>=0.5&&gid===gameId){ ate=true; sfx.caplokular(); }
    const f=k*(total-1),i=Math.floor(f),j=Math.min(total-1,i+1),r=f-i,a=pts[i],b=pts[j];
    lump.position.set(lerp(a.x,b.x,r),lerp(a.y,b.y,r),lerp(a.z,b.z,r));
    lump.scale.setScalar(lerp(a.s,b.s,r)*1.75*(1+0.12*Math.sin(k*34)));
  },k=>k*k*(3-2*k));
  await A(Promise.all([back,trip]));
  const end=pts[total-1];
  scene.remove(lump); lump.visible=false;
  sfx.pop();
  p.pawn.visible=true; p.pawn.scale.setScalar(0.2);
  p.pawn.position.set(end.x,end.y,end.z); focus=p.pawn;
  await A(Promise.all([
    hopTo(p.pawn,slotPos(p.idx,to),0.55,0.8),
    tween(0.4,k=>p.pawn.scale.setScalar(lerp(0.2,1,k)))
  ]));
  p.pawn.scale.setScalar(1);
  S.busy=false;
}

async function playTurn(p,v,gid,bn){

    sfx.dragonIdle();
    await A(hitDragon(p,v));
    if(p.dhp<=0){ await A(celebrate(p)); finishGame(p); return; }

    return;
  }
  const target=p.pos+v+(bn||0);

    await A(walk(p,p.pos,target)); p.pos=target;
  }else{
    const over=target-100,fin=100-over;

    p.pos=to;

    const k=mobOn(p.pos,themeKey); mobReact(p.pos);

      setMsg('Creeper meledak! '+p.name+' terlempar mundur 2 blok.'); fb('event','mob','Creeper! Meledak, mundur 2 blok',{gid});
      sfx.creeper();
      await A(sleep(300)); await A(explode(p));
      const to=Math.max(1,p.pos-2); await A(walk(p,p.pos,to)); p.pos=to;
    }else if(k==='ender'){
      let to; do{ to=p.pos+Math.floor(Math.random()*21)-10; }while(to<1||to>98||to===p.pos);
      setMsg('Enderman! '+p.name+' teleport '+(to>p.pos?'maju':'mundur')+' ke '+to+'.'); fb('event','mob','Enderman! Teleport ke '+to,{gid});
      sfx.enderman();

    }else if(k==='villager'){
      const to=Math.min(99,p.pos+5); setMsg('Villager membantu! '+p.name+' maju 5 blok ke '+to+'.'); fb('event','mob','Villager membantu! Maju 5 blok',{gid}); sfx.pop(); p.score+=5;
      await A(sleep(500)); await A(walk(p,p.pos,to)); p.pos=to;
}else if(k==='skeleton'){

async function doRoll(){

  try{
    await sleep(reduce?250:1150); if(gid!==gameId) return;
    setMsg(p.name+' melempar '+v+'.');
    p.sixes=(v===6)?p.sixes+1:0;
    await sleep(300); if(gid!==gameId) return;
    if(p.sixes>=3){
      p.sixes=0; sfx.bounce();
      setMsg(p.name+' dapat 6 tiga kali berturut-turut. Giliran hangus.'); hud('showResult','Tiga kali 6!','Giliran hangus.',{gid,ttl:1500});
      await sleep(1500); if(gid!==gameId) return;
      nextTurn(); return;
    }
    const bn=p.bonus; p.bonus=0; await playTurn(p,v,gid,bn);
  }catch(e){
    if(e!==STALE){ console.error(e); busy=false; setRoll(!players[cur].cpu); }
  }
}
function finishGame(p){
  gameOver=true; p.score+=50; renderChips(); if(FBK) FBK.hideMarker(p);
  setMsg(p.name+' mengalahkan Ender Dragon!'); setRoll(false);
  const lost=(mode==='cpu'&&p.cpu);

}
function startGame(m,keys){

  players.forEach(p=>scene.remove(p.pawn)); players=[]; clearConfetti();
  applyPendingTheme(); resetSnakes(); resetDragon();
  let defs;
  keys=keys||(m==='cpu'?['steve','alex']:PLAYER_DEFS.slice(0,+m).map(d=>d.key));
  defs=keys.map((k,i)=>{ const d=Object.assign({},PLAYER_DEFS.find(x=>x.key===k)||PNG_DEFS.find(x=>x.key===k)); if(m==='cpu'&&i===1){ d.cpu=true; d.name+=' CPU'; } return d; });
  defs.forEach((d,i)=>{
    const pawn=makePawn(d); pawn.position.copy(slotPos(i,0)); pawn.rotation.y=Math.atan2(-SLOT[i][0],-SLOT[i][1]); scene.add(pawn); /* duduk menghadap api */
    players.push({idx:i,name:d.name,key:d.key,css:d.css,hex:d.hex,cpu:!!d.cpu,pos:0,sixes:0,dhp:100,pawn,score:0,bonus:0,extra:false,p4:false,shield:false,pu:startPU()});
  });
  cur=0; resetCam();
  $('win').hidden=true;
  document.body.classList.add('playing');
  showDie(1,false); beginTurn();
}

/* ---------- Loop render ---------- */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i]; tw.t+=dt;
    const k=Math.min(1,tw.t/tw.dur);
    tw.fn(tw.ease?tw.ease(k):k);
    if(k>=1){ tweens.splice(i,1); tw.res(); }
  }
  const m=1-Math.exp(-dt*10);
  cam.yaw+=(goal.yaw-cam.yaw)*m; cam.pitch+=(goal.pitch-cam.pitch)*m; cam.zoom+=(goal.zoom-cam.zoom)*m;
  let tx=0,ty=2.8,tz=-0.2;
  if(isTopDown){
    tx=0; tz=0; ty=3.5;
  }else if(focus){
    tx+=focus.position.x*0.35; tz+=focus.position.z*0.35; ty+=(focus.position.y-3.2)*0.45;
  }
  pan.x+=(panGoal.x-pan.x)*m; pan.z+=(panGoal.z-pan.z)*m;
  tx+=pan.x; tz+=pan.z;
  const f=m*0.6;
  camTarget.x+=(tx-camTarget.x)*f; camTarget.y+=(ty-camTarget.y)*f; camTarget.z+=(tz-camTarget.z)*f;
  const dist=baseDist*cam.zoom,cp=Math.cos(cam.pitch);
  camera.position.set(camTarget.x+dist*Math.sin(cam.yaw)*cp,camTarget.y+dist*Math.sin(cam.pitch),camTarget.z+dist*Math.cos(cam.yaw)*cp);
  camera.lookAt(camTarget);
  skyDome.position.copy(camera.position);
  if(!reduce){
    clouds.forEach(c=>{ c.g.position.x+=c.speed*dt; if(c.g.position.x>24) c.g.position.x=-24; });
    Object.keys(SNAKEINFO).forEach(k=>{
      const S=SNAKEINFO[k]; if(S.busy) return;
      const ph=now*0.002+S.phase;
      S.head.position.y=S.rest.y+Math.sin(ph)*0.035;
      S.head.rotation.x=Math.sin(ph*0.8)*0.06;
      S.tongue.scale.z=0.55+0.45*Math.abs(Math.sin(now*0.007+S.phase));
    });
    if(snow){
      const a=snow.arr;
      for(let i=0;i<snow.cnt;i++){
        a[i*3+1]-=dt*(0.9+(i%5)*0.15); a[i*3]+=Math.sin(now*0.0007+i)*dt*0.25;
        if(a[i*3+1]<0) a[i*3+1]=14;
      }
      snow.pts.geometry.attributes.position.needsUpdate=true;
    }
  }
  { const D=dragon.userData,wr=Math.sin(now*0.006)*0.55;
    D.wR.rotation.z=wr; D.wL.rotation.z=-wr;
    dragon.position.y=D.y0+Math.sin(now*0.003)*0.18+D.dy; dragon.rotation.y=Math.sin(now*0.0015)*0.2+D.shk; }
  if(FBK) FBK.updateTurnMarkers(players,now,dt);
  if(FX) FX.updateConfetti(dt);
  const watch=[camTarget];
  if(focus) watch.push(focus.position);
  players.forEach(p=>watch.push(p.pawn.position));
  updateMobs(dt,now/1000);
  updateFX(dt,now/1000); updateRoam(dt,now/1000);
  updateFades(dt,watch);
  renderer.render(scene,camera);
}

/* ---------- Konfigurasi dari lobby ---------- */
function readLobbyConfig(){
  const q=new URLSearchParams(location.search);
  let ss=null;
  try{ ss=JSON.parse(sessionStorage.getItem('ut-config')||'null'); }catch(e){ ss=null; }
  if(!ss||typeof ss!=='object') ss=null;
  const validSkin=k=>typeof k==='string'&&(PLAYER_DEFS.some(d=>d.key===k)||PNG_DEFS.some(d=>d.key===k));
  const validMode=m=>m==='cpu'||m==='2'||m==='3'||m==='4';
  const pickParam=(name,isValid)=>{ const v=q.get(name); return v!==null&&isValid(v)?v:null; };
  const themeKeys=THEMES.map(t=>t.key),diceKeys=DICE.map(d=>d.key);
  let mode=pickParam('mode',validMode);
  if(!mode&&ss&&validMode(ss.mode)) mode=ss.mode;
  let skins=[];
  const rawSkins=q.get('skins')!==null?q.get('skins'):(ss&&Array.isArray(ss.skins)?ss.skins.join(','):null);
  if(rawSkins) String(rawSkins).split(',').forEach(k=>{ k=String(k).trim(); if(validSkin(k)&&skins.indexOf(k)<0) skins.push(k); });
  if(!mode) mode='cpu';
  if(mode==='cpu'){
    if(!skins.length) skins=['steve'];
    if(skins.length===1){ const rest=PLAYER_DEFS.filter(d=>d.key!==skins[0]); skins.push(rest[Math.floor(Math.random()*rest.length)].key); }
    skins=skins.slice(0,2);
  }else{
    const n=+mode;
    if(skins.length<n) skins=PLAYER_DEFS.slice(0,n).map(d=>d.key);
    else skins=skins.slice(0,n);
  }
  let theme=pickParam('theme',k=>themeKeys.indexOf(k)>-1);
  if(!theme&&ss&&themeKeys.indexOf(ss.theme)>-1) theme=ss.theme;
  let dice=pickParam('dice',k=>diceKeys.indexOf(k)>-1);
  if(!dice&&ss&&diceKeys.indexOf(ss.dice)>-1) dice=ss.dice;
  let night=null;
  if(q.get('night')==='0'||q.get('night')==='1') night=q.get('night');
  else if(ss&&(ss.night==='0'||ss.night==='1')) night=ss.night;
  return {mode,skins,theme,dice,night};
}
const CFG=readLobbyConfig();
if(CFG.dice) applyDice(CFG.dice);
if(CFG.night!==null) night=CFG.night==='1';
let saved=null;
try{ saved=localStorage.getItem('ut-tema2'); }catch(e){}
buildWorld(CFG.theme||saved||THEMES[0].key);
lastSkins=CFG.skins.slice();
document.addEventListener('pointerdown',()=>{ ensureAudio(); ensureMusic(); if(musicOn) playMusic(); },{once:true});
startGame(CFG.mode,CFG.skins.slice());
/*TEST-HOOK*/
requestAnimationFrame(frame);
})();
</script>
