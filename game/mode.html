<!DOCTYPE html>

<title>Pilih Mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css"><style>
:root{--bd:#12337f;--g:#3cc23c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html{font-size:min(1vw,1.78vh)}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Baloo 2','Fredoka','Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif;font-weight:800;color:#fff;background:linear-gradient(#5db4f5,#a9dcf8 60%,#d5f0ff)}
#sky{position:fixed;inset:0;overflow:hidden}
.isl{position:absolute;opacity:.7;animation:fl 6s ease-in-out infinite}
.isl i{display:block;background:#6fbf4a}.isl b{display:block;background:#8a5a3a;margin:0 auto}
.cl{position:absolute;border-radius:50%;background:#fff;filter:blur(.6rem);opacity:.75}
@keyframes fl{50%{translate:0 -.8rem}}
#stage{position:absolute;left:50%;top:50%;width:100rem;height:56.25rem;translate:-50% -50%}
.ab{position:absolute}
button{font:inherit;color:inherit;border:0;cursor:pointer;transition:transform .15s cubic-bezier(.3,1.6,.5,1),filter .15s}
button:hover{transform:scale(1.05);filter:brightness(1.08)}button:active{transform:scale(.94)}button:focus-visible{outline:.3rem solid #fff}
.blue{background:linear-gradient(#4aa8ff,#1f6fe0);box-shadow:0 .5rem 0 var(--bd),0 1rem 1.4rem rgba(18,51,127,.4),inset 0 .2rem .2rem rgba(255,255,255,.6)}
svg{display:block}
/* header */
#back{left:1.5rem;top:1.4rem;width:5rem;height:5rem;border-radius:1.5rem;padding:0;display:grid;place-items:center}
#back svg{width:3.2rem;height:3.2rem}
#title{left:7.7rem;top:1.3rem;width:27.4rem;height:5.2rem;border-radius:2.6rem;display:flex;align-items:center;gap:1.4rem;padding-left:2.4rem;font-size:3.2rem;white-space:nowrap;text-shadow:0 .25rem 0 var(--bd)}
#title svg{width:4.2rem;height:4.2rem;flex:none}
.pulse{animation:pu .4s}@keyframes pu{50%{transform:scale(1.15)}}
#gear{right:1.4rem;top:1.8rem;width:4.5rem;height:4.5rem;border-radius:1.4rem;padding:0;display:grid;place-items:center}#gear svg{width:2.8rem;height:2.8rem}
/* mode cards */
#modes{left:4rem;top:9.4rem;width:92rem;height:34rem;display:flex;gap:1.6rem;align-items:center}
.mode{position:relative;flex:1;height:100%;border-radius:2.6rem;overflow:hidden;cursor:pointer;background:var(--c1);
 box-shadow:0 .6rem 0 var(--c3),0 1.4rem 2rem rgba(18,30,100,.35),inset 0 0 0 .35rem var(--c2);
 transition:transform .25s cubic-bezier(.3,1.5,.5,1),box-shadow .25s;animation:pop .45s both}
@keyframes pop{from{opacity:0;transform:translateY(2rem) scale(.9)}}
.mode:hover{transform:translateY(-.5rem)}
.mode.sel{transform:scale(1.07);z-index:2;box-shadow:0 0 0 .5rem #ffe94d,0 0 2.8rem 1rem rgba(255,235,80,.7),0 .6rem 0 var(--c3)}
.mode.sel:hover{transform:scale(1.07) translateY(-.4rem)}
.mode:focus-visible{outline:.4rem solid #fff}
.art{position:absolute;left:0;right:0;top:0;height:16.5rem;background:linear-gradient(var(--a1),var(--a2));border-radius:2.6rem 2.6rem 0 0}
.art svg{width:100%;height:100%}
.pn{position:absolute;left:0;right:0;bottom:0;top:15.6rem;display:flex;flex-direction:column;padding:2.3rem 1.5rem 1.5rem;background:linear-gradient(var(--p1),var(--p2));border-radius:2.2rem 2.2rem 0 0;box-shadow:inset 0 .25rem 0 rgba(255,255,255,.28)}
.tag{position:absolute;left:1.3rem;top:14.6rem;z-index:2;padding:0 1.3rem;height:2.5rem;line-height:2.5rem;border-radius:1.3rem;font-size:1.2rem;white-space:nowrap;background:var(--tg);color:var(--tgc,#fff);box-shadow:inset 0 .15rem .2rem rgba(255,255,255,.45),0 0 0 .18rem rgba(255,255,255,.35),0 .2rem 0 rgba(0,0,0,.25)}
.mode h3{margin:0;font-size:3.7rem;white-space:nowrap;line-height:1;letter-spacing:.02em;-webkit-text-stroke:.55rem var(--c3);paint-order:stroke fill;text-shadow:0 .3rem 0 var(--c3)}
.mode p{margin:.4rem 0 0;font-size:1.35rem;line-height:1.2;font-weight:700;color:#fff;flex:1;text-shadow:0 .1rem 0 rgba(0,0,0,.25)}
.cta{display:flex;align-items:center;justify-content:center;gap:.9rem;width:100%;height:4.3rem;border-radius:2.2rem;padding:0;font-size:1.9rem;white-space:nowrap;flex:none}
.cta svg{width:2.3rem;height:2.3rem}
.cta.y{background:linear-gradient(#ffd24d,#ff9a1f);box-shadow:0 .35rem 0 #c96a0c,inset 0 .2rem .2rem rgba(255,255,255,.6);text-shadow:0 .1rem 0 #8a4a0a}
.cta.b{background:linear-gradient(#58b6ff,#1f86ee);box-shadow:0 .35rem 0 #14449f,inset 0 .2rem .2rem rgba(255,255,255,.5);text-shadow:0 .1rem 0 rgba(10,40,120,.6)}
/* bottom bars */
#bar{left:3.6rem;top:46.4rem;width:92.8rem;height:6.8rem;display:flex;gap:1.6rem}
.bb{position:relative;flex:1;min-width:0;overflow:hidden;display:flex;align-items:center;gap:1.4rem;padding:0 1.6rem;text-align:left;border-radius:2rem;
 background:linear-gradient(#3d9bfa,#1f6fe0);box-shadow:0 .4rem 0 var(--bd),0 1rem 1.4rem rgba(18,51,127,.3),inset 0 .2rem .3rem rgba(255,255,255,.55),inset 0 0 0 .22rem rgba(120,195,255,.65)}
.bb.w{flex:1.3}
.bb>svg:first-child{width:4.2rem;height:4.2rem;flex:none;filter:drop-shadow(0 .2rem 0 rgba(10,40,120,.4))}
.bb .tx{flex:1;min-width:0;line-height:1.1}
.bb b{display:flex;align-items:center;gap:.8rem;font-size:1.6rem;font-weight:800;white-space:nowrap}
.bb small{display:block;margin-top:.2rem;font-size:1.05rem;font-weight:700;line-height:1.15;color:#d8efff}
.bb .ch{width:2rem;height:2rem;flex:none}
.soon{font-size:1rem;line-height:1.7rem;padding:0 1rem;border-radius:1rem;background:linear-gradient(#ffe36a,#ffb62a);color:#8a4a0a;box-shadow:0 .15rem 0 #c96a0c}
.bot{position:absolute;right:.8rem;bottom:.2rem;width:6.4rem;height:6.8rem}
.bb.w .tx{padding-right:5.6rem}.bb.w{overflow:visible}
/* fx / modal */
.sp{position:fixed;width:1.3rem;height:1.3rem;background:#fff6a0;rotate:45deg;pointer-events:none;z-index:99;animation:spk .8s forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.ov{position:fixed;inset:0;display:none;place-items:center;background:rgba(18,51,127,.4);backdrop-filter:blur(6px);z-index:50;opacity:0;transition:opacity .25s}
.ov.show{opacity:1}.ov>.box{transform:scale(.85);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}.ov.show>.box{transform:scale(1)}.ov.closing>.box{transform:scale(.9)}
.box{position:relative;width:min(48rem,92vw);max-height:92vh;overflow:auto;background:linear-gradient(#7cc2ff,#4a9ae8);border-radius:2.4rem;padding:3rem 2.4rem 2.4rem;box-shadow:0 1rem 0 var(--bd),0 2rem 3rem rgba(0,0,0,.3);font-size:2.4rem;text-align:center}
.box h2{margin:0 0 1.2rem;font-size:3.4rem;text-shadow:0 .2rem 0 var(--bd)}
.box p{margin:.4rem 0 1rem}
.x{position:absolute;right:-1rem;top:-1rem;width:4.6rem;height:4.6rem;border-radius:50%;background:#ee4a4a;box-shadow:0 .3rem 0 #8e1d1d;font-size:2.4rem;padding:0}
.row{display:flex;justify-content:space-between;align-items:center;background:rgba(18,51,127,.25);border-radius:1.4rem;padding:1rem 1.4rem;margin:.8rem 0;gap:1rem;text-align:left}
.row.opt{cursor:pointer}.row.sel{outline:.3rem solid #ffe36a;background:rgba(255,227,106,.25)}
.row small{font-size:1.6rem;color:#d8efff;font-weight:700}
.tg{min-width:7.6rem;height:3.8rem;border-radius:2rem;background:#7b8aa8;box-shadow:inset 0 .2rem .4rem rgba(0,0,0,.3);font-size:2rem;padding:0 1rem}.tg.on{background:var(--g)}
.pack,.mb{width:100%;display:flex;justify-content:space-between;align-items:center;margin:.8rem 0;padding:1.2rem 1.6rem;border-radius:1.4rem;background:linear-gradient(#ffd24d,#ff9a1f);box-shadow:0 .4rem 0 #c96a0c;font-size:2.4rem;text-shadow:0 .2rem 0 rgba(107,53,17,.7)}
.mb{justify-content:center;width:48%;display:inline-flex;margin:1rem 1% 0}.mb.no{background:linear-gradient(#8ab4e8,#5a88c8);box-shadow:0 .4rem 0 #2f5090;text-shadow:none}
.code{font-size:5rem;letter-spacing:.3rem;color:#ffe36a;text-shadow:0 .25rem 0 var(--bd);margin:.6rem 0}
#toast{position:fixed;left:50%;bottom:3rem;translate:-50% 2rem;background:var(--bd);padding:.8rem 2.4rem;border-radius:2rem;font-size:2.4rem;opacity:0;transition:opacity .3s,translate .35s cubic-bezier(.3,1.8,.5,1);z-index:99;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;translate:-50% 0}
/* portrait */
@media(max-aspect-ratio:1/1){
html{font-size:2.6vw}html,body{overflow:auto}
#stage{position:relative;left:auto;top:auto;translate:none;width:auto;height:auto;padding:1.2rem 1.2rem 3rem;display:flex;flex-direction:column;gap:1.6rem}
.ab{position:relative!important;left:auto!important;top:auto!important;right:auto!important}
#hd{display:flex;flex-wrap:wrap;align-items:center;gap:1.4rem 3.2rem}
#title{order:-1;flex:1;min-width:0;width:auto!important}
#modes{width:auto!important;height:auto!important;display:grid;grid-template-columns:1fr 1fr;gap:2rem 1.6rem;padding:1rem .6rem}
.mode{height:34rem}
#bar{width:auto!important;height:auto!important;display:grid;grid-template-columns:1fr 1fr;gap:1.6rem}
.bb{min-height:7rem;padding:1rem 1.4rem}
.bb.w{grid-column:1/-1}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(()=>{
const $=s=>document.querySelector(s),fmt=n=>n.toLocaleString('id-ID');
// ---------- state: halaman ini TIDAK punya currency state sendiri. Currency & settings dari PlayerData.
// modeScreen hanya menyimpan pilihan mode UI ('sel'); field legacy lain dipertahankan apa adanya.
const PD=window.PlayerData;
let sel='classic';
try{const s=JSON.parse(localStorage.getItem('modeScreen')||'null');if(s&&s.sel)sel=s.sel}catch(e){}
const save=()=>{try{const r=(()=>{try{return JSON.parse(localStorage.getItem('modeScreen'))||{}}catch(e){return{}}})();r.sel=sel;localStorage.setItem('modeScreen',JSON.stringify(r))}catch(e){}};
const SET=()=>PD.settings();
const buzz=()=>{if(SET().vibration&&navigator.vibrate)navigator.vibrate(15)};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
function sparkle(el,n=12){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;for(let i=0;i<n;i++){const s=document.createElement('i');s.className='sp';s.style.left=cx+'px';s.style.top=cy+'px';const a=Math.random()*6.28,d=30+Math.random()*60;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),850)}}
// ---------- sky
(()=>{const sk=$('#sky');
[[8,10,14],[30,6,10],[58,12,16],[84,4,12],[70,68,14],[18,74,12],[44,82,10]].forEach((p,i)=>{const e=document.createElement('div');e.className='cl';e.style.cssText=`left:${p[0]}%;top:${p[1]}%;width:${p[2]}rem;height:${p[2]*.4}rem`;sk.appendChild(e)});
[[5,50,6],[19,22,4],[40,68,5],[63,18,5],[87,40,7],[93,10,4],[2,18,5],[76,78,6],[47,88,4],[28,40,4]].forEach((p,i)=>{const e=document.createElement('div');e.className='isl';e.style.cssText=`left:${p[0]}%;top:${p[1]}%;animation-delay:${-i}s;filter:blur(${i%3}px)`;e.innerHTML=`<i style="width:${p[2]}rem;height:${p[2]*.4}rem"></i><b style="width:${p[2]*.7}rem;height:${p[2]*.6}rem"></b>`;sk.appendChild(e)})})();
// ---------- svg art helpers
const dk=(h,k)=>{const n=parseInt(h.slice(1),16);return'rgb('+[n>>16,n>>8&255,n&255].map(v=>Math.round(v*k)).join(',')+')'};
const cube=(x,y,w,t,l,r)=>`<path d="M${x} ${y}L${x+w} ${y+w/2}L${x} ${y+w}L${x-w} ${y+w/2}Z" fill="${t}"/><path d="M${x-w} ${y+w/2}L${x} ${y+w}L${x} ${y+2*w}L${x-w} ${y+1.5*w}Z" fill="${l||dk(t,.76)}"/><path d="M${x+w} ${y+w/2}L${x} ${y+w}L${x} ${y+2*w}L${x+w} ${y+1.5*w}Z" fill="${r||dk(t,.6)}"/>`;
const slab=(x,y,w,h,t,l,r)=>`<path d="M${x} ${y}L${x+w} ${y+w/2}L${x} ${y+w}L${x-w} ${y+w/2}Z" fill="${t}"/><path d="M${x-w} ${y+w/2}L${x} ${y+w}L${x} ${y+w+h}L${x-w} ${y+w/2+h}Z" fill="${l||dk(t,.76)}"/><path d="M${x+w} ${y+w/2}L${x} ${y+w}L${x} ${y+w+h}L${x+w} ${y+w/2+h}Z" fill="${r||dk(t,.6)}"/>`;
const grass=(x,y,w)=>cube(x,y,w,'#7ddc4a','#7a5232','#5e3d22');
const tree=(x,y,s=1)=>`<rect x="${x-1.5*s}" y="${y}" width="${3*s}" height="${9*s}" fill="#7a5232"/>`+cube(x,y-9*s,7*s,'#3fae3a');
const cloud=(x,y,s=1)=>`<g fill="#fff" opacity=".92" transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="0" rx="17" ry="8"/><ellipse cx="12" cy="-6" rx="12" ry="9"/><ellipse cx="-11" cy="-4" rx="10" ry="7"/></g>`;
const star=(x,y,r,c='#fff')=>`<path d="M${x} ${y-r}Q${x+r*.18} ${y-r*.18} ${x+r} ${y}Q${x+r*.18} ${y+r*.18} ${x} ${y+r}Q${x-r*.18} ${y+r*.18} ${x-r} ${y}Q${x-r*.18} ${y-r*.18} ${x} ${y-r}Z" fill="${c}"/>`;
const flag=(x,y,c)=>`<rect x="${x}" y="${y}" width="1.800" height="22" fill="#eee"/><path d="M${x+1.8} ${y+1}h13l-3 4.500 3 4.500h-13z" fill="${c}"/>`;
const crownP='<path d="M0 16L2 3L9 10L15 0L21 10L28 3L30 16Z" fill="#ffc92e" stroke="#c98a0c" stroke-width="1" stroke-linejoin="round"/><rect x="0" y="14" width="30" height="4" rx="1" fill="#ffb01e"/><circle cx="15" cy="9" r="2" fill="#ff4a6a"/>';
const trophy=(x,y,s,emb)=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M8 8H3c0 9 3 12 8 13M32 8h5c0 9-3 12-8 13" fill="none" stroke="#e6a21a" stroke-width="3.500" stroke-linecap="round"/><path d="M8 1h24v13c0 8-5 13-12 14C13 27 8 22 8 14Z" fill="#ffcf3a" stroke="#d98f10" stroke-width="1.200"/><path d="M11 4h5v12c0 4 1 6 3 8-4-1-8-5-8-10Z" fill="#fff2a0" opacity=".7"/><rect x="17" y="27" width="6" height="7" fill="#e6a21a"/><rect x="11" y="33" width="18" height="5" rx="1.500" fill="#ffc22a"/><rect x="8" y="37" width="24" height="5" rx="1.500" fill="#e6a21a"/>${emb?`<g transform="translate(12.500 6.500) scale(.5)" opacity=".85"><path d="M0 16L2 3L9 10L15 0L21 10L28 3L30 16Z" fill="#e08a10"/></g>`:`<path d="M20 7l2 4.500 5 .5-3.700 3.300 1.100 5L20 17.800 15.600 20.300l1.100-5L13 12l5-.5Z" fill="#fff2a0"/>`}</g>`;
const pips=(x,y,w)=>{const r=w*.12,c=p=>`<circle cx="${p[0]*w}" cy="${p[1]*w}" r="${r}"/>`;
 return `<g fill="#2f6fd0"><g transform="matrix(1 .5 -1 .5 ${x} ${y})">${[[.3,.3],[.5,.5],[.7,.7]].map(c).join('')}</g><g transform="translate(${x-w} ${y+w/2}) skewY(26.565)">${[[.3,.3],[.7,.7]].map(c).join('')}</g><g transform="translate(${x} ${y+w}) skewY(-26.565)">${[[.3,.3],[.7,.3],[.3,.7],[.7,.7]].map(c).join('')}</g></g>`};
const ch=(x,y,s,o)=>{o=Object.assign({hood:'#1fb8d8',hair:'#7a4a2a',pants:'#3a4660',skin:'#f4bf94',a1:6,a2:-6,crown:0,band:0},o);
 const arm=(px,rx,a)=>`<g transform="rotate(${a} ${px} 30)"><rect x="${rx}" y="29" width="8" height="14" fill="${o.hood}"/><rect x="${rx}" y="42" width="8" height="6" fill="${o.skin}"/></g>`;
 return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="27" y="27" width="10" height="19" fill="#8a5a3a"/>
<rect x="11" y="46" width="8" height="11" fill="${o.pants}"/><rect x="21" y="46" width="8" height="11" fill="${o.pants}"/>
<rect x="9" y="56" width="11" height="5" rx="1" fill="#fff"/><rect x="20" y="56" width="11" height="5" rx="1" fill="#fff"/><rect x="9" y="56" width="11" height="1.600" fill="#2f6fd0"/><rect x="20" y="56" width="11" height="1.600" fill="#2f6fd0"/>

const rays=(cx,cy)=>`<g fill="#fff" opacity=".16">${Array.from({length:12},(_,i)=>{const a=i*Math.PI/6,b=a+.2;return`<path d="M${cx} ${cy}L${cx+300*Math.cos(a)} ${cy+300*Math.sin(a)}L${cx+300*Math.cos(b)} ${cy+300*Math.sin(b)}Z"/>`}).join('')}</g>`;

${[0,1,2,3,4,5].map(i=>slab(64+i*21,140-i*8,11,5,tiles[i%4])).join('')}${[0,1,2,3,4,5].map(i=>slab(53+i*21,153-i*8,11,5,tiles[(i+2)%4])).join('')}
${ch(26,36,1.9,{a1:25,a2:-40})}${cube(172,118,17,'#ffffff','#e0e8fa','#c3d0ee')}${pips(172,118,17)}${star(92,40,6)}${star(130,22,4)}`),
ranked:()=>sc(`${glow(120,90,110,'#ff9cf0')}${rays(120,95)}${cube(28,64,12,'#8a6ad8')}${cube(28,48,9,'#a58af0')}${flag(29,20,'#ff4a7a')}${cube(212,60,12,'#8a6ad8')}${cube(212,44,9,'#a58af0')}${flag(213,16,'#ffd24d')}
${Array.from({length:6},(_,k)=>`<ellipse cx="${56+k*3}" cy="${128-k*9}" rx="3" ry="8" transform="rotate(${-20+k*8} ${56+k*3} ${128-k*9})" fill="#ffc92e"/><ellipse cx="${184-k*3}" cy="${128-k*9}" rx="3" ry="8" transform="rotate(${20-k*8} ${184-k*3} ${128-k*9})" fill="#ffc92e"/>`).join('')}
${Array.from({length:9},(_,i)=>slab(i*30-6,152+(i%2)*5,16,12,i%2?'#9a5af8':'#7a3ae0')).join('')}
${ch(82,24,1.9,{crown:1,a1:20,a2:-20})}${trophy(86,104,1.65)}${star(48,40,6,'#ffe27a')}${star(196,98,5,'#ffe27a')}${star(150,22,4)}`),
team:()=>sc(`${cloud(36,24,.8)}${cloud(212,34,.7)}<rect x="118" y="14" width="3" height="56" fill="#e8e8e8"/><path d="M121 16h44l-8 10 8 10h-44z" fill="#4cb4ff"/><circle cx="141" cy="26" r="5" fill="none" stroke="#fff" stroke-width="2.600" stroke-dasharray="3 2"/>
${ch(12,54,1.35,{hood:'#d8363a',hair:'#8a3a1a',a1:20,a2:-10})}${ch(186,58,1.3,{hood:'#7a3ad0',hair:'#5a2a9a',pants:'#22222a',a1:10,a2:-25})}${ch(146,46,1.5,{hood:'#eceef4',hair:'#c8ccd8',band:'#4ab0ff',a1:10,a2:-10})}${ch(78,30,1.9,{a1:30,a2:-12})}
${Array.from({length:9},(_,i)=>slab(i*30-8,150+(i%2)*5,16,12,'#5ccc3a','#7a5232','#5e3d22')).join('')}${star(60,24,5,'#ffe27a')}${star(220,22,4,'#ffe27a')}${star(100,14,4)}`),
turnamen:()=>sc(`${glow(120,84,95,'#fff2a0')}${rays(120,90)}${grass(32,44,12)}${tree(32,34)}${grass(208,36,12)}${tree(208,26)}${cube(22,104,9,'#b04ad0')}${cube(218,100,9,'#d870e8')}
${trophy(54,12,3.3,1)}${slab(80,150,28,10,'#b04ad0')}${slab(164,152,28,10,'#d870e8')}${slab(122,158,34,12,'#9a3ac0')}${star(40,80,6,'#fff6b0')}${star(204,70,5,'#fff6b0')}${star(160,14,4)}`)};
// ---------- icons
const I={play:'<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>',
trophy:'<svg viewBox="0 0 24 24"><path d="M7 3h10v6a5 5 0 0 1-10 0zM7 5H3c0 4 2 6 4 6M17 5h4c0 4-2 6-4 6M12 14v4M8 21h8M9 18h6" fill="#fff" stroke="#fff" stroke-width="1.800" stroke-linejoin="round" stroke-linecap="round"/></svg>',
people:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.500" fill="#fff"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6z" fill="#fff"/><circle cx="17" cy="9" r="3" fill="#fff" opacity=".8"/><path d="M15 14c4-.5 7 1.500 7 6h-5c0-2.500-.8-4.500-2-6z" fill="#fff" opacity=".8"/></svg>',
crown:'<svg viewBox="0 0 30 18"><g>'+crownP+'</g></svg>',
book:'<svg viewBox="0 0 24 24"><path d="M12 6C9 4 5 4 2 5v14c3-1 7-1 10 1 3-2 7-2 10-1V5c-3-1-7-1-10 1ZM12 6v14" fill="#fff" stroke="#bfe2ff" stroke-width="1.200" stroke-linejoin="round"/></svg>',
cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3" fill="#fff"/><path d="M8 3v4M16 3v4" stroke="#fff" stroke-width="2.400" stroke-linecap="round"/><path d="m8 14 3 3 5-6" fill="none" stroke="#2f8cf0" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"/></svg>',
chev:'<svg class="ch" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
bot:'<svg class="bot" viewBox="0 0 60 64"><circle cx="30" cy="6" r="3" fill="#ffd24d"/><rect x="29" y="6" width="2" height="6" fill="#cfe6ff"/><rect x="3" y="26" width="7" height="14" rx="3" fill="#2f6fd0"/><rect x="50" y="26" width="7" height="14" rx="3" fill="#2f6fd0"/><rect x="8" y="11" width="44" height="40" rx="12" fill="#4aa8ff" stroke="#1f6fe0" stroke-width="2"/><rect x="14" y="21" width="32" height="22" rx="7" fill="#10244f"/><rect x="20" y="27" width="6" height="9" rx="2" fill="#6cf0ff"/><rect x="34" y="27" width="6" height="9" rx="2" fill="#6cf0ff"/><path d="M26 39q4 3 8 0" stroke="#6cf0ff" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="16" y="52" width="28" height="11" rx="4" fill="#fff"/></svg>'};
// ---------- data
const MODES=[
{id:'classic',name:'Classic',tag:'4 Player',d:'Mode klasik yang seru<br>dan penuh kejutan.',btn:'Mulai',ic:'play',cta:'y',c:['#2f9bff','#6cc3ff','#0d3a9a','#2a86f0','#1b63d8','#58b8ff','#2f90f0','#1f78e8']},
{id:'ranked',name:'Ranked',tag:'Solo / Duo',d:'Buktikan skill mu dan<br>raih peringkat tertinggi!',btn:'Masuk',ic:'trophy',cta:'b',c:['#8a3df0','#c58cff','#4a1a9a','#7a35e0','#6026c8','#b45cff','#6a2ae0','#7a35e0']},
{id:'team',name:'Team',tag:'2 - 4 Player',d:'Bermain bersama tim<br>menjadi lebih seru!',btn:'Buat Tim',ic:'people',cta:'b',c:['#34c74f','#7be08a','#127a2a','#2fc04a','#1ea038','#6ae878','#2fb04a','#1ea038']},
{id:'turnamen',name:'Turnamen',tag:'Solo / Duo / Squad',d:'Kompetisi antar pemain<br>dengan hadiah menarik!',btn:'Lihat Jadwal',ic:'trophy',cta:'y',c:['#ff9a2a','#ffc46a','#a44a08','#f58a1e','#e8700e','#ffc848','#ff8a1a','#ffd24d'],tc:'#8a4a0a'}];
const BARS=[
{id:'khusus',ic:'crown',t:'Mode Khusus',d:'Event terbatas dengan<br>hadiah spesial!'},
{id:'room',ic:'people',t:'Custom Room',d:'Buat room sendiri<br>dan main bersama teman!'},
{id:'tutorial',ic:'book',t:'Tutorial',d:'Pelajari cara bermain<br>lebih baik!'},
{id:'event',ic:'cal',t:'Event Spesial',d:'Mode baru akan segera hadir!<br>Jangan lewatkan!',soon:1,w:1}];
// ---------- render
function renderModes(){$('#modes').innerHTML=MODES.map((m,i)=>{const c=m.c;
 return `<div class="mode ${m.id===sel?'sel':''}" data-id="${m.id}" tabindex="0" role="button" aria-pressed="${m.id===sel}" aria-label="${m.name}" style="--c1:${c[0]};--c2:${c[1]};--c3:${c[2]};--p1:${c[3]};--p2:${c[4]};--a1:${c[5]};--a2:${c[6]};--tg:${c[7]};--tgc:${m.tc||'#fff'};animation-delay:${i*70}ms">
 <div class="art">${ART[m.id]()}</div><span class="tag">${m.tag}</span>
 <div class="pn"><h3>${m.name}</h3><p>${m.d}</p><button class="cta ${m.cta}" data-act="${m.id}">${I[m.ic]}${m.btn}</button></div></div>`}).join('');
 document.querySelectorAll('.mode').forEach(el=>{
  el.addEventListener('click',e=>{select(el.dataset.id);if(e.target.closest('.cta')){act(el.dataset.id);sparkle(e.target.closest('.cta'))}});
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(el.dataset.id);act(el.dataset.id)}})})}
function select(id){if(sel===id)return;sel=id;save();buzz();document.querySelectorAll('.mode').forEach(el=>{const on=el.dataset.id===id;el.classList.toggle('sel',on);el.setAttribute('aria-pressed',on)})}
function renderBars(){$('#bar').innerHTML=BARS.map(b=>`<button class="bb ${b.w?'w':''}" data-b="${b.id}">${I[b.ic]}<span class="tx"><b>${b.t}${b.soon?'<span class="soon">SEGERA</span>':''}</b><small>${b.d}</small></span>${b.w?I.bot:I.chev}</button>`).join('');
 document.querySelectorAll('.bb').forEach(el=>el.addEventListener('click',()=>bar(el.dataset.b)))}
function money(){renderCurrency()}
function renderCurrency(){$('#gemV').textContent=fmt(PD.gems());$('#coinV').textContent=fmt(PD.coins())}
function pulse(id){const e=$(id);e.classList.remove('pulse');void e.offsetWidth;e.classList.add('pulse')}
// event: currency ikut berubah tanpa reload halaman
UT.Events.on('currencyChanged',renderCurrency);
// ---------- modal
const modal=$('#modal');let mOpen=false;
function openModal(html,init){$('#mb').innerHTML=html;modal.style.display='grid';requestAnimationFrame(()=>modal.classList.add('show'));mOpen=true;init&&init();$('#mx').focus()}
function closeModal(){if(!mOpen)return;mOpen=false;modal.classList.add('closing');modal.classList.remove('show');setTimeout(()=>{modal.style.display='none';modal.classList.remove('closing')},250)}
$('#mx').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
addEventListener('keydown',e=>{if(e.key==='Escape')return closeModal();if(mOpen)return;const k=MODES.findIndex(m=>m.id===sel);if(e.key==='ArrowRight'){select(MODES[(k+1)%4].id)}if(e.key==='ArrowLeft'){select(MODES[(k+3)%4].id)}});
function choose(title,sub,opts,cta,cb){let k=0;
 openModal(`<h2>${title}</h2><p>${sub}</p>${opts.map((o,i)=>`<div class="row opt ${i?'':'sel'}" data-i="${i}"><span>${o[0]}</span><small>${o[1]||''}</small></div>`).join('')}<button class="mb no" id="no">Batal</button><button class="mb" id="go">${cta}</button>`,()=>{
  document.querySelectorAll('.opt').forEach(r=>r.addEventListener('click',()=>{k=+r.dataset.i;document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===r))}));
  $('#no').addEventListener('click',closeModal);$('#go').addEventListener('click',()=>{closeModal();cb(opts[k][0]);buzz()})})}
function info(title,html){openModal(`<h2>${title}</h2>${html}<button class="mb" id="ok" style="width:60%">Oke</button>`,()=>$('#ok').addEventListener('click',closeModal))}
const start=(mode,extra)=>{const p=Object.assign({mode},extra||{});if(typeof window.onModeSelect==='function')window.onModeSelect(p);return p};
// ---------- actions (hubungkan ke game kamu lewat window.onModeSelect)
/* Kirim mode ke gameplay.html. Validasi/normalisasi tetap oleh assets/js/game-integration.js */
const GAME_MODE={'VS Komputer':'cpu','2 Player':'2','3 Player':'3','4 Player':'4'};
function launchGame(v){const m=GAME_MODE[v];if(!m)return;const q=new URLSearchParams(location.search),p=new URLSearchParams({mode:m});
 ['skins','theme','dice','night'].forEach(k=>{if(q.get(k)!==null)p.set(k,q.get(k))});p.set('to','gameplay');location.href='loading.html?'+p.toString()}
function act(id){
 if(id==='classic')choose('Classic','Pilih lawan',[['VS Komputer','Lawan bot'],['2 Player','Duel'],['3 Player','Seru'],['4 Player','Penuh']],'Mulai',v=>{start('classic',{players:parseInt(v)});toast('Memulai Classic · '+v);launchGame(v)});
 if(id==='ranked')choose('Ranked','Pilih format pertandingan',[['Solo','1 vs 1'],['Duo','2 vs 2']],'Masuk',v=>{start('ranked',{format:v});toast('Mencari lawan · '+v+'…')});
 if(id==='team')choose('Buat Tim','Berapa anggota tim?',[['2 Player'],['3 Player'],['4 Player']],'Buat Tim',v=>{const code=Math.random().toString(36).slice(2,7).toUpperCase();start('team',{players:parseInt(v),code});info('Tim Dibuat','<p>Bagikan kode ini ke temanmu:</p><div class="code">'+code+'</div><p style="font-size:1.8rem">'+v+' · menunggu pemain…</p>')});
 if(id==='turnamen')info('Jadwal Turnamen','<div class="row"><span>Sabtu · 19.00</span><small>Solo</small></div><div class="row"><span>Minggu · 16.00</span><small>Duo</small></div><div class="row"><span>Jumat · 20.00</span><small>Squad</small></div>');
}
function bar(id){
 if(id==='khusus')info('Mode Khusus','<div class="row"><span>Weekend Rush</span><small>2x koin</small></div><div class="row"><span>Lucky Dice</span><small>hadiah gem</small></div>');
 if(id==='room'){const code=Math.random().toString(36).slice(2,7).toUpperCase();choose('Custom Room','Buat room & undang temanmu',[['Publik','Siapa saja'],['Privat','Pakai kode']],'Buat Room',v=>{start('custom',{room:code,visibility:v});info('Room Siap','<p>Kode room:</p><div class="code">'+code+'</div>')})}
 if(id==='tutorial')info('Tutorial','<div class="row"><span>1. Lempar dadu</span></div><div class="row"><span>2. Jalankan bidak</span></div><div class="row"><span>3. Kumpulkan koin & menang</span></div>');
 if(id==='event')toast('Event Spesial segera hadir!');
}
// ---------- shop & settings (transaksi lewat PlayerData; tidak ada state kedua)
function buy(type){const g=type==='gem',packs=g?[[10,'Rp 15.000'],[50,'Rp 59.000'],[120,'Rp 129.000']]:[[500,'10 Gem'],[2500,'40 Gem'],[10000,'120 Gem']];
 openModal(`<h2>Tambah ${g?'Gem':'Coin'}</h2>`+packs.map((p,i)=>`<button class="pack" data-i="${i}"><span>+${fmt(p[0])}</span><span>${p[1]}</span></button>`).join(''),()=>{
  document.querySelectorAll('.pack').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.i,p=packs[i];const r=g?PD.addCurrency(0,p[0]):PD.addCurrency(p[0],-[10,40,120][i]);
   if(!r.ok){toast(r.reason==='gem-kurang'?'Gem tidak cukup.':'Transaksi gagal.');return}
   renderCurrency();pulse(g?'#gem':'#coin');toast(g?'Berhasil (mock)':'Berhasil');closeModal()}))})}
document.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click',()=>buy(b.dataset.buy)));
$('#gear').addEventListener('click',()=>{const T=SET(),row=(k,l)=>`<div class="row"><span>${l}</span><button class="tg ${T[k]?'on':''}" data-k="${k}">${T[k]?'ON':'OFF'}</button></div>`;
 openModal(`<h2>Pengaturan</h2>${row('music','Musik')}${row('sound','Suara')}${row('vibration','Getar')}`,()=>{
  document.querySelectorAll('.tg').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.k,v=!SET()[k];const n=PD.setSettings({[k]:v});b.classList.toggle('on',n[k]);b.textContent=n[k]?'ON':'OFF';buzz()}))})});
$('#back').addEventListener('click',()=>{location.href='lobby.html'});
window.openModeScreen=()=>{$('#stage').style.display=''};window.closeModeScreen=()=>{$('#stage').style.display='none'};
renderModes();renderBars();money();
})();
</script>
